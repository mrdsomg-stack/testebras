<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Analytics Hub</title>

<style>
:root {
    --bg-body: #0a0a0a;
    --bg-card: #151515;
    --accent: #00ff88;
    --text: #ffffff;
}

body {
    font-family: Arial;
    background: var(--bg-body);
    color: var(--text);
    margin: 0;
}

.container {
    width: 95%;
    max-width: 900px;
    margin: auto;
}

.card {
    background: var(--bg-card);
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
}

input, button {
    padding: 10px;
    margin: 5px 0;
    width: 100%;
}

button {
    background: var(--accent);
    border: none;
    font-weight: bold;
    cursor: pointer;
}

.player {
    background: #1c1c1c;
    padding: 15px;
    margin-top: 10px;
    cursor: pointer;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th, td {
    border-bottom: 1px solid #333;
    padding: 8px;
    text-align: left;
}

.modal {
    display: none;
    position: fixed;
    background: rgba(0,0,0,0.9);
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
}

.modal-content {
    background: #151515;
    padding: 20px;
    margin: 5% auto;
    width: 90%;
    max-width: 900px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
    <h3>Novo Jogador</h3>
    <input id="name" placeholder="Nome">
    <input id="year" placeholder="Ano início">
    <input id="age" placeholder="Idade início">
    <button onclick="addPlayer()">Cadastrar</button>
</div>

<div id="players"></div>

</div>

<div id="modal" class="modal">
<div class="modal-content">
    <h2 id="playerName"></h2>

    <button onclick="addLine()">+ Temporada</button>

    <table>
        <thead>
            <tr>
                <th>Ano</th><th>Clube</th><th>Liga</th>
                <th>J</th><th>G</th><th>A</th><th></th>
            </tr>
        </thead>
        <tbody id="editTable"></tbody>
    </table>

    <h3>Resumo</h3>

    <div id="summary"></div>

    <button onclick="closeModal()">Fechar</button>
</div>
</div>

<script>

let db = JSON.parse(localStorage.getItem('db')) || [];
let current = null;

function save(){
    localStorage.setItem('db', JSON.stringify(db));
}

function addPlayer(){
    db.push({
        name: name.value,
        year: year.value,
        age: age.value,
        stats: []
    });
    save();
    render();
}

function render(){
    players.innerHTML = '';
    db.forEach((p,i)=>{
        let gols = p.stats.reduce((t,s)=>t+(+s.g||0),0);
        players.innerHTML += `
            <div class="player" onclick="openPlayer(${i})">
                ${p.name} - ${gols} gols
            </div>
        `;
    });
}

function openPlayer(i){
    current = i;
    playerName.innerText = db[i].name;
    modal.style.display = 'block';
    renderEdit();
    renderSummary();
}

function addLine(){
    db[current].stats.push({year:'',club:'',comp:'',j:0,g:0,a:0});
    save();
    renderEdit();
}

function renderEdit(){
    editTable.innerHTML = db[current].stats.map((s,i)=>`
        <tr>
            <td><input value="${s.year}" onchange="upd(${i},'year',this.value)"></td>
            <td><input value="${s.club}" onchange="upd(${i},'club',this.value)"></td>
            <td><input value="${s.comp}" onchange="upd(${i},'comp',this.value)"></td>
            <td><input value="${s.j}" onchange="upd(${i},'j',this.value)"></td>
            <td><input value="${s.g}" onchange="upd(${i},'g',this.value)"></td>
            <td><input value="${s.a}" onchange="upd(${i},'a',this.value)"></td>
            <td><button onclick="del(${i})">X</button></td>
        </tr>
    `).join('');
}

function upd(i,f,v){
    db[current].stats[i][f]=v;
    save();
    renderSummary();
}

function del(i){
    db[current].stats.splice(i,1);
    save();
    renderEdit();
    renderSummary();
}

function renderSummary(){

    let total = {j:0,g:0,a:0};
    let byYear={}, byLeague={}, byClub={};

    db[current].stats.forEach(s=>{
        let j=+s.j||0, g=+s.g||0, a=+s.a||0;

        total.j+=j; total.g+=g; total.a+=a;

        if(!byYear[s.year]) byYear[s.year]={j:0,g:0,a:0};
        byYear[s.year].j+=j;
        byYear[s.year].g+=g;
        byYear[s.year].a+=a;

        if(!byLeague[s.comp]) byLeague[s.comp]={j:0,g:0,a:0};
        byLeague[s.comp].j+=j;
        byLeague[s.comp].g+=g;
        byLeague[s.comp].a+=a;

        if(!byClub[s.club]) byClub[s.club]={j:0,g:0,a:0};
        byClub[s.club].j+=j;
        byClub[s.club].g+=g;
        byClub[s.club].a+=a;
    });

    summary.innerHTML = `
        <h4>Geral</h4>
        <table>
            <tr><th>J</th><th>G</th><th>A</th></tr>
            <tr><td>${total.j}</td><td>${total.g}</td><td>${total.a}</td></tr>
        </table>

        <h4>Por Ano</h4>
        <table>
            <tr><th>Ano</th><th>J</th><th>G</th><th>A</th></tr>
            ${Object.entries(byYear).map(([k,v])=>`
                <tr><td>${k}</td><td>${v.j}</td><td>${v.g}</td><td>${v.a}</td></tr>
            `).join('')}
        </table>

        <h4>Por Liga</h4>
        <table>
            <tr><th>Liga</th><th>J</th><th>G</th><th>A</th></tr>
            ${Object.entries(byLeague).map(([k,v])=>`
                <tr><td>${k}</td><td>${v.j}</td><td>${v.g}</td><td>${v.a}</td></tr>
            `).join('')}
        </table>

        <h4>Por Clube</h4>
        <table>
            <tr><th>Clube</th><th>J</th><th>G</th><th>A</th></tr>
            ${Object.entries(byClub).map(([k,v])=>`
                <tr><td>${k}</td><td>${v.j}</td><td>${v.g}</td><td>${v.a}</td></tr>
            `).join('')}
        </table>
    `;
}

function closeModal(){
    modal.style.display='none';
    render();
}

render();

</script>

</body>
</html>
