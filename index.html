<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Analytics Hub - Premium</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: #1c2126; /* Cor do fundo do card conforme imagem */
            --bg-item: #2c3136; /* Cor dos itens internos */
            --accent: #2fb996; /* Verde esmeralda da imagem */
            --text: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: #000;
            border-bottom: 1px solid #333;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .container { width: 95%; max-width: 900px; margin-top: 20px; }

        /* Estilo do Cadastro */
        .card-main {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        input, select {
            background: #121212; color: white; border: 1px solid #444;
            padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box;
            margin-bottom: 10px;
        }

        .btn-green {
            background: var(--accent); color: white; border: none; padding: 14px;
            border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%;
            text-transform: uppercase; transition: 0.3s;
        }

        /* Lista de Jogadores Simplificada */
        .player-row {
            background: var(--bg-card);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .player-row:hover { border-color: var(--accent); }

        /* MODAL DESIGN PREMIUM */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto;
        }

        .modal-content {
            background: var(--bg-card); margin: 2% auto; padding: 30px;
            width: 90%; max-width: 850px; border-radius: 20px; position: relative;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .btn-sair { background: var(--accent); color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        /* Resumo Total Topo */
        .resumo-total-box {
            background: var(--bg-item);
            padding: 20px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            text-align: center;
            margin-bottom: 20px;
        }
        .resumo-total-box div span { display: block; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
        .resumo-total-box div b { font-size: 1.8rem; color: #f2ba49; } /* Cor dourada pros números */

        /* Tabelas Internas */
        .section-box {
            background: var(--bg-item);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .section-title { font-size: 0.8rem; font-weight: bold; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; display: block; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 0.75rem; color: var(--text-dim); padding: 10px; }
        td { padding: 12px 10px; font-size: 0.9rem; border-bottom: 1px solid #3d4247; }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background: rgba(255,255,255,0.02); }

        .btn-gerenciar {
            background: var(--accent); color: white; border: none; padding: 15px;
            border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%;
            margin-top: 10px; font-size: 1rem;
        }

        /* Modal Edição (Tabelas Inputs) */
        .input-table input { margin-bottom: 0; padding: 5px; background: #111; font-size: 0.8rem; }
    </style>
</head>
<body>

<header>Gestão de Atletas Profissionais</header>

<div class="container">
    <div class="card-main">
        <label>Nome do Atleta</label>
        <input type="text" id="pName" placeholder="Ex: Caio">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div><label>Ano Início</label><input type="number" id="pYear" value="1906"></div>
            <div><label>Idade Início</label><input type="number" id="pAge" value="19"></div>
        </div>
        <button class="btn-green" onclick="addPlayer()">Cadastrar Jogador</button>
    </div>

    <div id="listContainer"></div>
</div>

<!-- MODAL DE VISUALIZAÇÃO (DESIGN DA IMAGEM) -->
<div id="viewModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <h1 id="vName" style="margin:0;"></h1>
                <p id="vCareer" style="color:var(--text-dim); font-size:0.9rem; margin:5px 0 0 0;"></p>
            </div>
            <button class="btn-sair" onclick="closeModal('viewModal')">SAIR</button>
        </div>

        <div class="resumo-total-box">
            <div><span>Jogos</span><b id="tJ">0</b></div>
            <div><span>Gols</span><b id="tG">0</b></div>
            <div><span>Assistências</span><b id="tA">0</b></div>
        </div>

        <div class="section-box">
            <span class="section-title">Estatísticas por Ano</span>
            <table id="tableYear"></table>
        </div>

        <div class="section-box">
            <span class="section-title">Estatísticas por Liga</span>
            <table id="tableLeague"></table>
        </div>

        <div class="section-box">
            <span class="section-title">Estatísticas por Clube</span>
            <table id="tableClub"></table>
        </div>

        <button class="btn-gerenciar" onclick="openEdit()">GERENCIAR TEMPORADAS</button>
    </div>
</div>

<!-- MODAL DE EDIÇÃO -->
<div id="editModal" class="modal">
    <div class="modal-content" style="max-width: 900px;">
        <h2 style="color:var(--accent)">Editar Temporadas</h2>
        <button class="btn-sair" style="margin-bottom:15px;" onclick="addStatRow()">+ Nova Temporada</button>
        <div style="overflow-x:auto;">
            <table class="input-table">
                <thead><tr><th>Ano</th><th>Clube</th><th>Liga</th><th>J</th><th>G</th><th>A</th><th></th></tr></thead>
                <tbody id="editBody"></tbody>
            </table>
        </div>
        <button class="btn-green" style="margin-top:20px;" onclick="closeModal('editModal'); render();">SALVAR E VOLTAR</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('fb_premium_v1')) || [];
    let curIdx = null;

    function addPlayer() {
        const name = document.getElementById('pName').value;
        const year = document.getElementById('pYear').value;
        const age = document.getElementById('pAge').value;
        if(!name) return;
        db.push({ name, year, age, stats: [] });
        save(); render();
        document.getElementById('pName').value = '';
    }

    function render() {
        const cont = document.getElementById('listContainer');
        cont.innerHTML = '';
        db.forEach((p, i) => {
            let tg = p.stats.reduce((a, s) => a + (parseInt(s.g)||0), 0);
            cont.innerHTML += `<div class="player-row" onclick="view(${i})">
                <span><b>${p.name}</b></span>
                <span style="color:var(--accent)">${tg} GOLS</span>
            </div>`;
        });
    }

    function view(i) {
        curIdx = i; const p = db[i];
        document.getElementById('vName').innerText = p.name;
        document.getElementById('vCareer').innerText = `Início em ${p.year} com ${p.age} anos.`;
        
        let totals = {j:0, g:0, a:0}, yMap = {}, lMap = {}, cMap = {};
        p.stats.forEach(s => {
            let j = parseInt(s.j)||0, g = parseInt(s.g)||0, a = parseInt(s.a)||0;
            totals.j += j; totals.g += g; totals.a += a;
            const up = (m, k) => { if(!m[k]) m[k] = {j:0, g:0, a:0}; m[k].j += j; m[k].g += g; m[k].a += a; };
            up(yMap, s.year); up(lMap, s.league); up(cMap, s.club);
        });

        document.getElementById('tJ').innerText = totals.j;
        document.getElementById('tG').innerText = totals.g;
        document.getElementById('tA').innerText = totals.a;

        const mkT = (m, h) => `<thead><tr><th>${h}</th><th>J</th><th>G</th><th>A</th></tr></thead><tbody>` + 
            Object.entries(m).map(([k,v])=>`<tr><td>${k}</td><td>${v.j}</td><td>${v.g}</td><td>${v.a}</td></tr>`).join('') + `</tbody>`;

        document.getElementById('tableYear').innerHTML = mkT(yMap, "Ano");
        document.getElementById('tableLeague').innerHTML = mkT(lMap, "Competição");
        document.getElementById('tableClub').innerHTML = mkT(cMap, "Clube");
        document.getElementById('viewModal').style.display = 'block';
    }

    function openEdit() {
        document.getElementById('viewModal').style.display = 'none';
        document.getElementById('editModal').style.display = 'block';
        const eb = document.getElementById('editBody');
        eb.innerHTML = db[curIdx].stats.map((s, i) => `<tr>
            <td><input type="text" value="${s.year}" onchange="upS(${i},'year',this.value)"></td>
            <td><input type="text" value="${s.club}" onchange="upS(${i},'club',this.value)"></td>
            <td><input type="text" value="${s.league}" onchange="upS(${i},'league',this.value)"></td>
            <td><input type="number" value="${s.j}" onchange="upS(${i},'j',this.value)"></td>
            <td><input type="number" value="${s.g}" onchange="upS(${i},'g',this.value)"></td>
            <td><input type="number" value="${s.a}" onchange="upS(${i},'a',this.value)"></td>
            <td><button onclick="remS(${i})" style="color:red; background:none; border:none;">X</button></td>
        </tr>`).join('');
    }

    function addStatRow() { db[curIdx].stats.push({year:'', club:'', league:'', j:0, g:0, a:0}); openEdit(); }
    function upS(i, f, v) { db[curIdx].stats[i][f] = v; save(); }
    function remS(i) { db[curIdx].stats.splice(i, 1); save(); openEdit(); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function save() { localStorage.setItem('fb_premium_v1', JSON.stringify(db)); }
    render();
</script>
</body>
</html>
