<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Manager 2026 | Dash</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --text: #e2e8f0;
            --bg: #020617;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: radial-gradient(circle at top left, #1e293b, #020617);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Navigation */
        nav {
            width: 250px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--glass-border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .nav-item {
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* Main Content */
        main { flex: 1; padding: 2rem; overflow-y: auto; }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        h2 { margin-bottom: 1.5rem; color: var(--accent); }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid var(--glass-border); }
        td { padding: 12px; border-bottom: 1px solid var(--glass-border); }

        .btn {
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn:hover { transform: translateY(-2px); opacity: 0.9; }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            background: var(--glass-border);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            nav { width: 100%; flex-direction: row; overflow-x: auto; }
        }
    </style>
</head>
<body>

<nav>
    <h1 style="font-size: 1.2rem; margin-bottom: 1rem;">⚽ PRO MANAGER</h1>
    <div class="nav-item active" onclick="showSection('elenco')">Meu Elenco</div>
    <div class="nav-item" onclick="showSection('classificacao')">Classificação</div>
    <div class="nav-item" onclick="showSection('mercado')">Mercado</div>
    <div class="nav-item" onclick="showSection('jogo')">Próximo Jogo</div>
    <div style="margin-top: auto;">
        <button class="btn" style="background: var(--danger)" onclick="resetGame()">Resetar Jogo</button>
    </div>
</nav>

<main id="main-content">
    <!-- As seções serão injetadas aqui pelo JS -->
</main>

<script>
    // 1. Dados Iniciais (Simulando JSON)
    const initialData = {
        rodada: 1,
        meuTime: "Vasco",
        times: [
            { id: 1, nome: "Vasco", pontos: 0, saldo: 0, jogadores: [
                { nome: "Léo Jardim", pos: "GOL", for: 82, idade: 28 },
                { nome: "Vegetti", pos: "ATA", for: 85, idade: 35 },
                { nome: "Payet", pos: "MEI", for: 84, idade: 36 },
                { nome: "Lucas Piton", pos: "LAT", for: 78, idade: 23 }
            ]},
            { id: 2, nome: "Flamengo", pontos: 0, saldo: 0, jogadores: [
                { nome: "Rossi", pos: "GOL", for: 81, idade: 29 },
                { nome: "Arrascaeta", pos: "MEI", for: 86, idade: 30 },
                { nome: "Pedro", pos: "ATA", for: 85, idade: 26 }
            ]},
            { id: 3, nome: "Palmeiras", pontos: 0, saldo: 0, jogadores: [
                { nome: "Weverton", pos: "GOL", for: 83, idade: 36 },
                { nome: "Rony", pos: "ATA", for: 80, idade: 28 },
                { nome: "Raphael Veiga", pos: "MEI", for: 84, idade: 28 }
            ]},
            { id: 4, nome: "Botafogo", pontos: 0, saldo: 0, jogadores: [
                { nome: "John", pos: "GOL", for: 79, idade: 28 },
                { nome: "Luiz Henrique", pos: "ATA", for: 82, idade: 23 },
                { nome: "Almada", pos: "MEI", for: 83, idade: 23 }
            ]}
        ],
        mercado: [
            { nome: "Neymar Jr", pos: "ATA", for: 89, idade: 32, valor: 500 },
            { nome: "Casemiro", pos: "VOL", for: 84, idade: 32, valor: 300 }
        ]
    };

    // 2. Motor do Jogo
    let gameState = JSON.parse(localStorage.getItem('webfoot_save')) || initialData;

    function save() { localStorage.setItem('webfoot_save', JSON.stringify(gameState)); }

    function resetGame() {
        localStorage.removeItem('webfoot_save');
        location.reload();
    }

    // 3. UI Renders
    function showSection(section) {
        const content = document.getElementById('main-content');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        
        if (section === 'elenco') {
            const time = gameState.times.find(t => t.nome === gameState.meuTime);
            content.innerHTML = `
                <div class="glass-card">
                    <h2>📋 Elenco: ${time.nome}</h2>
                    <table>
                        <thead><tr><th>Jogador</th><th>Posição</th><th>Força</th><th>Idade</th></tr></thead>
                        <tbody>
                            ${time.jogadores.map(j => `<tr><td>${j.nome}</td><td><span class="badge">${j.pos}</span></td><td>${j.for}</td><td>${j.idade}</td></tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        } 
        else if (section === 'classificacao') {
            const sortedTimes = [...gameState.times].sort((a,b) => b.pontos - a.pontos || b.saldo - a.saldo);
            content.innerHTML = `
                <div class="glass-card">
                    <h2>🏆 Tabela de Classificação</h2>
                    <table>
                        <thead><tr><th>Pos</th><th>Time</th><th>Pontos</th><th>Saldo</th></tr></thead>
                        <tbody>
                            ${sortedTimes.map((t, i) => `<tr><td>${i+1}º</td><td>${t.nome}</td><td><b>${t.pontos}</b></td><td>${t.saldo}</td></tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
        else if (section === 'jogo') {
            content.innerHTML = `
                <div class="glass-card" style="text-align: center">
                    <h2>Rodada ${gameState.rodada}</h2>
                    <div style="display:flex; justify-content: space-around; align-items: center; margin: 2rem 0;">
                        <h3>${gameState.meuTime}</h3>
                        <h1 style="font-size: 3rem">VS</h1>
                        <h3>Adversário Aleatório</h3>
                    </div>
                    <button class="btn" onclick="simularRodada()">Jogar Partida</button>
                </div>
            `;
        }
    }

    // 4. Lógica de Simulação (Coração do Game Design)
    function simularRodada() {
        const meuTime = gameState.times.find(t => t.nome === gameState.meuTime);
        const adversario = gameState.times.find(t => t.nome !== gameState.meuTime); // Simplificado para o exemplo

        const calcForca = (time) => time.jogadores.reduce((acc, j) => acc + j.for, 0) / time.jogadores.length;
        
        const forcaA = calcForca(meuTime) + (Math.random() * 20); // Fator sorte
        const forcaB = calcForca(adversario) + (Math.random() * 20);

        let golA = Math.floor(Math.random() * (forcaA / 20));
        let golB = Math.floor(Math.random() * (forcaB / 20));

        // Atualiza Pontos
        if (golA > golB) meuTime.pontos += 3;
        else if (golA === golB) { meuTime.pontos += 1; adversario.pontos += 1; }
        else adversario.pontos += 3;

        meuTime.saldo += (golA - golB);
        adversario.saldo += (golB - golA);

        gameState.rodada++;
        save();
        alert(`Fim de jogo! ${meuTime.nome} ${golA} x ${golB} ${adversario.nome}`);
        showSection('classificacao');
    }

    // Início
    showSection('elenco');
</script>

</body>
</html>
