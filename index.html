<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Career Manager</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --accent: #00ff88;
            --text: #ffffff;
            --header-bg: #000000;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--header-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container { width: 95%; max-width: 1000px; margin-top: 20px; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        label { display: block; margin-bottom: 5px; color: var(--accent); font-size: 0.7rem; font-weight: bold; }

        select, input {
            width: 100%;
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }

        .btn-main { width: 100%; background: var(--accent); color: black; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px;}
        
        .player-card {
            border-left: 5px solid var(--accent);
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
        th { text-align: left; color: var(--accent); border-bottom: 1px solid #333; padding: 8px; }
        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .summary-box { display: flex; gap: 20px; margin-top: 10px; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<header>Controle de Estatísticas de Atletas</header>

<div class="container">
    <!-- Cadastro de Jogador -->
    <div class="card">
        <h3>👤 Novo Atleta</h3>
        <input type="text" id="playerName" placeholder="Nome Completo do Jogador">
        <button class="btn-main" onclick="createPlayer()">Cadastrar Jogador</button>
    </div>

    <!-- Adicionar Estatística -->
    <div class="card">
        <h3>📊 Registrar Temporada</h3>
        <label>Selecionar Jogador</label>
        <select id="selectPlayer"></select>

        <div class="grid-inputs">
            <div><label>Ano</label><input type="text" id="statYear" placeholder="2026"></div>
            <div><label>Clube</label><input type="text" id="statClub" placeholder="Real Madrid"></div>
            <div><label>Competição</label><input type="text" id="statComp" placeholder="La Liga"></div>
        </div>
        <div class="grid-inputs">
            <div><label>Jogos</label><input type="number" id="statMatches" value="0"></div>
            <div><label>Gols</label><input type="number" id="statGoals" value="0"></div>
            <div><label>Assists</label><input type="number" id="statAssists" value="0"></div>
        </div>
        <button class="btn-main" onclick="addStat()">Adicionar ao Histórico</button>
    </div>

    <!-- Lista de Jogadores e Carreiras -->
    <div id="playersList"></div>
</div>

<script>
    let playersDB = JSON.parse(localStorage.getItem('fb_players_stats')) || [];

    function createPlayer() {
        const name = document.getElementById('playerName').value;
        if(!name) return alert("Nome do jogador?");
        playersDB.push({ name, history: [] });
        saveAndRender();
        document.getElementById('playerName').value = '';
    }

    function addStat() {
        const playerIndex = document.getElementById('selectPlayer').value;
        if(playerIndex === "") return alert("Selecione um jogador!");

        const newStat = {
            year: document.getElementById('statYear').value,
            club: document.getElementById('statClub').value,
            comp: document.getElementById('statComp').value,
            m: parseInt(document.getElementById('statMatches').value) || 0,
            g: parseInt(document.getElementById('statGoals').value) || 0,
            a: parseInt(document.getElementById('statAssists').value) || 0
        };

        playersDB[playerIndex].history.push(newStat);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('fb_players_stats', JSON.stringify(playersDB));
        renderPlayers();
    }

    function renderPlayers() {
        const list = document.getElementById('playersList');
        const select = document.getElementById('selectPlayer');
        list.innerHTML = '';
        select.innerHTML = '<option value="">-- Selecione --</option>';

        playersDB.forEach((player, pIdx) => {
            // Preencher select
            select.innerHTML += `<option value="${pIdx}">${player.name}</option>`;

            // Calcular Totais
            let tM = 0, tG = 0, tA = 0;
            player.history.forEach(s => { tM += s.m; tG += s.g; tA += s.a; });

            // Render Card do Jogador
            let rows = player.history.map((s, sIdx) => `
                <tr>
                    <td>${s.year}</td>
                    <td>${s.club}</td>
                    <td>${s.comp}</td>
                    <td>${s.m}</td>
                    <td>${s.g}</td>
                    <td>${s.a}</td>
                    <td><button onclick="deleteStat(${pIdx}, ${sIdx})" style="color:red; background:none; border:none; cursor:pointer;">X</button></td>
                </tr>
            `).join('');

            list.innerHTML += `
                <div class="card player-card">
                    <div style="display:flex; justify-content:space-between;">
                        <h2>${player.name}</h2>
                        <button onclick="deletePlayer(${pIdx})" style="background:#ff4d4d; border:none; padding:5px 10px; border-radius:5px; color:white; cursor:pointer;">Excluir Atleta</button>
                    </div>
                    <div class="summary-box">
                        <span>Total Jogos: ${tM}</span>
                        <span>Total Gols: ${tG}</span>
                        <span>Total Assists: ${tA}</span>
                    </div>
                    <table>
                        <thead>
                            <tr><th>Ano</th><th>Clube</th><th>Comp.</th><th>PJ</th><th>G</th><th>A</th><th></th></tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        });
    }

    function deleteStat(pIdx, sIdx) { playersDB[pIdx].history.splice(sIdx, 1); saveAndRender(); }
    function deletePlayer(idx) { if(confirm("Apagar jogador?")) { playersDB.splice(idx, 1); saveAndRender(); } }

    renderPlayers();
</script>
</body>
</html>
