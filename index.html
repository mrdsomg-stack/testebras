<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marechal Lott</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;padding:16px}
:root{--green:#3fb950;--gold:#f0883e;--red:#f85149;--blue:#58a6ff;--purple:#a371f7;--yellow:#e3b341;--surface:#161b22;--surface2:#21262d;--border:#30363d;--dim:#8b949e}
.app{max-width:1050px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
h1{font-size:1.2rem;font-weight:600;color:#fff}
h1 span{color:var(--green);font-size:.75rem;display:block;font-weight:400;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--green);color:#000;border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:.8rem;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--border)}
.btn.ghost:hover{color:#fff;border-color:var(--dim)}
.btn.danger{background:transparent;color:var(--red);border:1px solid transparent;padding:4px 8px}
.btn.danger:hover{background:rgba(248,81,73,.12);border-color:var(--red)}
.btn.edit-btn{background:transparent;color:var(--gold);border:1px solid transparent;padding:4px 8px}
.btn.tab-btn{background:transparent;color:var(--dim);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:.8rem;font-weight:400}
.btn.tab-btn.active{background:rgba(240,136,62,.18);border-color:var(--gold);color:var(--gold);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:16px;scrollbar-width:thin;flex-wrap:wrap}
.chip-wrap{display:flex;align-items:center;gap:4px}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 16px;cursor:pointer;white-space:nowrap;transition:all .15s;font-size:.85rem}
.chip:hover{border-color:var(--dim)}
.chip.active{border-color:var(--green);background:rgba(63,185,80,.12);color:var(--green);font-weight:600}
.chip .birth{font-size:.7rem;color:var(--dim);margin-left:4px}
.chip-del{background:transparent;border:none;color:var(--dim);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:.8rem;transition:color .15s;line-height:1}
.chip-del:hover{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.hero{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.hero-top{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.hero-stats{display:flex;gap:24px;flex-wrap:wrap}
.stat{text-align:center}
.stat .val{font-size:1.8rem;font-weight:700;line-height:1}
.stat .lbl{font-size:.65rem;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.stat.green .val{color:var(--green)}
.stat.gold .val{color:var(--gold)}
.stat.blue .val{color:var(--blue)}
.form-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.form-grid input,.form-grid select{background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:9px 12px;border-radius:8px;font-size:.85rem;width:100%;outline:none;transition:border .15s}
.form-grid input:focus,.form-grid select:focus{border-color:var(--green)}
.form-grid input::placeholder{color:var(--dim)}
.form-grid select option{background:#1c2128}
.form-actions{display:flex;gap:8px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:400px}
th{color:var(--dim);font-size:.7rem;padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid rgba(48,54,61,.5)}
tr:hover td{background:rgba(255,255,255,.02)}
.tag{background:rgba(240,136,62,.15);color:var(--gold);padding:2px 8px;border-radius:12px;font-size:.72rem;font-weight:600}
.tag.nt{background:rgba(227,179,65,.15);color:var(--yellow)}
.actions{display:flex;gap:4px}
.g-num{font-weight:700;color:var(--green)}
.a-num{font-weight:700;color:var(--blue)}
.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:420px}
.modal h2{font-size:1rem;margin-bottom:20px;font-weight:600}
.modal input,.modal select{background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:10px 14px;border-radius:8px;font-size:.9rem;width:100%;margin-bottom:12px;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--green)}
.modal select option{background:#1c2128}
.modal-actions{display:flex;gap:8px;margin-top:8px}
.modal-actions .btn{flex:1;padding:10px}
.toast{position:fixed;bottom:24px;right:24px;background:#238636;color:#fff;padding:10px 20px;border-radius:10px;font-size:.85rem;z-index:200;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-title{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:500}
.toggle-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;user-select:none}
.toggle-wrap input[type=checkbox]{accent-color:var(--yellow);width:16px;height:16px;cursor:pointer}
.toggle-wrap label{font-size:.88rem;color:#e6edf3;cursor:pointer;flex:1}
.toggle-wrap .nt-badge{font-size:.7rem;background:rgba(227,179,65,.18);color:var(--yellow);padding:2px 8px;border-radius:10px;font-weight:600}
.title-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.title-item{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid rgba(227,179,65,.3);border-radius:8px;padding:8px 12px}
.title-trophy{font-size:1rem}
.title-name{flex:1;font-size:.85rem;font-weight:600;color:var(--yellow)}
.title-del{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:.8rem;padding:2px 6px;border-radius:4px;transition:color .15s}
.title-del:hover{color:var(--red)}
.title-add-row{display:flex;gap:8px;margin-top:8px}
.title-add-row input{background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:.85rem;flex:1;outline:none}
.title-add-row input:focus{border-color:var(--yellow)}
.title-add-row .btn{background:rgba(227,179,65,.2);color:var(--yellow);border:1px solid rgba(227,179,65,.4);font-size:.8rem;padding:8px 14px;white-space:nowrap}
.title-add-row .btn:hover{background:rgba(227,179,65,.35)}
.nt-season-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(227,179,65,.15);border:1px solid rgba(227,179,65,.3);border-radius:12px;padding:2px 10px;font-size:.72rem;color:var(--yellow);font-weight:600;margin-left:6px}
.nt-year-group{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.nt-year-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(227,179,65,.06)}
.nt-year-label{font-weight:700;color:var(--yellow);font-size:.9rem}
.nt-year-stats{display:flex;gap:16px;font-size:.78rem}
.nt-year-body{padding:12px 16px}
.career-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.career-hero{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.avatar{width:56px;height:56px;border-radius:50%;background:rgba(163,113,247,.2);border:2px solid var(--purple);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:var(--purple);flex-shrink:0}
.career-name{font-size:1.2rem;font-weight:700}
.career-meta{font-size:.8rem;color:var(--dim);margin-top:3px}
.career-stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.career-stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.career-stat .val{font-size:1.5rem;font-weight:700;line-height:1;margin-bottom:4px}
.career-stat .lbl{font-size:.65rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.season-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(48,54,61,.5)}
.season-row:last-child{border-bottom:none}
.season-yr{font-weight:700;min-width:48px;color:#fff}
.season-club{font-size:.8rem;color:var(--dim);min-width:130px}
.season-bar-wrap{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.season-bar{height:100%;background:var(--green);border-radius:3px;transition:width .4s}
.season-nums{display:flex;gap:12px;min-width:100px;justify-content:flex-end;font-size:.8rem}
.comp-career-table{width:100%;border-collapse:collapse;font-size:.82rem}
.comp-career-table th{color:var(--dim);font-size:.7rem;padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;font-weight:500;text-transform:uppercase}
.comp-career-table td{padding:8px 10px;border-bottom:1px solid rgba(48,54,61,.4)}
.comp-career-table tr:hover td{background:rgba(255,255,255,.02)}
.divider{height:1px;background:var(--border);margin:16px 0}
.section-label{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;font-weight:500}
.titles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:4px}
.title-card{background:rgba(227,179,65,.08);border:1px solid rgba(227,179,65,.25);border-radius:10px;padding:12px 16px;display:flex;align-items:flex-start;gap:10px}
.title-card-trophy{font-size:1.2rem;margin-top:1px}
.title-card-name{font-size:.88rem;font-weight:700;color:var(--yellow);line-height:1.3}
.title-card-season{font-size:.72rem;color:var(--dim);margin-top:3px}
.rank-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.rank-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.rank-tab{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:.78rem;color:var(--dim);cursor:pointer;transition:all .15s}
.rank-tab.active{background:rgba(63,185,80,.15);border-color:var(--green);color:var(--green);font-weight:600}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(48,54,61,.4)}
.rank-row:last-child{border-bottom:none}
.rank-pos{font-size:.85rem;font-weight:700;min-width:24px;text-align:center}
.rank-name{flex:1;font-size:.88rem}
.rank-val{font-size:1rem;font-weight:700;min-width:40px;text-align:right}
.season-del-btn{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:.75rem;padding:2px 6px;border-radius:4px;transition:color .15s;margin-left:2px}
.season-del-btn:hover{color:var(--red)}
.nt-add-year-wrap{background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:14px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.nt-add-year-wrap input{background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:.85rem;outline:none;min-width:80px;flex:1}
.nt-add-year-wrap input:focus{border-color:var(--yellow)}
.nt-add-year-wrap .btn{background:rgba(227,179,65,.2);color:var(--yellow);border:1px solid rgba(227,179,65,.4);white-space:nowrap}
.nt-add-year-wrap .btn:hover{background:rgba(227,179,65,.35)}
/* PESSOAL / CONTRATOS */
.personal-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.contract-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;position:relative;transition:border-color .2s}
.contract-card:hover{border-color:var(--dim)}
.contract-card.active-contract{border-color:rgba(63,185,80,.5);background:rgba(63,185,80,.04)}
.contract-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.contract-club{font-size:1rem;font-weight:700;color:#fff}
.contract-badge{font-size:.68rem;padding:3px 10px;border-radius:10px;font-weight:600}
.contract-badge.mensal{background:rgba(88,166,255,.15);color:var(--blue)}
.contract-badge.anual{background:rgba(163,113,247,.15);color:var(--purple)}
.contract-badge.ativo{background:rgba(63,185,80,.15);color:var(--green)}
.contract-badge.encerrado{background:rgba(48,54,61,.6);color:var(--dim)}
.contract-details{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.contract-detail-item{background:rgba(255,255,255,.03);border-radius:8px;padding:10px 12px}
.contract-detail-item .lbl{font-size:.62rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.contract-detail-item .val{font-size:.95rem;font-weight:700}
.contract-summary{background:rgba(240,136,62,.08);border:1px solid rgba(240,136,62,.2);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.contract-summary .total-label{font-size:.72rem;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
.contract-summary .total-val{font-size:1.15rem;font-weight:700;color:var(--gold)}
.contract-actions{display:flex;gap:6px;margin-top:10px}
.contracts-total-bar{background:rgba(240,136,62,.08);border:1px solid rgba(240,136,62,.25);border-radius:12px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.contracts-total-bar .big-num{font-size:2rem;font-weight:700;color:var(--gold)}
.contracts-total-bar .sub{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Marechal Lott <span>Gestão por Temporada</span></h1>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="openModal('modalPlayer')">+ Jogador</button>
      <button class="btn ghost" id="btnRanking" style="display:none" onclick="showRanking()">🏆 Ranking</button>
      <button class="btn" id="btnSeason" style="display:none" onclick="openModal('modalSeason')">+ Temporada</button>
    </div>
  </header>
  <div id="playerList" class="chips"></div>
  <div id="mainDash" style="display:none">
    <div class="tabs" id="seasonTabs"></div>
    <div id="seasonContent" style="display:none"></div>
    <div id="careerContent" style="display:none"></div>
    <div id="rankingContent" style="display:none"></div>
    <div id="personalContent" style="display:none"></div>
  </div>
  <div id="emptyPlayers" class="empty" style="padding:60px 20px">
    <div style="font-size:1rem;color:#fff;margin-bottom:6px">Nenhum atleta cadastrado</div>
    <div>Clique em <b style="color:var(--green)">+ Jogador</b> para começar</div>
  </div>
</div>

<!-- Modal Jogador -->
<div id="modalPlayer" class="overlay" onclick="closeModalOnBg(event,'modalPlayer')">
  <div class="modal">
    <h2>Cadastrar Atleta</h2>
    <input type="text" id="pNameInput" placeholder="Nome completo">
    <input type="date" id="pBirthInput">
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalPlayer')">Cancelar</button>
      <button class="btn" onclick="savePlayer()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Temporada -->
<div id="modalSeason" class="overlay" onclick="closeModalOnBg(event,'modalSeason')">
  <div class="modal">
    <h2>Nova Temporada</h2>
    <div class="toggle-wrap" onclick="toggleNtCheckbox()">
      <input type="checkbox" id="sNtCheck" onclick="event.stopPropagation()">
      <label for="sNtCheck">Temporada pela Seleção Nacional</label>
      <span class="nt-badge">🏴 Seleção</span>
    </div>
    <div id="sClubRow">
      <input type="text" id="sClubInput" placeholder="Clube (ex: Flamengo)">
    </div>
    <input type="text" id="sNameInput" placeholder="Ano (ex: 2026)">
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalSeason')">Cancelar</button>
      <button class="btn" onclick="saveSeason()">Criar</button>
    </div>
  </div>
</div>

<!-- Modal Confirmar Exclusão -->
<div id="modalConfirm" class="overlay" onclick="closeModalOnBg(event,'modalConfirm')">
  <div class="modal">
    <h2 id="confirmTitle">Confirmar exclusão</h2>
    <p id="confirmMsg" style="color:var(--dim);font-size:.88rem;margin-bottom:20px;line-height:1.5"></p>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalConfirm')">Cancelar</button>
      <button class="btn" style="background:var(--red);color:#fff" onclick="confirmAction()">Excluir</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let state={players:[],activePlayerIdx:null,activeSeason:null,activeView:'season'};
let editingEntryId=null;
let editingNtYearId=null;
let editingContractId=null;
let pendingConfirm=null;
let rankComp=null;

window.onload=()=>{
  const saved=localStorage.getItem('marechal_lott_v7');
  if(saved){state=JSON.parse(saved);}
  else{
    const old=localStorage.getItem('marechal_lott_v6');
    if(old){
      const d=JSON.parse(old);
      state.players=(d.players||[]).map(p=>({
        ...p,
        contracts:p.contracts||[],
        seasons:Object.fromEntries(Object.entries(p.seasons||{}).map(([k,s])=>[k,{
          ...s,
          entries:(s.entries||[]).map(e=>({...e,year:e.year||k})),
          ntYears:(s.ntYears||[])
        }]))
      }));
      state.activePlayerIdx=d.activePlayerIdx!==undefined?d.activePlayerIdx:null;
      state.activeSeason=d.activeSeason||null;
    }
  }
  state.activeView='season';
  render();
};

function save(){localStorage.setItem('marechal_lott_v7',JSON.stringify(state));}

function toast(msg,isErr){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=isErr?'#b91c1c':'#238636';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function closeModalOnBg(e,id){if(e.target.id===id)closeModal(id);}

function confirmDialog(title,msg,fn){
  pendingConfirm=fn;
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;
  openModal('modalConfirm');
}
function confirmAction(){
  closeModal('modalConfirm');
  if(pendingConfirm)pendingConfirm();
  pendingConfirm=null;
}

function toggleNtCheckbox(){
  const cb=document.getElementById('sNtCheck');
  cb.checked=!cb.checked;
  document.getElementById('sClubRow').style.display=cb.checked?'none':'block';
}

function fmtEuro(v){return'€'+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}

function savePlayer(){
  const name=document.getElementById('pNameInput').value.trim();
  const birth=document.getElementById('pBirthInput').value;
  if(!name||!birth){toast('Preencha nome e data de nascimento','err');return;}
  state.players.push({name,birth,seasons:{},contracts:[]});
  save();render();
  closeModal('modalPlayer');
  document.getElementById('pNameInput').value='';
  document.getElementById('pBirthInput').value='';
  toast('Jogador cadastrado!');
}

function deletePlayer(idx,e){
  e.stopPropagation();
  const p=state.players[idx];
  confirmDialog('Excluir jogador',`Tem certeza que deseja excluir "${p.name}"? Todos os dados serão perdidos.`,()=>{
    state.players.splice(idx,1);
    if(state.activePlayerIdx===idx){state.activePlayerIdx=state.players.length>0?0:null;state.activeSeason=null;}
    else if(state.activePlayerIdx>idx)state.activePlayerIdx--;
    save();render();
    toast('Jogador removido');
  });
}

function render(){
  const list=document.getElementById('playerList');
  const ep=document.getElementById('emptyPlayers');
  list.innerHTML='';
  if(!state.players||state.players.length===0){
    ep.style.display='block';
    document.getElementById('mainDash').style.display='none';
    document.getElementById('btnSeason').style.display='none';
    document.getElementById('btnRanking').style.display='none';
    return;
  }
  ep.style.display='none';
  state.players.forEach((p,idx)=>{
    const wrap=document.createElement('div');
    wrap.className='chip-wrap';
    const c=document.createElement('div');
    c.className='chip'+(idx===state.activePlayerIdx?' active':'');
    const yr=p.birth?p.birth.split('-')[0]:'';
    c.innerHTML=`${p.name}<span class="birth">${yr}</span>`;
    c.onclick=()=>selectPlayer(idx);
    const del=document.createElement('button');
    del.className='chip-del';
    del.title='Excluir jogador';
    del.innerHTML='✕';
    del.onclick=(e)=>deletePlayer(idx,e);
    wrap.appendChild(c);
    wrap.appendChild(del);
    list.appendChild(wrap);
  });
  document.getElementById('btnRanking').style.display='inline-block';
  if(state.activePlayerIdx!==null)renderDash();
}

function selectPlayer(idx){
  state.activePlayerIdx=idx;
  const player=state.players[idx];
  const keys=Object.keys(player.seasons||{});
  if(!state.activeSeason||!player.seasons[state.activeSeason]){
    state.activeSeason=keys.length>0?keys[0]:null;
  }
  state.activeView='season';
  document.getElementById('mainDash').style.display='block';
  document.getElementById('btnSeason').style.display='inline-block';
  save();render();
}

function showRanking(){
  state.activePlayerIdx=null;
  state.activeView='ranking';
  document.getElementById('mainDash').style.display='block';
  document.getElementById('btnSeason').style.display='none';
  document.getElementById('seasonTabs').innerHTML='';
  document.getElementById('seasonContent').style.display='none';
  document.getElementById('careerContent').style.display='none';
  document.getElementById('personalContent').style.display='none';
  document.getElementById('rankingContent').style.display='block';
  renderRanking();
}

function saveSeason(){
  const name=document.getElementById('sNameInput').value.trim();
  const isNT=document.getElementById('sNtCheck').checked;
  const club=isNT?'':document.getElementById('sClubInput').value.trim();
  if(!name){toast('Preencha o ano','err');return;}
  if(!isNT&&!club){toast('Preencha o clube','err');return;}
  const player=state.players[state.activePlayerIdx];
  if(isNT){
    if(!player.seasons['SELEÇÃO']){
      player.seasons['SELEÇÃO']={club:'',isNT:true,entries:[],ntYears:[],titles:[]};
    }
    state.activeSeason='SELEÇÃO';
  } else {
    if(player.seasons[name]){toast('Temporada já existe','err');return;}
    player.seasons[name]={club,isNT:false,entries:[],ntYears:[],titles:[]};
    state.activeSeason=name;
  }
  state.activeView='season';
  save();render();
  closeModal('modalSeason');
  document.getElementById('sNameInput').value='';
  document.getElementById('sClubInput').value='';
  document.getElementById('sNtCheck').checked=false;
  document.getElementById('sClubRow').style.display='block';
  toast(isNT?'Temporada Seleção criada!':'Temporada criada!');
}

function deleteSeason(sKey){
  const player=state.players[state.activePlayerIdx];
  const label=player.seasons[sKey].isNT?'Seleção':sKey;
  confirmDialog('Excluir temporada',`Excluir a temporada "${label}"? Todos os dados serão perdidos.`,()=>{
    delete player.seasons[sKey];
    const keys=Object.keys(player.seasons);
    state.activeSeason=keys.length>0?keys[0]:null;
    state.activeView='season';
    save();render();
    toast('Temporada removida');
  });
}

function renderDash(){
  renderTabs();
  document.getElementById('rankingContent').style.display='none';
  if(state.activeView==='career'){
    document.getElementById('careerContent').style.display='block';
    document.getElementById('seasonContent').style.display='none';
    document.getElementById('personalContent').style.display='none';
    renderCareer();
  } else if(state.activeView==='personal'){
    document.getElementById('careerContent').style.display='none';
    document.getElementById('seasonContent').style.display='none';
    document.getElementById('personalContent').style.display='block';
    renderPersonal();
  } else {
    document.getElementById('careerContent').style.display='none';
    document.getElementById('seasonContent').style.display='block';
    document.getElementById('personalContent').style.display='none';
    renderSeasonContent();
  }
}

function renderTabs(){
  const container=document.getElementById('seasonTabs');
  container.innerHTML='';
  if(state.activePlayerIdx===null)return;
  const player=state.players[state.activePlayerIdx];
  const keys=Object.keys(player.seasons||{}).sort((a,b)=>{
    if(a==='SELEÇÃO')return-1;if(b==='SELEÇÃO')return 1;return b-a;
  });
  const careerBtn=document.createElement('button');
  careerBtn.className='btn tab-btn'+(state.activeView==='career'?' active':'');
  if(state.activeView==='career')careerBtn.style.cssText='border-color:var(--purple);color:var(--purple);background:rgba(163,113,247,.18)';
  careerBtn.textContent='Carreira';
  careerBtn.onclick=()=>{state.activeView='career';save();renderDash();};
  container.appendChild(careerBtn);
  const personalBtn=document.createElement('button');
  personalBtn.className='btn tab-btn'+(state.activeView==='personal'?' active':'');
  if(state.activeView==='personal')personalBtn.style.cssText='border-color:var(--blue);color:var(--blue);background:rgba(88,166,255,.18)';
  personalBtn.textContent='👤 Pessoal';
  personalBtn.onclick=()=>{state.activeView='personal';save();renderDash();};
  container.appendChild(personalBtn);
  const sep=document.createElement('span');
  sep.textContent='|';
  sep.style.cssText='color:var(--border);margin:0 4px;font-size:.8rem';
  container.appendChild(sep);
  keys.forEach(s=>{
    const wrap=document.createElement('span');
    wrap.style.cssText='display:inline-flex;align-items:center;gap:2px';
    const t=document.createElement('button');
    const isActive=s===state.activeSeason&&state.activeView==='season';
    t.className='btn tab-btn'+(isActive?' active':'');
    const sd=player.seasons[s];
    if(sd.isNT){
      t.innerHTML=`🏴 Seleção`;
      if(isActive)t.style.cssText='border-color:var(--yellow);color:var(--yellow);background:rgba(227,179,65,.18)';
    } else {
      t.innerHTML=`${s} <span style="font-size:.7rem;opacity:.7">${sd.club}</span>`;
    }
    t.onclick=()=>{state.activeSeason=s;state.activeView='season';save();renderDash();};
    const del=document.createElement('button');
    del.className='season-del-btn';
    del.title='Excluir temporada';
    del.innerHTML='✕';
    del.onclick=()=>deleteSeason(s);
    wrap.appendChild(t);
    wrap.appendChild(del);
    container.appendChild(wrap);
  });
}

function renderSeasonContent(){
  const content=document.getElementById('seasonContent');
  if(state.activePlayerIdx===null||!state.activeSeason){content.innerHTML='';return;}
  const seasonData=state.players[state.activePlayerIdx].seasons[state.activeSeason];
  if(!seasonData){content.innerHTML='';return;}
  if(seasonData.isNT){renderNTSeason(content,seasonData);}
  else{renderClubSeason(content,seasonData);}
}

function renderClubSeason(content,seasonData){
  const entries=seasonData.entries||[];
  const titles=seasonData.titles||[];
  let ovJ=0,ovG=0,ovA=0;
  entries.forEach(e=>{ovJ+=e.j;ovG+=e.g;ovA+=e.a;});
  const avgGoals=ovJ>0?(ovG/ovJ).toFixed(2):'0.00';
  let rowsHtml='';
  [...entries].sort((a,b)=>b.g-a.g).forEach(e=>{
    rowsHtml+=`<tr>
      <td><span class="tag">${e.comp||'—'}</span></td>
      <td style="color:var(--dim);font-size:.78rem">${e.year||state.activeSeason}</td>
      <td>${e.j}</td>
      <td class="g-num">${e.g}</td>
      <td class="a-num">${e.a}</td>
      <td style="color:var(--gold);font-weight:700">${e.g+e.a}</td>
      <td style="color:var(--dim)">${e.j>0?(e.g/e.j).toFixed(2):'0.00'}</td>
      <td><div class="actions">
        <button class="btn edit-btn" onclick="editEntry('${e.id}')">✎</button>
        <button class="btn danger" onclick="deleteEntry('${e.id}')">✖</button>
      </div></td>
    </tr>`;
  });
  let titlesHtml='';
  titles.forEach(t=>{
    titlesHtml+=`<div class="title-item">
      <span class="title-trophy">🏆</span>
      <span class="title-name">${t.name}</span>
      <button class="title-del" onclick="deleteTitle('${t.id}')">✕</button>
    </div>`;
  });
  content.innerHTML=`
    <div class="hero">
      <div class="hero-top">
        <span>Clube: <b style="color:#fff">${seasonData.club}</b> &nbsp;·&nbsp; Temporada: <b style="color:#fff">${state.activeSeason}</b></span>
      </div>
      <div class="hero-stats">
        <div class="stat"><div class="val">${ovJ}</div><div class="lbl">Jogos</div></div>
        <div class="stat green"><div class="val">${ovG}</div><div class="lbl">Gols</div></div>
        <div class="stat blue"><div class="val">${ovA}</div><div class="lbl">Assists</div></div>
        <div class="stat gold"><div class="val">${ovG+ovA}</div><div class="lbl">Participações</div></div>
        <div class="stat"><div class="val">${avgGoals}</div><div class="lbl">Gols/Jogo</div></div>
      </div>
    </div>
    <div class="form-wrap" style="border-color:rgba(227,179,65,.3)">
      <div class="sec-header">
        <span class="sec-title" style="color:var(--yellow)">🏆 Títulos conquistados nesta temporada</span>
        <span style="font-size:.72rem;color:var(--dim)">${titles.length} título${titles.length!==1?'s':''}</span>
      </div>
      ${titlesHtml.length>0?`<div class="title-list">${titlesHtml}</div>`:'<div style="color:var(--dim);font-size:.8rem;padding:4px 0 8px">Nenhum título registrado ainda.</div>'}
      <div class="title-add-row">
        <input type="text" id="titleInput" placeholder="Nome do título (ex: Campeonato Brasileiro)" onkeydown="if(event.key==='Enter')addTitle()">
        <button class="btn" onclick="addTitle()">+ Título</button>
      </div>
    </div>
    <div class="form-wrap">
      <div class="sec-header">
        <span class="sec-title" id="formTitle">Adicionar competição</span>
        <button class="btn ghost" id="btnCancelEdit" style="display:none;font-size:.75rem" onclick="cancelEdit()">Cancelar edição</button>
      </div>
      <div class="form-grid">
        <input type="text" id="mComp" placeholder="Competição (ex: Brasileirão)">
        <input type="number" id="mYear" placeholder="Ano (ex: 2026)" min="1900" max="2100">
        <input type="number" id="mJ" placeholder="Jogos" min="0">
        <input type="number" id="mG" placeholder="Gols" min="0">
        <input type="number" id="mA" placeholder="Assists" min="0">
      </div>
      <div class="form-actions">
        <button class="btn" id="btnSaveEntry" onclick="saveEntry()">Salvar</button>
      </div>
    </div>
    <div class="sec-header">
      <span class="sec-title">Competições registradas</span>
      <span style="font-size:.75rem;color:var(--dim)">${entries.length} competiç${entries.length!==1?'ões':'ão'}</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Competição</th><th>Ano</th><th>Jogos</th><th>Gols</th><th>Assists</th><th>Participações</th><th>Média G/J</th><th></th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    ${entries.length===0?'<div class="empty">Nenhuma competição registrada ainda</div>':''}
  `;
  if(editingEntryId&&!editingNtYearId){
    const ft=document.getElementById('formTitle');
    const cb=document.getElementById('btnCancelEdit');
    const sb=document.getElementById('btnSaveEntry');
    if(ft)ft.textContent='Editando entrada';
    if(cb)cb.style.display='inline-block';
    if(sb)sb.textContent='Atualizar';
  }
}

function renderNTSeason(content,seasonData){
  const ntYears=seasonData.ntYears||[];
  const titles=seasonData.titles||[];
  let totalJ=0,totalG=0,totalA=0;
  ntYears.forEach(y=>{(y.entries||[]).forEach(e=>{totalJ+=e.j;totalG+=e.g;totalA+=e.a;});});
  let titlesHtml='';
  titles.forEach(t=>{
    titlesHtml+=`<div class="title-item">
      <span class="title-trophy">🏆</span>
      <span class="title-name">${t.name}</span>
      <button class="title-del" onclick="deleteTitle('${t.id}')">✕</button>
    </div>`;

    const yrA=yr.entries.reduce((s,e)=>s+e.a,0);
    let rowsHtml='';
    [...yr.entries].sort((a,b)=>b.g-a.g).forEach(e=>{
      rowsHtml+=`<tr>
        <td><span class="tag nt">${e.comp||'—'}</span></td>
        <td>${e.j}</td>
        <td class="g-num">${e.g}</td>
        <td class="a-num">${e.a}</td>
        <td style="color:var(--gold);font-weight:700">${e.g+e.a}</td>
        <td style="color:var(--dim)">${e.j>0?(e.g/e.j).toFixed(2):'0.00'}</td>
        <td><div class="actions">
          <button class="btn edit-btn" onclick="editNtEntry('${yr.id}','${e.id}')">✎</button>
          <button class="btn danger" onclick="deleteNtEntry('${yr.id}','${e.id}')">✖</button>
        </div></td>
      </tr>`;
    });
    const isEditing=editingNtYearId===yr.id;
    yearsHtml+=`<div class="nt-year-group">
      <div class="nt-year-header">
        <span class="nt-year-label">📅 ${yr.year}</span>
        <div class="nt-year-stats">
          <span style="color:var(--dim)">J <b style="color:#fff">${yrJ}</b></span>
          <span style="color:var(--dim)">G <b style="color:var(--green)">${yrG}</b></span>
          <span style="color:var(--dim)">A <b style="color:var(--blue)">${yrA}</b></span>
          <button class="btn danger" style="padding:2px 8px;font-size:.72rem" onclick="deleteNtYear('${yr.id}')">✕ Ano</button>
        </div>
      </div>
      <div class="nt-year-body">
        <div class="form-wrap" style="margin-bottom:12px;${isEditing?'border-color:var(--gold)':''}">
          <div class="sec-header">
            <span class="sec-title" id="ntFormTitle_${yr.id}">${isEditing?'Editando entrada':'Adicionar competição'}</span>
            ${isEditing?`<button class="btn ghost" style="font-size:.75rem" onclick="cancelEdit()">Cancelar edição</button>`:''}
          </div>
          <div class="form-grid">
            <input type="text" id="ntComp_${yr.id}" placeholder="Competição">
            <input type="number" id="ntJ_${yr.id}" placeholder="Jogos" min="0">
            <input type="number" id="ntG_${yr.id}" placeholder="Gols" min="0">
            <input type="number" id="ntA_${yr.id}" placeholder="Assists" min="0">
          </div>
          <div class="form-actions">
            <button class="btn" id="ntSaveBtn_${yr.id}" onclick="saveNtEntry('${yr.id}')">${isEditing?'Atualizar':'Salvar'}</button>
          </div>
        </div>
        ${yr.entries.length>0?`<div class="table-wrap">
          <table>
            <thead><tr><th>Competição</th><th>Jogos</th><th>Gols</th><th>Assists</th><th>Participações</th><th>Média G/J</th><th></th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>`:'<div class="empty" style="padding:16px">Nenhuma competição neste ano</div>'}
      </div>
    </div>`;
  });
  content.innerHTML=`
    <div class="hero" style="border-color:rgba(227,179,65,.3)">
      <div class="hero-top"><span>🏴 <b style="color:var(--yellow)">Seleção Nacional</b></span></div>
      <div class="hero-stats">
        <div class="stat"><div class="val">${totalJ}</div><div class="lbl">Jogos</div></div>
        <div class="stat green"><div class="val">${totalG}</div><div class="lbl">Gols</div></div>
        <div class="stat blue"><div class="val">${totalA}</div><div class="lbl">Assists</div></div>
        <div class="stat gold"><div class="val">${totalG+totalA}</div><div class="lbl">Participações</div></div>
        <div class="stat"><div class="val">${ntYears.length}</div><div class="lbl">Anos</div></div>
      </div>
    </div>
    <div class="form-wrap" style="border-color:rgba(227,179,65,.3)">
      <div class="sec-header">
        <span class="sec-title" style="color:var(--yellow)">🏆 Títulos conquistados pela Seleção</span>
        <span style="font-size:.72rem;color:var(--dim)">${titles.length} título${titles.length!==1?'s':''}</span>
      </div>
      ${titlesHtml.length>0?`<div class="title-list">${titlesHtml}</div>`:'<div style="color:var(--dim);font-size:.8rem;padding:4px 0 8px">Nenhum título registrado ainda.</div>'}
      <div class="title-add-row">
        <input type="text" id="titleInput" placeholder="Nome do título (ex: Copa América 2026)" onkeydown="if(event.key==='Enter')addTitle()">

      </div>
    </div>
    <div class="sec-header" style="margin-top:4px">
      <span class="sec-title" style="color:var(--yellow)">Anos pela Seleção</span>
    </div>
    <div class="nt-add-year-wrap">
      <input type="text" id="ntNewYear" placeholder="Ano (ex: 2026)">
      <button class="btn" onclick="addNtYear()">+ Ano</button>
    </div>
    ${yearsHtml}
    ${ntYears.length===0?'<div class="empty">Nenhum ano registrado ainda. Adicione um ano acima.</div>':''}

  if(editingNtYearId&&editingEntryId){
    const yr=seasonData.ntYears.find(y=>y.id===editingNtYearId);
    if(yr){
      const entry=yr.entries.find(e=>e.id===editingEntryId);
      if(entry){
        const ci=document.getElementById('ntComp_'+yr.id);
        const ji=document.getElementById('ntJ_'+yr.id);
        const gi=document.getElementById('ntG_'+yr.id);
        const ai=document.getElementById('ntA_'+yr.id);
        if(ci)ci.value=entry.comp;
        if(ji)ji.value=entry.j;
        if(gi)gi.value=entry.g;
        if(ai)ai.value=entry.a;
      }
    }
  }
}

function addNtYear(){
  const yr=document.getElementById('ntNewYear').value.trim();
  if(!yr){toast('Preencha o ano','err');return;}
  const season=state.players[state.activePlayerIdx].seasons['SELEÇÃO'];
  if(season.ntYears.find(y=>y.year===yr)){toast('Ano já existe','err');return;}
  season.ntYears.push({id:'nty_'+Date.now(),year:yr,entries:[]});
  save();renderSeasonContent();
  toast('Ano adicionado!');
}

function deleteNtYear(yid){
  const season=state.players[state.activePlayerIdx].seasons['SELEÇÃO'];
  const yr=season.ntYears.find(y=>y.id===yid);
  confirmDialog('Excluir ano',`Excluir o ano ${yr?.year}? Todos os dados serão perdidos.`,()=>{
    season.ntYears=season.ntYears.filter(y=>y.id!==yid);
    if(editingNtYearId===yid){editingNtYearId=null;editingEntryId=null;}
    save();renderSeasonContent();
    toast('Ano removido');
  });
}

function saveNtEntry(yid){
  const season=state.players[state.activePlayerIdx].seasons['SELEÇÃO'];
  const yr=season.ntYears.find(y=>y.id===yid);
  if(!yr)return;
  const comp=(document.getElementById('ntComp_'+yid)?.value||'').trim().toUpperCase();
  const j=parseInt(document.getElementById('ntJ_'+yid)?.value)||0;
  const g=parseInt(document.getElementById('ntG_'+yid)?.value)||0;
  const a=parseInt(document.getElementById('ntA_'+yid)?.value)||0;
  if(!comp){toast('Preencha a competição','err');return;}
  if(editingNtYearId===yid&&editingEntryId){
    const idx=yr.entries.findIndex(e=>e.id===editingEntryId);
    if(idx!==-1)yr.entries[idx]={id:editingEntryId,comp,j,g,a};
    editingNtYearId=null;editingEntryId=null;
  } else {
    if(yr.entries.find(e=>e.comp===comp)){toast('Competição já existe neste ano','err');return;}
    yr.entries.push({id:'nte_'+Date.now(),comp,j,g,a});
  }
  save();renderSeasonContent();
  toast('Salvo!');
}

function editNtEntry(yid,eid){
  editingNtYearId=yid;editingEntryId=eid;
  renderSeasonContent();
  setTimeout(()=>{const el=document.getElementById('ntComp_'+yid);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
}

function deleteNtEntry(yid,eid){
  const season=state.players[state.activePlayerIdx].seasons['SELEÇÃO'];
  const yr=season.ntYears.find(y=>y.id===yid);
  confirmDialog('Excluir entrada','Remover esta competição?',()=>{
    yr.entries=yr.entries.filter(e=>e.id!==eid);
    if(editingEntryId===eid){editingEntryId=null;editingNtYearId=null;}
    save();renderSeasonContent();
    toast('Removido');
  });
}

function addTitle(){
  const inp=document.getElementById('titleInput');
  const name=(inp?.value||'').trim();
  if(!name){toast('Preencha o nome do título','err');return;}
  const season=state.players[state.activePlayerIdx].seasons[state.activeSeason];
  if(!season.titles)season.titles=[];
  season.titles.push({id:'t_'+Date.now(),name});
  inp.value='';
  save();renderSeasonContent();
  toast('Título adicionado! 🏆');
}

function deleteTitle(tid){
  const season=state.players[state.activePlayerIdx].seasons[state.activeSeason];
  confirmDialog('Excluir título','Remover este título da temporada?',()=>{
    season.titles=(season.titles||[]).filter(t=>t.id!==tid);
    save();renderSeasonContent();
    toast('Título removido');
  });
}

function saveEntry(){
  if(!state.activeSeason)return;
  const comp=(document.getElementById('mComp').value||'').trim().toUpperCase();
  const yearVal=document.getElementById('mYear').value.trim()||state.activeSeason;
  const j=parseInt(document.getElementById('mJ').value)||0;
  const g=parseInt(document.getElementById('mG').value)||0;
  const a=parseInt(document.getElementById('mA').value)||0;
  if(!comp){toast('Preencha o nome da competição','err');return;}
  const season=state.players[state.activePlayerIdx].seasons[state.activeSeason];
  if(editingEntryId){
    const idx=season.entries.findIndex(e=>e.id===editingEntryId);
    if(idx!==-1)season.entries[idx]={id:editingEntryId,comp,year:yearVal,j,g,a};
    editingEntryId=null;
  } else {
    season.entries.push({id:'e_'+Date.now(),comp,year:yearVal,j,g,a});
  }
  save();renderSeasonContent();
  toast('Salvo!');
}

function editEntry(id){
  editingEntryId=id;
  const season=state.players[state.activePlayerIdx].seasons[state.activeSeason];
  const e=season.entries.find(x=>x.id==id);
  if(!e)return;
  renderSeasonContent();
  setTimeout(()=>{
    const cm=document.getElementById('mComp');
    const ym=document.getElementById('mYear');
    const jm=document.getElementById('mJ');
    const gm=document.getElementById('mG');
    const am=document.getElementById('mA');
    if(cm){cm.value=e.comp;cm.scrollIntoView({behavior:'smooth',block:'nearest'});}

function calcContractTotal(c){
  if(!c.valor||!c.dataInicio||!c.dataFim)return c.valor||0;
  const [iniY,iniM]=c.dataInicio.split('-').map(Number);
  const [fimY,fimM]=c.dataFim.split('-').map(Number);
  if(isNaN(iniY)||isNaN(fimY))return c.valor||0;
  const meses=(fimY-iniY)*12+(fimM-iniM)+1;
  if(c.forma==='Mensal')return(c.valor||0)*Math.max(meses,1);
  const anos=Math.ceil(meses/12);
  return(c.valor||0)*Math.max(anos,1);
}

function calcDuracao(c){
  if(!c.dataInicio||!c.dataFim)return'—';
  const [iniY,iniM]=c.dataInicio.split('-').map(Number);
  const [fimY,fimM]=c.dataFim.split('-').map(Number);
  if(isNaN(iniY)||isNaN(fimY))return'—';
  const meses=(fimY-iniY)*12+(fimM-iniM)+1;
  if(meses<12)return`${meses} mês${meses!==1?'es':''}`;
  const anos=Math.floor(meses/12);
  const m=meses%12;
  return`${anos} ano${anos!==1?'s':''}${m>0?' e '+m+' mês'+(m!==1?'es':''):''}`;
}

function saveContract(){

/* CAREER */
function getCareerData(playerIdx){
  const player=state.players[playerIdx];
  let totalJ=0,totalG=0,totalA=0;
  const compMap={};
  const clubMap={};
  const yearMap={};
  const seasonStats=[];
  const allTitles=[];
  const keys=Object.keys(player.seasons||{}).sort((a,b)=>{
    if(a==='SELEÇÃO')return-1;if(b==='SELEÇÃO')return 1;return b-a;
  });
  keys.forEach(sKey=>{
    const s=player.seasons[sKey];
    let sJ=0,sG=0,sA=0;
    (s.titles||[]).forEach(t=>{
      allTitles.push({name:t.name,season:sKey,club:s.isNT?'Seleção':s.club,isNT:s.isNT});
    });
    if(s.isNT){
      (s.ntYears||[]).forEach(yr=>{
        let yJ=0,yG=0,yA=0;
        (yr.entries||[]).forEach(e=>{
          yJ+=e.j;yG+=e.g;yA+=e.a;
          totalJ+=e.j;totalG+=e.g;totalA+=e.a;
          sJ+=e.j;sG+=e.g;sA+=e.a;
          const c=e.comp||'SEM COMPETIÇÃO';
          if(!compMap[c])compMap[c]={j:0,g:0,a:0};
          compMap[c].j+=e.j;compMap[c].g+=e.g;compMap[c].a+=e.a;
          const y=yr.year||'?';
          if(!yearMap[y])yearMap[y]={j:0,g:0,a:0};
          yearMap[y].j+=e.j;yearMap[y].g+=e.g;yearMap[y].a+=e.a;
        });
        seasonStats.push({year:yr.year,club:'🏴 Seleção',j:yJ,g:yG,a:yA,isNT:true});
      });
    } else {
      (s.entries||[]).forEach(e=>{
        sJ+=e.j;sG+=e.g;sA+=e.a;
        totalJ+=e.j;totalG+=e.g;totalA+=e.a;
        const c=e.comp||'SEM COMPETIÇÃO';
        if(!compMap[c])compMap[c]={j:0,g:0,a:0};
        compMap[c].j+=e.j;compMap[c].g+=e.g;compMap[c].a+=e.a;
        const y=e.year||sKey||'?';
        if(!yearMap[y])yearMap[y]={j:0,g:0,a:0};
        yearMap[y].j+=e.j;yearMap[y].g+=e.g;yearMap[y].a+=e.a;
      });
      const club=s.club;
      if(!clubMap[club])clubMap[club]={j:0,g:0,a:0,seasons:0};
      clubMap[club].j+=sJ;clubMap[club].g+=sG;clubMap[club].a+=sA;clubMap[club].seasons++;
      seasonStats.push({year:sKey,club,j:sJ,g:sG,a:sA,isNT:false});
    }
  });
  seasonStats.sort((a,b)=>b.year-a.year);
  return{totalJ,totalG,totalA,compMap,clubMap,yearMap,seasonStats,allTitles,
    clubs:[...new Set(Object.values(player.seasons||{}).filter(s=>!s.isNT).map(s=>s.club))],
    seasons:keys.length};
}

function getAllEntries(player){
  let entries=[];
  Object.values(player.seasons||{}).forEach(s=>{
    if(s.isNT){(s.ntYears||[]).forEach(yr=>{entries=[...entries,...(yr.entries||[])]});}
    else{entries=[...entries,...(s.entries||[])];}
  });
  return entries;
}

    <div class="rank-section">
      <div class="section-label">Ranking Geral — Todos os jogadores</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
        <div>
          <div style="font-size:.72rem;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600">⚽ Artilheiros</div>
          ${buildList(generalRank,'g','var(--green)')}
        </div>
        <div>
          <div style="font-size:.72rem;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600">🎯 Garçons</div>
          ${buildList(generalRank,'a','var(--blue)')}
        </div>
      </div>
      <div>
        <div style="font-size:.72rem;color:var(--yellow);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600">🏆 Mais títulos</div>
        ${titlesRankHtml}
      </div>
    </div>
    ${compList.length>0?`<div class="rank-section">
      <div class="section-label">Ranking por Competição</div>
      <div class="rank-tabs">${compTabsHtml}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <div style="font-size:.72rem;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600">⚽ Artilheiros</div>
          ${buildList(rc,'g','var(--green)')}
        </div>
        <div>
          <div style="font-size:.72rem;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600">🎯 Garçons</div>
          ${buildList(rc,'a','var(--blue)')}
        </div>
      </div>
    </div>`:`<div class="rank-section"><div class="empty">Nenhuma competição cadastrada ainda</div></div>`}
  `;
}
</script>
</body>
</html>
