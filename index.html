<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marechal Lott</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;padding:16px}
:root{--green:#3fb950;--gold:#f0883e;--red:#f85149;--blue:#58a6ff;--purple:#a371f7;--yellow:#e3b341;--surface:#161b22;--surface2:#21262d;--border:#30363d;--dim:#8b949e}
.app{max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
h1{font-size:1.2rem;font-weight:600;color:#fff}
h1 span{color:var(--green);font-size:.75rem;display:block;font-weight:400;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--green);color:#000;border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:.8rem;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--border)}
.btn.ghost:hover{color:#fff;border-color:var(--dim)}
.btn.danger{background:transparent;color:var(--red);border:1px solid transparent;padding:4px 8px}
.btn.danger:hover{background:rgba(248,81,73,.12);border-color:var(--red)}
.btn.edit-btn{background:transparent;color:var(--gold);border:1px solid transparent;padding:4px 8px}
.btn.tab-btn{background:transparent;color:var(--dim);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:.8rem;font-weight:400}
.btn.tab-btn.active{background:rgba(240,136,62,.18);border-color:var(--gold);color:var(--gold);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:16px;scrollbar-width:thin;flex-wrap:wrap}
.chip-wrap{display:flex;align-items:center;gap:4px}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 16px;cursor:pointer;white-space:nowrap;transition:all .15s;font-size:.85rem}
.chip:hover{border-color:var(--dim)}
.chip.active{border-color:var(--green);background:rgba(63,185,80,.12);color:var(--green);font-weight:600}
.chip .birth{font-size:.7rem;color:var(--dim);margin-left:4px}
.chip-del{background:transparent;border:none;color:var(--dim);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:.8rem;transition:color .15s;line-height:1}
.chip-del:hover{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.hero{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.hero-top{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap}
.stat{text-align:center}
.stat .val{font-size:1.8rem;font-weight:700;line-height:1}
.stat .lbl{font-size:.65rem;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.stat.green .val{color:var(--green)}
.stat.gold .val{color:var(--gold)}
.stat.blue .val{color:var(--blue)}
.form-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.form-grid input,.form-grid select{background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:9px 12px;border-radius:8px;font-size:.85rem;width:100%;outline:none;transition:border .15s}
.form-grid input:focus,.form-grid select:focus{border-color:var(--green)}
.form-grid input::placeholder{color:var(--dim)}
.form-grid select option{background:#1c2128}
.form-actions{display:flex;gap:8px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:400px}
th{color:var(--dim);font-size:.7rem;padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid rgba(48,54,61,.5)}
tr:hover td{background:rgba(255,255,255,.02)}
.tag{background:rgba(240,136,62,.15);color:var(--gold);padding:2px 8px;border-radius:12px;font-size:.72rem;font-weight:600}
.tag.nt{background:rgba(227,179,65,.15);color:var(--yellow)}
.actions{display:flex;gap:4px}
.g-num{font-weight:700;color:var(--green)}
.a-num{font-weight:700;color:var(--blue)}
.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:460px;margin:auto}
.modal h2{font-size:1rem;margin-bottom:20px;font-weight:600}
.modal input,.modal select{background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:10px 14px;border-radius:8px;font-size:.9rem;width:100%;margin-bottom:12px;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--green)}
.modal select option{background:#1c2128}
.modal-actions{display:flex;gap:8px;margin-top:8px}
.modal-actions .btn{flex:1;padding:10px}
.modal-label{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px;margin-top:2px}
.toast{position:fixed;bottom:24px;right:24px;background:#238636;color:#fff;padding:10px 20px;border-radius:10px;font-size:.85rem;z-index:200;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-title{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:500}
.toggle-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;user-select:none}
.toggle-wrap input[type=checkbox]{accent-color:var(--yellow);width:16px;height:16px;cursor:pointer}
.toggle-wrap label{font-size:.88rem;color:#e6edf3;cursor:pointer;flex:1}
.toggle-wrap .nt-badge{font-size:.7rem;background:rgba(227,179,65,.18);color:var(--yellow);padding:2px 8px;border-radius:10px;font-weight:600}
.title-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.title-item{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid rgba(227,179,65,.3);border-radius:8px;padding:8px 12px}
.title-trophy{font-size:1rem}
.title-name{flex:1;font-size:.85rem;font-weight:600;color:var(--yellow)}
.title-del{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:.8rem;padding:2px 6px;border-radius:4px;transition:color .15s}
.title-del:hover{color:var(--red)}
.title-add-row{display:flex;gap:8px;margin-top:8px}
.title-add-row input{background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:.85rem;flex:1;outline:none}
.title-add-row input:focus{border-color:var(--yellow)}
.title-add-row .btn{background:rgba(227,179,65,.2);color:var(--yellow);border:1px solid rgba(227,179,65,.4);font-size:.8rem;padding:8px 14px;white-space:nowrap}
.nt-season-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(227,179,65,.15);border:1px solid rgba(227,179,65,.3);border-radius:12px;padding:2px 10px;font-size:.72rem;color:var(--yellow);font-weight:600;margin-left:6px}
.career-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.career-hero{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.avatar{width:56px;height:56px;border-radius:50%;background:rgba(163,113,247,.2);border:2px solid var(--purple);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:var(--purple);flex-shrink:0}
.career-name{font-size:1.2rem;font-weight:700}
.career-meta{font-size:.8rem;color:var(--dim);margin-top:3px}
.career-stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.career-stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.career-stat .val{font-size:1.5rem;font-weight:700;line-height:1;margin-bottom:4px}
.career-stat .lbl{font-size:.65rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.comp-career-table{width:100%;border-collapse:collapse;font-size:.82rem}
.comp-career-table th{color:var(--dim);font-size:.7rem;padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;font-weight:500;text-transform:uppercase}
.comp-career-table td{padding:8px 10px;border-bottom:1px solid rgba(48,54,61,.4)}
.comp-career-table tr:hover td{background:rgba(255,255,255,.02)}
.divider{height:1px;background:var(--border);margin:16px 0}
.section-label{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;font-weight:500}
.titles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:4px}
.title-card{background:rgba(227,179,65,.08);border:1px solid rgba(227,179,65,.25);border-radius:10px;padding:12px 16px;display:flex;align-items:flex-start;gap:10px}
.title-card-trophy{font-size:1.2rem;margin-top:1px}
.title-card-name{font-size:.88rem;font-weight:700;color:var(--yellow);line-height:1.3}
.title-card-season{font-size:.72rem;color:var(--dim);margin-top:3px}
.rank-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.rank-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.rank-tab{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:.78rem;color:var(--dim);cursor:pointer;transition:all .15s}
.rank-tab.active{background:rgba(63,185,80,.15);border-color:var(--green);color:var(--green);font-weight:600}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(48,54,61,.4)}
.rank-row:last-child{border-bottom:none}
.rank-pos{font-size:.85rem;font-weight:700;min-width:24px;text-align:center}
.rank-name{flex:1;font-size:.88rem}
.rank-val{font-size:1rem;font-weight:700;min-width:40px;text-align:right}
.season-del-btn{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:.75rem;padding:2px 6px;border-radius:4px;transition:color .15s;margin-left:2px}
.season-del-btn:hover{color:var(--red)}
/* personal */
.contracts-total-bar{background:rgba(240,136,62,.08);border:1px solid rgba(240,136,62,.25);border-radius:12px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.contracts-total-bar .big-num{font-size:2rem;font-weight:700;color:var(--gold)}
.contracts-total-bar .sub{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.contract-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;transition:border-color .2s}
.contract-card:hover{border-color:var(--dim)}
/* sub-tabs */
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sub-tab{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:.78rem;color:var(--dim);cursor:pointer;transition:all .15s;font-weight:400}
.sub-tab.active{background:rgba(88,166,255,.15);border-color:var(--blue);color:var(--blue);font-weight:600}
/* match card */
.match-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;transition:border-color .15s;flex-wrap:wrap}
.match-card:hover{border-color:var(--dim)}
.match-loc{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:8px;min-width:54px;text-align:center;flex-shrink:0}
.match-loc.home{background:rgba(63,185,80,.15);color:var(--green)}
.match-loc.away{background:rgba(88,166,255,.15);color:var(--blue)}
.match-teams{flex:1;font-size:.88rem;font-weight:600;min-width:140px}
.match-score{font-size:1rem;font-weight:700;min-width:60px;text-align:center;font-variant-numeric:tabular-nums;flex-shrink:0}
.match-comp-tag{font-size:.68rem;background:rgba(240,136,62,.12);color:var(--gold);padding:2px 8px;border-radius:8px;font-weight:600;flex-shrink:0}
.match-date{font-size:.68rem;color:var(--dim);flex-shrink:0}
.match-actions{display:flex;gap:4px;flex-shrink:0}
/* comp item */
.comp-list-item{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.comp-list-item .comp-name{flex:1;font-size:.88rem;font-weight:600;color:var(--gold)}
/* season summary card */
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
/* milestone cards */
.milestone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:4px}
.milestone-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;transition:border-color .2s}
.milestone-card:hover{border-color:rgba(163,113,247,.5)}
.milestone-card.reached{border-color:rgba(163,113,247,.35);background:rgba(163,113,247,.06)}
.milestone-card.pending{opacity:.45}
.milestone-num{font-size:1.7rem;font-weight:700;color:var(--purple);line-height:1;margin-bottom:6px}
.milestone-num.gold{color:var(--yellow)}
.milestone-label{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:8px;font-weight:500}
.milestone-detail{font-size:.78rem;color:#e6edf3;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.milestone-sub{font-size:.68rem;color:var(--dim)}
.milestone-badge{display:inline-flex;align-items:center;gap:3px;background:rgba(63,185,80,.15);border:1px solid rgba(63,185,80,.3);border-radius:8px;padding:2px 8px;font-size:.65rem;color:var(--green);font-weight:700;margin-top:6px}
.milestone-badge.nt{background:rgba(227,179,65,.15);border-color:rgba(227,179,65,.3);color:var(--yellow)}
.milestone-next{font-size:.72rem;color:var(--purple);font-weight:600;margin-top:4px}
/* opponent table */
.opp-table{width:100%;border-collapse:collapse;font-size:.82rem}
.opp-table th{color:var(--dim);font-size:.7rem;padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.opp-table td{padding:8px 10px;border-bottom:1px solid rgba(48,54,61,.4)}
.opp-table tr:hover td{background:rgba(163,113,247,.05)}
.opp-search{background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:.85rem;width:100%;outline:none;margin-bottom:12px}
.opp-search:focus{border-color:var(--purple)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Marechal Lott <span>Gestão por Temporada</span></h1>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="openAddPlayer()">+ Jogador</button>
      <button class="btn ghost" id="btnRanking" style="display:none" onclick="showRanking()">🏆 Ranking</button>
      <button class="btn" id="btnSeason" style="display:none" onclick="openModal('modalSeason')">+ Temporada</button>
    </div>
  </header>
  <div id="playerList" class="chips"></div>
  <div id="mainDash" style="display:none">
    <div class="tabs" id="seasonTabs"></div>
    <div id="seasonContent" style="display:none"></div>
    <div id="careerContent" style="display:none"></div>
    <div id="rankingContent" style="display:none"></div>
    <div id="personalContent" style="display:none"></div>
  </div>
  <div id="emptyPlayers" class="empty" style="padding:60px 20px">
    <div style="font-size:1rem;color:#fff;margin-bottom:6px">Nenhum atleta cadastrado</div>
    <div>Clique em <b style="color:var(--green)">+ Jogador</b> para começar</div>
  </div>
</div>

<!-- Modal Jogador -->
<div id="modalPlayer" class="overlay" onclick="closeModalOnBg(event,'modalPlayer')">
  <div class="modal">
    <h2 id="modalPlayerTitle">Cadastrar Atleta</h2>
    <label class="modal-label">Nome completo</label>
    <input type="text" id="pNameInput" placeholder="Nome completo">
    <label class="modal-label">Data de nascimento</label>
    <input type="date" id="pBirthInput">
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalPlayer')">Cancelar</button>
      <button class="btn" id="btnSavePlayer" onclick="savePlayer()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Temporada -->
<div id="modalSeason" class="overlay" onclick="closeModalOnBg(event,'modalSeason')">
  <div class="modal">
    <h2>Nova Temporada</h2>
    <div class="toggle-wrap" onclick="toggleNtCheckbox()">
      <input type="checkbox" id="sNtCheck" onclick="event.stopPropagation()">
      <label for="sNtCheck">Temporada pela Seleção Nacional</label>
      <span class="nt-badge">🏴 Seleção</span>
    </div>
    <div id="sClubRow">
      <input type="text" id="sClubInput" placeholder="Clube (ex: Flamengo)">
    </div>
    <input type="text" id="sNameInput" placeholder="Ano (ex: 2026)">
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalSeason')">Cancelar</button>
      <button class="btn" onclick="saveSeason()">Criar</button>
    </div>
  </div>
</div>

<!-- Modal Jogo -->
<div id="modalMatch" class="overlay" onclick="closeModalOnBg(event,'modalMatch')">
  <div class="modal" style="max-width:500px">
    <h2 id="modalMatchTitle">Registrar Jogo</h2>

    <label class="modal-label">Competição</label>
    <select id="mMatchComp" style="margin-bottom:12px"></select>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div>
        <label class="modal-label">Local</label>
        <select id="mMatchLoc" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:10px 14px;border-radius:8px;font-size:.9rem;outline:none">
          <option value="home">🏠 Em Casa</option>
          <option value="away">✈️ Fora</option>
        </select>
      </div>
      <div>
        <label class="modal-label">Data</label>
        <input type="date" id="mMatchDate" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:10px 14px;border-radius:8px;font-size:.9rem;outline:none;margin-bottom:0">
      </div>
    </div>

    <label class="modal-label">Adversário</label>
    <input type="text" id="mMatchOpponent" placeholder="Nome do adversário" style="margin-bottom:12px">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div>
        <label class="modal-label" id="labelGF">Gols marcados (nosso)</label>
        <input type="number" id="mMatchGF" min="0" value="0" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:10px 14px;border-radius:8px;font-size:.9rem;outline:none;margin-bottom:0">
      </div>
      <div>
        <label class="modal-label" id="labelGA">Gols sofridos (deles)</label>
        <input type="number" id="mMatchGA" min="0" value="0" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:10px 14px;border-radius:8px;font-size:.9rem;outline:none;margin-bottom:0">
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div>
        <label class="modal-label">Gols do jogador</label>
        <input type="number" id="mMatchPlayerGoals" min="0" value="0" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:10px 14px;border-radius:8px;font-size:.9rem;outline:none;margin-bottom:0">
      </div>
      <div>
        <label class="modal-label">Assists do jogador</label>
        <input type="number" id="mMatchAssists" min="0" value="0" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:10px 14px;border-radius:8px;font-size:.9rem;outline:none;margin-bottom:0">
      </div>
    </div>

    <div id="matchPreview" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.88rem;color:var(--dim);text-align:center"></div>

    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalMatch')">Cancelar</button>
      <button class="btn" onclick="saveMatch()">Salvar Jogo</button>
    </div>
  </div>
</div>

<!-- Modal Confirmar -->
<div id="modalConfirm" class="overlay" onclick="closeModalOnBg(event,'modalConfirm')">
  <div class="modal">
    <h2 id="confirmTitle">Confirmar exclusão</h2>
    <p id="confirmMsg" style="color:var(--dim);font-size:.88rem;margin-bottom:20px;line-height:1.5"></p>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalConfirm')">Cancelar</button>
      <button class="btn" style="background:var(--red);color:#fff" onclick="confirmAction()">Excluir</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let state={players:[],activePlayerIdx:null,activeSeason:null,activeView:'season'};
let editingMatchId=null;
let pendingConfirm=null;
let rankComp=null;
let seasonSubView='geral';
let activeCompFilter=null;
let oppSearchQuery='';

// contract vars
let editingContractId=null;
let activeContractId=null;
let editingTempId=null;
let editingBonusId=null;

window.onload=()=>{
  const saved=localStorage.getItem('marechal_lott_v8');
  if(saved){state=JSON.parse(saved);}
  else{
    const old=localStorage.getItem('marechal_lott_v7');
    if(old){
      const d=JSON.parse(old);
      state.players=(d.players||[]).map(p=>({
        ...p,
        contracts:p.contracts||[],
        seasons:Object.fromEntries(Object.entries(p.seasons||{}).map(([k,s])=>[k,migrateSeasonV8(k,s)]))
      }));
      state.activePlayerIdx=d.activePlayerIdx!==undefined?d.activePlayerIdx:null;
      state.activeSeason=d.activeSeason||null;
    }
  }
  state.activeView='season';render();
};

function migrateSeasonV8(sKey,s){
  if(s.matches)return s;
  const comps=[];const matches=[];
  const oldEntries=s.entries||[];
  const compSet=new Set(oldEntries.map(e=>e.comp).filter(Boolean));
  compSet.forEach(c=>{comps.push({id:'comp_'+Math.random().toString(36).substr(2,8),name:c});});
  oldEntries.forEach(e=>{
    const compObj=comps.find(c=>c.name===e.comp);
    for(let i=0;i<e.j;i++){
      matches.push({id:'m_'+Math.random().toString(36).substr(2,8),compId:compObj?compObj.id:'',loc:'home',opponent:'—',gf:i===0?Math.max(e.g,0):0,ga:0,playerGoals:i===0?e.g:0,playerAssists:i===0?e.a:0,date:e.year||sKey,year:e.year||sKey});
    }
  });
  return{club:s.club,isNT:s.isNT||false,comps,matches,ntYears:s.ntYears||[],titles:s.titles||[]};
}

function save(){localStorage.setItem('marechal_lott_v8',JSON.stringify(state));}

function toast(msg,isErr){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=isErr?'#b91c1c':'#238636';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function closeModalOnBg(e,id){if(e.target.id===id)closeModal(id);}
function confirmDialog(title,msg,fn){
  pendingConfirm=fn;
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;
  openModal('modalConfirm');
}
function confirmAction(){closeModal('modalConfirm');if(pendingConfirm)pendingConfirm();pendingConfirm=null;}
function toggleNtCheckbox(){
  const cb=document.getElementById('sNtCheck');cb.checked=!cb.checked;
  document.getElementById('sClubRow').style.display=cb.checked?'none':'block';
}
function fmtEuro(v){return'€'+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}

// ===================== PLAYERS =====================
let editingPlayerIdx=null;

function openAddPlayer(){
  editingPlayerIdx=null;
  document.getElementById('modalPlayerTitle').textContent='Cadastrar Atleta';
  document.getElementById('btnSavePlayer').textContent='Salvar';
  document.getElementById('pNameInput').value='';
  document.getElementById('pBirthInput').value='';
  openModal('modalPlayer');
}

function editPlayer(idx,e){
  e.stopPropagation();
  editingPlayerIdx=idx;
  const p=state.players[idx];
  document.getElementById('modalPlayerTitle').textContent='Editar Atleta';
  document.getElementById('btnSavePlayer').textContent='Atualizar';
  document.getElementById('pNameInput').value=p.name||'';
  document.getElementById('pBirthInput').value=p.birth||'';
  openModal('modalPlayer');
}

function savePlayer(){
  const name=document.getElementById('pNameInput').value.trim();
  const birth=document.getElementById('pBirthInput').value;
  if(!name||!birth){toast('Preencha nome e data de nascimento','err');return;}
  if(editingPlayerIdx!==null){
    state.players[editingPlayerIdx].name=name;
    state.players[editingPlayerIdx].birth=birth;
    editingPlayerIdx=null;
    save();render();closeModal('modalPlayer');
    toast('Jogador atualizado!');
  } else {
    state.players.push({name,birth,seasons:{},contracts:[]});
    save();render();closeModal('modalPlayer');
    document.getElementById('pNameInput').value='';document.getElementById('pBirthInput').value='';
    toast('Jogador cadastrado!');
  }
}
function deletePlayer(idx,e){
  e.stopPropagation();
  confirmDialog('Excluir jogador',`Excluir "${state.players[idx].name}"? Todos os dados serão perdidos.`,()=>{
    state.players.splice(idx,1);
    if(state.activePlayerIdx===idx){state.activePlayerIdx=state.players.length>0?0:null;state.activeSeason=null;}
    else if(state.activePlayerIdx>idx)state.activePlayerIdx--;
    save();render();toast('Jogador removido');
  });
}

function render(){
  const list=document.getElementById('playerList');
  const ep=document.getElementById('emptyPlayers');
  list.innerHTML='';
  if(!state.players||state.players.length===0){
    ep.style.display='block';document.getElementById('mainDash').style.display='none';
    document.getElementById('btnSeason').style.display='none';document.getElementById('btnRanking').style.display='none';return;
  }
  ep.style.display='none';
  state.players.forEach((p,idx)=>{
    const wrap=document.createElement('div');wrap.className='chip-wrap';
    const c=document.createElement('div');c.className='chip'+(idx===state.activePlayerIdx?' active':'');
    c.innerHTML=`${p.name}<span class="birth">${p.birth?p.birth.split('-')[0]:''}</span>`;
    c.onclick=()=>selectPlayer(idx);
    const del=document.createElement('button');del.className='chip-del';del.innerHTML='✕';
    del.onclick=(e)=>deletePlayer(idx,e);
    const edit=document.createElement('button');edit.className='chip-del';edit.innerHTML='✎';
    edit.style.cssText='color:var(--gold);font-size:.85rem';
    edit.title='Editar jogador';
    edit.onclick=(e)=>editPlayer(idx,e);
    wrap.appendChild(c);wrap.appendChild(edit);wrap.appendChild(del);list.appendChild(wrap);
  });
  document.getElementById('btnRanking').style.display='inline-block';
  if(state.activePlayerIdx!==null)renderDash();
}

function selectPlayer(idx){
  state.activePlayerIdx=idx;
  const player=state.players[idx];
  const keys=Object.keys(player.seasons||{});
  if(!state.activeSeason||!player.seasons[state.activeSeason])state.activeSeason=keys.length>0?keys[0]:null;
  state.activeView='season';seasonSubView='geral';
  document.getElementById('mainDash').style.display='block';
  document.getElementById('btnSeason').style.display='inline-block';
  save();render();
}

function showRanking(){
  state.activePlayerIdx=null;state.activeView='ranking';
  document.getElementById('mainDash').style.display='block';
  document.getElementById('btnSeason').style.display='none';
  document.getElementById('seasonTabs').innerHTML='';
  document.getElementById('seasonContent').style.display='none';
  document.getElementById('careerContent').style.display='none';
  document.getElementById('personalContent').style.display='none';
  document.getElementById('rankingContent').style.display='block';
  renderRanking();
}

// ===================== SEASONS =====================
function saveSeason(){
  const name=document.getElementById('sNameInput').value.trim();
  const isNT=document.getElementById('sNtCheck').checked;
  const club=isNT?'':document.getElementById('sClubInput').value.trim();
  if(!name){toast('Preencha o ano','err');return;}
  if(!isNT&&!club){toast('Preencha o clube','err');return;}
  const player=state.players[state.activePlayerIdx];
  if(isNT){
    if(!player.seasons['SELEÇÃO'])player.seasons['SELEÇÃO']={club:'',isNT:true,comps:[],matches:[],ntYears:[],titles:[]};
    state.activeSeason='SELEÇÃO';
  } else {
    if(player.seasons[name]){toast('Temporada já existe','err');return;}
    player.seasons[name]={club,isNT:false,comps:[],matches:[],ntYears:[],titles:[]};
    state.activeSeason=name;
  }
  state.activeView='season';seasonSubView='geral';save();render();closeModal('modalSeason');
  document.getElementById('sNameInput').value='';document.getElementById('sClubInput').value='';
  document.getElementById('sNtCheck').checked=false;document.getElementById('sClubRow').style.display='block';
  toast('Temporada criada!');
}

function deleteSeason(sKey){
  const player=state.players[state.activePlayerIdx];
  confirmDialog('Excluir temporada',`Excluir "${player.seasons[sKey].isNT?'Seleção':sKey}"? Todos os dados serão perdidos.`,()=>{
    delete player.seasons[sKey];
    const keys=Object.keys(player.seasons);
    state.activeSeason=keys.length>0?keys[0]:null;state.activeView='season';
    save();render();toast('Temporada removida');
  });
}

function renderDash(){
  renderTabs();
  document.getElementById('rankingContent').style.display='none';
  if(state.activeView==='career'){
    document.getElementById('careerContent').style.display='block';
    document.getElementById('seasonContent').style.display='none';
    document.getElementById('personalContent').style.display='none';
    renderCareer();
  } else if(state.activeView==='personal'){
    document.getElementById('careerContent').style.display='none';
    document.getElementById('seasonContent').style.display='none';
    document.getElementById('personalContent').style.display='block';
    renderPersonal();
  } else {
    document.getElementById('careerContent').style.display='none';
    document.getElementById('seasonContent').style.display='block';
    document.getElementById('personalContent').style.display='none';
    renderSeasonContent();
  }
}

function renderTabs(){
  const container=document.getElementById('seasonTabs');container.innerHTML='';
  if(state.activePlayerIdx===null)return;
  const player=state.players[state.activePlayerIdx];
  const keys=Object.keys(player.seasons||{}).sort((a,b)=>{if(a==='SELEÇÃO')return-1;if(b==='SELEÇÃO')return 1;return b-a;});
  const careerBtn=document.createElement('button');
  careerBtn.className='btn tab-btn'+(state.activeView==='career'?' active':'');
  if(state.activeView==='career')careerBtn.style.cssText='border-color:var(--purple);color:var(--purple);background:rgba(163,113,247,.18)';
  careerBtn.textContent='Carreira';careerBtn.onclick=()=>{state.activeView='career';save();renderDash();};
  container.appendChild(careerBtn);
  const personalBtn=document.createElement('button');
  personalBtn.className='btn tab-btn'+(state.activeView==='personal'?' active':'');
  if(state.activeView==='personal')personalBtn.style.cssText='border-color:var(--blue);color:var(--blue);background:rgba(88,166,255,.18)';
  personalBtn.textContent='👤 Pessoal';personalBtn.onclick=()=>{state.activeView='personal';save();renderDash();};
  container.appendChild(personalBtn);
  const sep=document.createElement('span');sep.textContent='|';sep.style.cssText='color:var(--border);margin:0 4px;font-size:.8rem';container.appendChild(sep);
  keys.forEach(s=>{
    const wrap=document.createElement('span');wrap.style.cssText='display:inline-flex;align-items:center;gap:2px';
    const t=document.createElement('button');
    const isActive=s===state.activeSeason&&state.activeView==='season';
    t.className='btn tab-btn'+(isActive?' active':'');
    const sd=player.seasons[s];
    if(sd.isNT){t.innerHTML='🏴 Seleção';if(isActive)t.style.cssText='border-color:var(--yellow);color:var(--yellow);background:rgba(227,179,65,.18)';}
    else t.innerHTML=`${s} <span style="font-size:.7rem;opacity:.7">${sd.club}</span>`;
    t.onclick=()=>{state.activeSeason=s;state.activeView='season';seasonSubView='geral';activeCompFilter=null;save();renderDash();};
    const del=document.createElement('button');del.className='season-del-btn';del.innerHTML='✕';del.onclick=()=>deleteSeason(s);
    wrap.appendChild(t);wrap.appendChild(del);container.appendChild(wrap);
  });
}

function renderSeasonContent(){
  const content=document.getElementById('seasonContent');
  if(state.activePlayerIdx===null||!state.activeSeason){content.innerHTML='';return;}
  const sd=state.players[state.activePlayerIdx].seasons[state.activeSeason];
  if(!sd){content.innerHTML='';return;}
  const matches=sd.matches||[];
  const comps=sd.comps||[];
  const titles=sd.titles||[];
  const overall=calcStats(matches);
  const heroHtml=`<div class="hero" style="${sd.isNT?'border-color:rgba(227,179,65,.3)':''}">
    <div class="hero-top"><span>${sd.isNT?'🏴 <b style="color:var(--yellow)">Seleção Nacional</b>':`Clube: <b style="color:#fff">${sd.club}</b> &nbsp;·&nbsp; Temporada: <b style="color:#fff">${state.activeSeason}</b>`}</span></div>
    <div class="hero-stats">
      <div class="stat"><div class="val">${overall.j}</div><div class="lbl">Jogos</div></div>
      <div class="stat green"><div class="val">${overall.g}</div><div class="lbl">Gols</div></div>
      <div class="stat blue"><div class="val">${overall.a}</div><div class="lbl">Assists</div></div>
      <div class="stat gold"><div class="val">${overall.g+overall.a}</div><div class="lbl">Participações</div></div>
      <div class="stat"><div class="val">${overall.j>0?(overall.g/overall.j).toFixed(2):'0.00'}</div><div class="lbl">G/Jogo</div></div>
    </div>
  </div>`;
  const subTabsHtml=`<div class="sub-tabs">
    <button class="sub-tab${seasonSubView==='geral'?' active':''}" onclick="setSubView('geral')">📊 Resumo Geral</button>
    <button class="sub-tab${seasonSubView==='porcomp'?' active':''}" onclick="setSubView('porcomp')">🏷️ Por Competição</button>
    <button class="sub-tab${seasonSubView==='porano'?' active':''}" onclick="setSubView('porano')">📅 Por Ano</button>
    <button class="sub-tab${seasonSubView==='jogos'?' active':''}" onclick="setSubView('jogos')">⚽ Jogos (${matches.length})</button>
  </div>`;
  let main='';
  if(seasonSubView==='geral') main=renderSubGeral(sd,matches,comps,titles,overall);
  else if(seasonSubView==='porcomp') main=renderSubPorComp(sd,matches,comps);
  else if(seasonSubView==='porano') main=renderSubPorAno(sd,matches);
  else if(seasonSubView==='jogos') main=renderSubJogos(sd,matches,comps);
  content.innerHTML=heroHtml+subTabsHtml+main;
}

function setSubView(v){seasonSubView=v;activeCompFilter=null;renderSeasonContent();}
function setCompFilter(cid){seasonSubView='jogos';activeCompFilter=cid;renderSeasonContent();}

function calcStats(matches){
  let j=0,g=0,a=0,gf=0,ga=0,w=0,d=0,l=0;
  matches.forEach(m=>{j++;g+=m.playerGoals||0;a+=m.playerAssists||0;gf+=m.gf||0;ga+=m.ga||0;
    const r=m.gf>m.ga?'W':m.gf===m.ga?'D':'L';
    if(r==='W')w++;else if(r==='D')d++;else l++;
  });
  return{j,g,a,gf,ga,w,d,l};
}

function getCompName(sd,compId){
  const c=(sd.comps||[]).find(x=>x.id===compId);
  return c?c.name:(compId||'—');
}

function getMatchYear(m,sKey){
  if(m.date&&m.date.length>=4)return m.date.substring(0,4);
  return sKey;
}

// --- RESUMO GERAL ---
function renderSubGeral(sd,matches,comps,titles,overall){
  let titlesHtml='';
  titles.forEach(t=>{titlesHtml+=`<div class="title-item"><span class="title-trophy">🏆</span><span class="title-name">${t.name}</span><button class="title-del" onclick="deleteTitle('${t.id}')">✕</button></div>`;});
  let compListHtml='';
  comps.forEach(c=>{
    const cnt=matches.filter(m=>m.compId===c.id).length;
    compListHtml+=`<div class="comp-list-item"><span class="comp-name">${c.name}</span><span style="font-size:.72rem;color:var(--dim)">${cnt} jogo${cnt!==1?'s':''}</span><button class="btn ghost" style="font-size:.7rem;padding:3px 10px" onclick="setCompFilter('${c.id}')">Ver jogos</button><button class="btn danger" style="padding:2px 8px;font-size:.72rem" onclick="deleteComp('${c.id}')">✕</button></div>`;
  });
  return `
    <div class="form-wrap" style="border-color:rgba(227,179,65,.3)">
      <div class="sec-header"><span class="sec-title" style="color:var(--yellow)">🏆 Títulos</span><span style="font-size:.72rem;color:var(--dim)">${titles.length}</span></div>
      ${titlesHtml.length>0?`<div class="title-list">${titlesHtml}</div>`:'<div style="color:var(--dim);font-size:.8rem;padding:4px 0 8px">Nenhum título ainda.</div>'}
      <div class="title-add-row"><input type="text" id="titleInput" placeholder="Nome do título" onkeydown="if(event.key==='Enter')addTitle()"><button class="btn" onclick="addTitle()">+ Título</button></div>
    </div>
    <div class="form-wrap">
      <div class="sec-header"><span class="sec-title">🏷️ Competições da temporada</span><span style="font-size:.72rem;color:var(--dim)">${comps.length}</span></div>
      ${compListHtml.length>0?compListHtml:'<div style="color:var(--dim);font-size:.8rem;padding:4px 0 8px">Nenhuma competição cadastrada.</div>'}
      <div class="title-add-row" style="margin-top:8px">
        <input type="text" id="compInput" placeholder="Nome da competição (ex: Brasileirão)" onkeydown="if(event.key==='Enter')addComp()">
        <button class="btn" style="background:rgba(240,136,62,.2);color:var(--gold);border:1px solid rgba(240,136,62,.4)" onclick="addComp()">+ Competição</button>
      </div>
    </div>
    <div class="form-wrap" style="border-color:rgba(63,185,80,.25)">
      <div class="sec-header"><span class="sec-title" style="color:var(--green)">⚽ Registrar jogo</span></div>
      <div style="color:var(--dim);font-size:.82rem;margin-bottom:10px">${comps.length===0?'⚠️ Cadastre pelo menos uma competição acima antes de adicionar jogos.':'Clique abaixo para registrar um jogo nesta temporada.'}</div>
      ${comps.length>0?`<button class="btn" onclick="openAddMatch()">+ Novo Jogo</button>`:''}
    </div>`;
}

// --- POR COMPETIÇÃO ---
function renderSubPorComp(sd,matches,comps){
  if(comps.length===0)return'<div class="empty">Nenhuma competição cadastrada nesta temporada.</div>';
  let html='';
  comps.forEach(c=>{
    const cm=matches.filter(m=>m.compId===c.id);
    const st=calcStats(cm);
    html+=`<div class="summary-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <span style="font-size:.95rem;font-weight:700;color:var(--gold)">${c.name}</span>
        <button class="btn ghost" style="font-size:.72rem;padding:4px 12px" onclick="setCompFilter('${c.id}')">Ver jogos →</button>
      </div>
      <div class="hero-stats" style="gap:14px">
        <div class="stat"><div class="val">${st.j}</div><div class="lbl">Jogos</div></div>
        <div class="stat green"><div class="val">${st.g}</div><div class="lbl">Gols</div></div>
        <div class="stat blue"><div class="val">${st.a}</div><div class="lbl">Assists</div></div>
        <div class="stat gold"><div class="val">${st.g+st.a}</div><div class="lbl">Partic.</div></div>
        <div class="stat"><div class="val">${st.j>0?(st.g/st.j).toFixed(2):'0.00'}</div><div class="lbl">G/J</div></div>
        <div class="stat"><div class="val" style="color:var(--dim)">${st.gf}</div><div class="lbl">Pró</div></div>
        <div class="stat"><div class="val" style="color:var(--red)">${st.ga}</div><div class="lbl">Contra</div></div>
      </div>
    </div>`;
  });
  return html;
}

// --- POR ANO ---
function renderSubPorAno(sd,matches){
  const yearMap={};
  matches.forEach(m=>{const yr=getMatchYear(m,state.activeSeason);if(!yearMap[yr])yearMap[yr]=[];yearMap[yr].push(m);});
  const years=Object.keys(yearMap).sort((a,b)=>b-a);
  if(years.length===0)return'<div class="empty">Nenhum jogo registrado ainda.</div>';
  let html='';
  years.forEach(yr=>{
    const st=calcStats(yearMap[yr]);
    html+=`<div class="summary-card">
      <div style="font-size:.95rem;font-weight:700;color:var(--blue);margin-bottom:14px">📅 ${yr}</div>
      <div class="hero-stats" style="gap:14px">
        <div class="stat"><div class="val">${st.j}</div><div class="lbl">Jogos</div></div>
        <div class="stat green"><div class="val">${st.g}</div><div class="lbl">Gols</div></div>
        <div class="stat blue"><div class="val">${st.a}</div><div class="lbl">Assists</div></div>
        <div class="stat gold"><div class="val">${st.g+st.a}</div><div class="lbl">Partic.</div></div>
        <div class="stat"><div class="val">${st.j>0?(st.g/st.j).toFixed(2):'0.00'}</div><div class="lbl">G/J</div></div>
        <div class="stat"><div class="val" style="color:var(--dim)">${st.gf}</div><div class="lbl">Pró</div></div>
        <div class="stat"><div class="val" style="color:var(--red)">${st.ga}</div><div class="lbl">Contra</div></div>
      </div>
    </div>`;
  });
  return html;
}

// --- LISTA DE JOGOS ---
function renderSubJogos(sd,matches,comps){
  const club=sd.club||'Seleção';
  let filtered=activeCompFilter?matches.filter(m=>m.compId===activeCompFilter):matches;
  filtered=[...filtered].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let filterHtml=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
    <button class="sub-tab${!activeCompFilter?' active':''}" onclick="activeCompFilter=null;renderSeasonContent()">Todos</button>`;
  comps.forEach(c=>{filterHtml+=`<button class="sub-tab${activeCompFilter===c.id?' active':''}" onclick="setCompFilter('${c.id}')">${c.name}</button>`;});
  filterHtml+=`</div>`;
  let matchesHtml='';
  filtered.forEach(m=>{
    const res=m.gf>m.ga?'W':m.gf===m.ga?'D':'L';
    const resColor=res==='W'?'var(--green)':res==='D'?'var(--yellow)':'var(--red)';
    const resLabel=res==='W'?'V':res==='D'?'E':'D';
    const homeTeam=m.loc==='home'?club:m.opponent||'—';
    const awayTeam=m.loc==='home'?m.opponent||'—':club;
    const homeScore=m.loc==='home'?m.gf:m.ga;
    const awayScore=m.loc==='home'?m.ga:m.gf;
    const compName=getCompName(sd,m.compId);
    let dateFmt='';
    if(m.date&&m.date.length===10){const[yr,mo,dy]=m.date.split('-');dateFmt=`${dy}/${mo}/${yr}`;}
    else dateFmt=m.date||'—';
    const pgDisp=m.playerGoals>0
      ?`<span style="color:var(--green);font-weight:700;font-size:.82rem">⚽ ${m.playerGoals}</span>`
      :`<span style="color:var(--border);font-size:.82rem">⚽ 0</span>`;
    const paDisp=m.playerAssists>0

        <span style="font-size:.85rem;font-weight:${m.loc==='away'?'700':'400'};color:${m.loc==='away'?'#fff':'var(--dim)'};white-space:nowrap">${awayTeam}</span>
        <span style="font-size:.6rem;background:${resColor}22;border-radius:4px;padding:1px 6px;color:${resColor};font-weight:700;flex-shrink:0">${resLabel}</span>
      </div>
      <span style="width:1px;height:20px;background:var(--border);flex-shrink:0;align-self:center"></span>
      <div style="display:flex;gap:10px;align-items:center;flex-shrink:0">${pgDisp}${paDisp}</div>
      <span style="width:1px;height:20px;background:var(--border);flex-shrink:0;align-self:center"></span>
      <span class="match-comp-tag" style="font-size:.65rem;flex-shrink:0">${compName}</span>
      <div class="match-actions" style="flex-shrink:0">
        <button class="btn edit-btn" style="padding:3px 8px;font-size:.72rem;border:1px solid rgba(240,136,62,.3)" onclick="editMatch('${m.id}')">✎</button>
        <button class="btn danger" style="padding:3px 8px;font-size:.72rem" onclick="deleteMatch('${m.id}')">✖</button>
      </div>
    </div>`;
  });
  return filterHtml+`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span class="sec-title">${filtered.length} jogo${filtered.length!==1?'s':''}</span>

    </div>
    ${filtered.length===0?'<div class="empty">Nenhum jogo registrado ainda.</div>':matchesHtml}`;
}

// ===================== CAREER =====================
function calcMilestones(playerIdx){
  const player=state.players[playerIdx];
  // Collect ALL matches across all seasons with full context, sorted by date
  const allMatches=[];
  const keys=Object.keys(player.seasons||{}).sort((a,b)=>{if(a==='SELEÇÃO')return 1;if(b==='SELEÇÃO')return -1;return a-b;});
  keys.forEach(sKey=>{
    const s=player.seasons[sKey];
    (s.matches||[]).forEach(m=>{
      if((m.playerGoals||0)===0)return; // skip scoreless games for perf
      allMatches.push({
        date:m.date||'',
        goals:m.playerGoals||0,
        opponent:m.opponent||'—',
        club:s.isNT?'🏴 Seleção':(s.club||'—'),
        season:sKey,
        comp:getCompName(s,m.compId)||'—',
        isNT:s.isNT||false
      });
    });
  });
  // Sort by date ascending (empty dates go last)
  allMatches.sort((a,b)=>{
    if(!a.date&&!b.date)return 0;
    if(!a.date)return 1;
    if(!b.date)return -1;
    return a.date.localeCompare(b.date);
  });
  // Walk through and detect milestone crossings
  const milestones=[];
  const targets=[100,200,300,400,500,600,700,800,900,1000];
  let cumulative=0;
  let tIdx=0;
  allMatches.forEach(m=>{
    const prev=cumulative;
    cumulative+=m.goals;
    // Check if we crossed any milestone in this match
    while(tIdx<targets.length && cumulative>=targets[tIdx]){
      const target=targets[tIdx];
      // Which goal number within this match was the milestone? (e.g. if prev=98, goals=3, target=100 → goal #2 in this match)
      const goalNumInMatch=target-prev; // 1-indexed within this match
      milestones.push({
        target,
        date:m.date,
        opponent:m.opponent,
        club:m.club,
        season:m.season,
        comp:m.comp,
        isNT:m.isNT,
        matchGoals:m.goals,
        goalNumInMatch
      });
      tIdx++;
    }
  });
  return{milestones,current:cumulative};
}

function getCareerData(playerIdx){
  const player=state.players[playerIdx];
  let totalJ=0,totalG=0,totalA=0;
  const compMap={},clubMap={},yearMap={},opponentMap={},ageMap={};
  const seasonStats=[],allTitles=[];
  const keys=Object.keys(player.seasons||{}).sort((a,b)=>{if(a==='SELEÇÃO')return-1;if(b==='SELEÇÃO')return 1;return b-a;});
  keys.forEach(sKey=>{
    const s=player.seasons[sKey];
    let sJ=0,sG=0,sA=0;
    (s.titles||[]).forEach(t=>{allTitles.push({name:t.name,season:sKey,club:s.isNT?'Seleção':s.club,isNT:s.isNT});});
    const matches=s.matches||[];
    matches.forEach(m=>{
      sJ++;sG+=m.playerGoals||0;sA+=m.playerAssists||0;
      totalJ++;totalG+=m.playerGoals||0;totalA+=m.playerAssists||0;
      const compName=getCompName(s,m.compId)||'SEM COMP';
      if(!compMap[compName])compMap[compName]={j:0,g:0,a:0};
      compMap[compName].j++;compMap[compName].g+=m.playerGoals||0;compMap[compName].a+=m.playerAssists||0;
      const yr=getMatchYear(m,sKey);
      if(!yearMap[yr])yearMap[yr]={j:0,g:0,a:0};
      yearMap[yr].j++;yearMap[yr].g+=m.playerGoals||0;yearMap[yr].a+=m.playerAssists||0;
      // Age tracking
      if(player.birth&&m.date&&m.date.length===10){
        const bd=new Date(player.birth);const md=new Date(m.date);
        let age=md.getFullYear()-bd.getFullYear();
        const hadBday=(md.getMonth()>bd.getMonth())||(md.getMonth()===bd.getMonth()&&md.getDate()>=bd.getDate());
        if(!hadBday)age--;
        if(age>=0&&age<=50){
          if(!ageMap[age])ageMap[age]={j:0,g:0,a:0};
          ageMap[age].j++;ageMap[age].g+=m.playerGoals||0;ageMap[age].a+=m.playerAssists||0;
        }
      }
      // Opponent tracking
      const opp=m.opponent&&m.opponent.trim()&&m.opponent!=='—'?m.opponent.trim():'Desconhecido';
      if(!opponentMap[opp])opponentMap[opp]={j:0,g:0,a:0,w:0,d:0,l:0,gf:0,ga:0};
      opponentMap[opp].j++;
      opponentMap[opp].g+=m.playerGoals||0;
      opponentMap[opp].a+=m.playerAssists||0;
      opponentMap[opp].gf+=m.gf||0;
      opponentMap[opp].ga+=m.ga||0;
      const mres=m.gf>m.ga?'w':m.gf===m.ga?'d':'l';
      opponentMap[opp][mres]++;
    });
    (s.ntYears||[]).forEach(yr=>{
      (yr.entries||[]).forEach(e=>{
        sJ+=e.j;sG+=e.g;sA+=e.a;totalJ+=e.j;totalG+=e.g;totalA+=e.a;
        const c=e.comp||'SEM COMP';
        if(!compMap[c])compMap[c]={j:0,g:0,a:0};compMap[c].j+=e.j;compMap[c].g+=e.g;compMap[c].a+=e.a;
        const y=yr.year||'?';if(!yearMap[y])yearMap[y]={j:0,g:0,a:0};yearMap[y].j+=e.j;yearMap[y].g+=e.g;yearMap[y].a+=e.a;
      });
      if(yr.entries&&yr.entries.length>0){const st=calcStats([]);seasonStats.push({year:yr.year,club:'🏴 Seleção',j:yr.entries.reduce((s,e)=>s+e.j,0),g:yr.entries.reduce((s,e)=>s+e.g,0),a:yr.entries.reduce((s,e)=>s+e.a,0),isNT:true});}
    });
    if(s.isNT){if(sJ>0)seasonStats.push({year:sKey,club:'🏴 Seleção',j:sJ,g:sG,a:sA,isNT:true});}
    else{
      const club=s.club;
      if(!clubMap[club])clubMap[club]={j:0,g:0,a:0,seasons:0};
      clubMap[club].j+=sJ;clubMap[club].g+=sG;clubMap[club].a+=sA;clubMap[club].seasons++;
      seasonStats.push({year:sKey,club,j:sJ,g:sG,a:sA,isNT:false});
    }
  });
  seasonStats.sort((a,b)=>b.year-a.year);
  return{totalJ,totalG,totalA,compMap,clubMap,yearMap,ageMap,opponentMap,seasonStats,allTitles,
    clubs:[...new Set(Object.values(player.seasons||{}).filter(s=>!s.isNT).map(s=>s.club))],
    seasons:keys.length};
}

  const initials=player.name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
  const avgGoals=d.totalJ>0?(d.totalG/d.totalJ).toFixed(2):'0.00';
  const compsorted=Object.entries(d.compMap).sort((a,b)=>b[1].g-a[1].g);
  const clubsorted=Object.entries(d.clubMap).sort((a,b)=>b[1].g-a[1].g);
  const yearsorted=Object.entries(d.yearMap).sort((a,b)=>b[0].localeCompare(a[0]));

  let titlesCareerHtml='';
  d.allTitles.forEach(t=>{
    titlesCareerHtml+=`<div class="title-card"><div class="title-card-trophy">🏆</div><div><div class="title-card-name">${t.name}</div><div class="title-card-season">${t.isNT?'🏴 ':''}${t.club} · ${t.season!=='SELEÇÃO'?t.season:'Seleção Nacional'}</div></div></div>`;

      <div class="career-stat"><div class="val" style="color:var(--dim)">${avgGoals}</div><div class="lbl">Gols/Jogo</div></div>
      <div class="career-stat"><div class="val" style="color:var(--yellow)">${d.allTitles.length}</div><div class="lbl">Títulos</div></div>
    </div>
    <div class="divider"></div>
    <div class="section-label" style="color:var(--yellow)">🏆 Títulos</div>
    ${d.allTitles.length>0?`<div class="titles-grid">${titlesCareerHtml}</div>`:'<div class="empty" style="padding:16px">Nenhum título ainda</div>'}`;

  // ===== MARCOS DE GOLS =====

  const msReached=msData.milestones.length;
  const msNext=msReached<targets.length?targets[msReached]:null;
  const msNextRemaining=msNext?msNext-msData.current:0;
  html+=`<div class="divider"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">

      ${msNext?`<span style="font-size:.72rem;color:var(--purple);background:rgba(163,113,247,.12);border:1px solid rgba(163,113,247,.3);border-radius:10px;padding:3px 10px;font-weight:600">${msNextRemaining} gol${msNextRemaining!==1?'s':''} para o gol ${msNext.toLocaleString('pt-BR')}</span>`:`<span style="font-size:.72rem;color:var(--green);background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.3);border-radius:10px;padding:3px 10px;font-weight:600">🏅 Todos os marcos alcançados!</span>`}
    </div>
    <div class="milestone-grid">`;
  targets.forEach(t=>{

          :`<div style="font-size:.72rem;color:var(--dim);margin-top:4px">Ainda não alcançado</div>`}
      </div>`;
    }
  });
  html+=`</div>`;

  if(yearsorted.length>0){

        <div class="career-stats-grid">
          <div class="career-stat"><div class="val" style="color:#fff">${v.j}</div><div class="lbl">Jogos</div></div>
          <div class="career-stat"><div class="val" style="color:var(--green)">${v.g}</div><div class="lbl">Gols</div></div>
          <div class="career-stat"><div class="val" style="color:var(--blue)">${v.a}</div><div class="lbl">Assists</div></div>
          <div class="career-stat"><div class="val" style="color:var(--gold)">${v.g+v.a}</div><div class="lbl">Participações</div></div>
          <div class="career-stat"><div class="val" style="color:var(--dim)">${v.j>0?(v.g/v.j).toFixed(2):'0.00'}</div><div class="lbl">G/J</div></div>
        </div></div>`;
    });
  }
  if(clubsorted.length>0){
    html+=`<div class="divider"></div><div class="section-label">Por clube</div>
      <table class="comp-career-table"><thead><tr><th>Clube</th><th>Temp.</th><th>Jogos</th><th>Gols</th><th>Assists</th><th>Partic.</th><th>G/J</th></tr></thead><tbody>`;
    clubsorted.forEach(([club,cd])=>{
      html+=`<tr><td style="font-weight:600">${club}</td><td style="color:var(--dim)">${cd.seasons}</td><td>${cd.j}</td><td class="g-num">${cd.g}</td><td class="a-num">${cd.a}</td><td style="color:var(--gold);font-weight:700">${cd.g+cd.a}</td><td style="color:var(--dim)">${cd.j>0?(cd.g/cd.j).toFixed(2):'0.00'}</td></tr>`;
    });
    html+=`</tbody></table>`;
  }
  html+=`<div class="divider"></div><div class="section-label">Histórico por temporada</div>`;
  if(d.seasonStats.length===0){html+=`<div class="empty" style="padding:20px">Nenhuma temporada registrada</div>`;}
  else d.seasonStats.forEach(s=>{
    const badge=s.isNT?`<span class="nt-season-badge">🏴 Seleção</span>`:'';
    const accent=s.isNT?'rgba(227,179,65,.3)':'rgba(63,185,80,.2)';
    html+=`<div style="margin-bottom:10px">
      <div style="font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:500;display:flex;align-items:center;gap:6px">${s.year}${badge}<span style="font-weight:400">${s.isNT?'':'· '+s.club}</span></div>
      <div class="career-stats-grid" style="border-left:3px solid ${accent};padding-left:10px">
        <div class="career-stat"><div class="val" style="color:#fff">${s.j}</div><div class="lbl">Jogos</div></div>
        <div class="career-stat"><div class="val" style="color:var(--green)">${s.g}</div><div class="lbl">Gols</div></div>
        <div class="career-stat"><div class="val" style="color:var(--blue)">${s.a}</div><div class="lbl">Assists</div></div>
        <div class="career-stat"><div class="val" style="color:var(--gold)">${s.g+s.a}</div><div class="lbl">Partic.</div></div>
        <div class="career-stat"><div class="val" style="color:var(--dim)">${s.j>0?(s.g/s.j).toFixed(2):'0.00'}</div><div class="lbl">G/J</div></div>
      </div></div>`;
  });
  html+=`<div class="divider"></div><div class="section-label">Por competição (carreira)</div>`;
  if(compsorted.length>0){
    html+=`<table class="comp-career-table"><thead><tr><th>Competição</th><th>Jogos</th><th>Gols</th><th>Assists</th><th>Partic.</th><th>G/J</th></tr></thead><tbody>`;
    compsorted.forEach(([comp,cd])=>{
      html+=`<tr><td><span class="tag">${comp}</span></td><td>${cd.j}</td><td class="g-num">${cd.g}</td><td class="a-num">${cd.a}</td><td style="color:var(--gold);font-weight:700">${cd.g+cd.a}</td><td style="color:var(--dim)">${cd.j>0?(cd.g/cd.j).toFixed(2):'0.00'}</td></tr>`;
    });
    html+=`</tbody></table>`;
  } else html+=`<div class="empty" style="padding:20px">Nenhum dado</div>`;

  // ===== POR IDADE =====
  // Build cumulative age stats: total accumulated at each birthday
  const ageCumRows=[];
  if(player.birth){
    // Collect all matches with dates, sorted ascending
    const allDatedMatches=[];
    Object.keys(player.seasons||{}).forEach(sKey=>{
      const s=player.seasons[sKey];
      (s.matches||[]).forEach(m=>{
        if(m.date&&m.date.length===10){
          allDatedMatches.push({date:m.date,g:m.playerGoals||0,a:m.playerAssists||0,j:1});
        }
      });
    });
    allDatedMatches.sort((a,b)=>a.date.localeCompare(b.date));
    if(allDatedMatches.length>0){
      const bd=new Date(player.birth);
      // Find min and max age from data
      const firstDate=new Date(allDatedMatches[0].date);
      const lastDate=new Date(allDatedMatches[allDatedMatches.length-1].date);
      let startAge=lastDate.getFullYear()-bd.getFullYear();
      const hadBdayLast=(lastDate.getMonth()>bd.getMonth())||(lastDate.getMonth()===bd.getMonth()&&lastDate.getDate()>=bd.getDate());
      if(!hadBdayLast)startAge--;
      // For each age from first to last, compute cumulative at END of that age (on their birthday)
      let firstAge=firstDate.getFullYear()-bd.getFullYear();
      const hadBdayFirst=(firstDate.getMonth()>bd.getMonth())||(firstDate.getMonth()===bd.getMonth()&&firstDate.getDate()>=bd.getDate());
      if(!hadBdayFirst)firstAge--;
      for(let age=firstAge;age<=startAge;age++){
        // Birthday that marks end of this age = birthday in (birth year + age + 1)
        const bdayEnd=new Date(bd.getFullYear()+age+1,bd.getMonth(),bd.getDate());
        // All matches before this birthday
        let cumJ=0,cumG=0,cumA=0;
        allDatedMatches.forEach(m=>{
          if(new Date(m.date)<bdayEnd){cumJ+=m.j;cumG+=m.g;cumA+=m.a;}
        });
        // Matches played during this age specifically
        const bdayStart=new Date(bd.getFullYear()+age,bd.getMonth(),bd.getDate());
        let ageJ=0,ageG=0,ageA=0;
        allDatedMatches.forEach(m=>{
          const md=new Date(m.date);
          if(md>=bdayStart&&md<bdayEnd){ageJ+=m.j;ageG+=m.g;ageA+=m.a;}
        });
        if(ageJ>0||age===startAge)ageCumRows.push({age,cumJ,cumG,cumA,ageJ,ageG,ageA});
      }
    }
  }
  html+=`<div class="divider"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div class="section-label" style="color:var(--gold);margin-bottom:0">🎂 Acumulado por idade</div>
      ${!player.birth?`<span style="font-size:.72rem;color:var(--red)">⚠️ Cadastre a data de nascimento e as datas dos jogos</span>`:ageCumRows.length===0?`<span style="font-size:.72rem;color:var(--dim)">Registre datas nos jogos para calcular</span>`:''}
    </div>`;
  if(ageCumRows.length>0){
    const maxCumG=Math.max(...ageCumRows.map(r=>r.cumG));
    html+=`<div style="overflow-x:auto;margin-bottom:14px">
      <table class="comp-career-table" style="min-width:520px">
        <thead><tr>
          <th>Ao completar</th>
          <th>Jogos acum.</th>
          <th style="color:var(--green)">Gols acum.</th>
          <th style="color:var(--blue)">Assists acum.</th>
          <th style="color:var(--gold)">Partic. acum.</th>
          <th style="color:var(--dim)">Nessa idade</th>
          <th style="min-width:110px">Progressão</th>
        </tr></thead>
        <tbody>`;
    ageCumRows.forEach((r,i)=>{
      const prev=i>0?ageCumRows[i-1].cumG:0;
      const diff=r.cumG-prev;
      const barW=maxCumG>0?Math.round(r.cumG/maxCumG*100):0;
      html+=`<tr>
        <td style="font-weight:700;color:#fff;white-space:nowrap">${r.age+1} anos</td>
        <td style="color:var(--dim)">${r.cumJ}</td>
        <td style="color:var(--green);font-weight:700">${r.cumG}</td>
        <td style="color:var(--blue);font-weight:700">${r.cumA}</td>
        <td style="color:var(--gold);font-weight:700">${r.cumG+r.cumA}</td>
        <td style="color:var(--dim);font-size:.78rem">${r.ageG>0?`+${r.ageG}g`:''} ${r.ageA>0?`+${r.ageA}a`:''} ${r.ageJ} jogo${r.ageJ!==1?'s':''}</td>
        <td>
          <div style="display:flex;align-items:center;gap:6px">
            <div style="flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;min-width:80px">
              <div style="height:100%;background:rgba(63,185,80,.7);border-radius:3px;width:${barW}%"></div>
            </div>
            <span style="font-size:.65rem;color:var(--green);min-width:28px;text-align:right;font-weight:600">${r.cumG}</span>
          </div>
        </td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
    const last=ageCumRows[ageCumRows.length-1];
    html+=`<div style="font-size:.72rem;color:var(--dim);padding:4px 2px">
      💡 Cada linha mostra o total acumulado <b style="color:#fff">ao completar aquela idade</b> — ou seja, o que o jogador já tinha na carreira naquele aniversário.
    </div>`;
  } else if(player.birth){
    html+=`<div class="empty" style="padding:16px">Registre as datas dos jogos para calcular o acumulado por idade</div>`;
  }

  // ===== POR ADVERSÁRIO =====
  html+=`<div class="divider"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="section-label" style="color:var(--purple);margin-bottom:0">🆚 Por adversário</div>
      <span style="font-size:.72rem;color:var(--dim)">${oppsorted.length} adversário${oppsorted.length!==1?'s':''}</span>
    </div>`;

  if(oppsorted.length>0){
    // Sort options
    html+=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
      <input class="opp-search" id="oppSearchInput" placeholder="🔍 Buscar adversário..." oninput="filterOppTable(this.value)" style="flex:1;min-width:160px;max-width:280px;margin-bottom:0">
      <select id="oppSortSel" onchange="sortOppTable(this.value)" style="background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:7px 10px;border-radius:8px;font-size:.78rem;outline:none">
        <option value="j">Ordenar: Jogos</option>
        <option value="g">Ordenar: Gols</option>
        <option value="a">Ordenar: Assists</option>
        <option value="w">Ordenar: Vitórias</option>
      </select>
    </div>`;

    let oppRowsHtml='';
    oppsorted.forEach(([opp,od])=>{
      const wPct=od.j>0?Math.round(od.w/od.j*100):0;
      const wColor=wPct>=60?'var(--green)':wPct>=40?'var(--yellow)':'var(--red)';
      oppRowsHtml+=`<tr data-opp="${opp.replace(/"/g,'&quot;')}" data-j="${od.j}" data-g="${od.g}" data-a="${od.a}" data-w="${od.w}">
        <td style="font-weight:600;color:#fff">${opp}</td>
        <td style="color:var(--dim);font-weight:600">${od.j}</td>
        <td style="color:var(--green);font-weight:700">${od.w}</td>
        <td style="color:var(--yellow)">${od.d}</td>
        <td style="color:var(--red)">${od.l}</td>
        <td style="font-size:.72rem;color:${wColor};font-weight:700">${wPct}%</td>
        <td class="g-num">${od.g}</td>
        <td class="a-num">${od.a}</td>
        <td style="color:var(--gold);font-weight:700">${od.g+od.a}</td>
        <td style="color:var(--dim)">${od.j>0?(od.g/od.j).toFixed(2):'0.00'}</td>
      </tr>`;
    });

    html+=`<div style="overflow-x:auto">
      <table class="opp-table">
        <thead><tr>
          <th>Adversário</th>
          <th>J</th>
          <th style="color:var(--green)">V</th>
          <th style="color:var(--yellow)">E</th>
          <th style="color:var(--red)">D</th>
          <th>%V</th>
          <th style="color:var(--green)">Gols</th>
          <th style="color:var(--blue)">Assists</th>
          <th style="color:var(--gold)">Partic.</th>
          <th>G/J</th>
        </tr></thead>
        <tbody id="oppTableBody">${oppRowsHtml}</tbody>
      </table>
    </div>`;
  } else {
    html+=`<div class="empty" style="padding:20px">Nenhum jogo registrado com adversários identificados</div>`;
  }

  html+=`</div>`;
  document.getElementById('careerContent').innerHTML=html;
}

function sortOppTable(field){
  const tbody=document.getElementById('oppTableBody');
  if(!tbody)return;
  const rows=[...tbody.querySelectorAll('tr')];
  rows.sort((a,b)=>parseInt(b.getAttribute('data-'+field)||0)-parseInt(a.getAttribute('data-'+field)||0));
  rows.forEach(r=>tbody.appendChild(r));
  // Re-apply filter
  const q=document.getElementById('oppSearchInput')?.value||'';
  if(q)filterOppTable(q);
}

// ===================== RANKING =====================
function getPlayerAllMatches(player){
  let matches=[];
  Object.values(player.seasons||{}).forEach(s=>{
    (s.matches||[]).forEach(m=>{
      const compName=getCompName(s,m.compId)||m.comp||'SEM COMP';
      matches.push({...m,compName});
    });
    (s.ntYears||[]).forEach(yr=>{
      (yr.entries||[]).forEach(e=>{
        for(let i=0;i<e.j;i++)matches.push({playerGoals:i===0?e.g:0,playerAssists:i===0?e.a:0,compName:e.comp||'SEM COMP',gf:0,ga:0,loc:'home',opponent:'—'});
      });
    });
  });
  return matches;
}

function renderRanking(){
  const allComps=new Set();
  state.players.forEach(p=>getPlayerAllMatches(p).forEach(m=>allComps.add(m.compName)));
  const compList=[...allComps].filter(Boolean).sort();
  if(!rankComp&&compList.length>0)rankComp=compList[0];
  const generalRank=state.players.map(p=>{let j=0,g=0,a=0;getPlayerAllMatches(p).forEach(m=>{j++;g+=m.playerGoals||0;a+=m.playerAssists||0;});return{name:p.name,j,g,a};});
  const posIcon=i=>{if(i===0)return`<span class="rank-pos">🥇</span>`;if(i===1)return`<span class="rank-pos">🥈</span>`;if(i===2)return`<span class="rank-pos">🥉</span>`;return`<span class="rank-pos" style="color:var(--dim)">${i+1}</span>`;};
  const buildList=(arr,field,color)=>{
    const sorted=[...arr].sort((a,b)=>b[field]-a[field]);
    if(sorted.every(x=>x[field]===0))return`<div class="empty" style="padding:16px">Sem dados</div>`;
    return sorted.map((x,i)=>`<div class="rank-row">${posIcon(i)}<div class="rank-name">${x.name}</div><div class="rank-val" style="color:${color}">${x[field]}</div></div>`).join('');
  };
  let compTabsHtml='';compList.forEach(c=>{compTabsHtml+=`<button class="rank-tab${rankComp===c?' active':''}" onclick="rankComp='${c.replace(/'/g,"\\'")}';renderRanking()">${c}</button>`;});
  const rc=rankComp?state.players.map(p=>{let j=0,g=0,a=0;getPlayerAllMatches(p).filter(m=>m.compName===rankComp).forEach(m=>{j++;g+=m.playerGoals||0;a+=m.playerAssists||0;});return{name:p.name,j,g,a};}):[];
  const titleCounts=state.players.map(p=>{let count=0;Object.values(p.seasons||{}).forEach(s=>{count+=(s.titles||[]).length;});return{name:p.name,count};}).sort((a,b)=>b.count-a.count);
  let titlesRankHtml=titleCounts.every(x=>x.count===0)?'<div class="empty" style="padding:16px">Nenhum título</div>':titleCounts.map((x,i)=>`<div class="rank-row">${posIcon(i)}<div class="rank-name">${x.name}</div><div class="rank-val" style="color:var(--yellow)">${x.count} 🏆</div></div>`).join('');
  document.getElementById('rankingContent').innerHTML=`
    <div class="rank-section">
      <div class="section-label">Ranking Geral</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
        <div><div style="font-size:.72rem;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600">⚽ Artilheiros</div>${buildList(generalRank,'g','var(--green)')}</div>
        <div><div style="font-size:.72rem;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600">🎯 Garçons</div>${buildList(generalRank,'a','var(--blue)')}</div>
      </div>
      <div><div style="font-size:.72rem;color:var(--yellow);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600">🏆 Mais títulos</div>${titlesRankHtml}</div>
    </div>
    ${compList.length>0?`<div class="rank-section"><div class="section-label">Ranking por Competição</div><div class="rank-tabs">${compTabsHtml}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><div style="font-size:.72rem;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600">⚽ Artilheiros</div>${buildList(rc,'g','var(--green)')}</div><div><div style="font-size:.72rem;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600">🎯 Garçons</div>${buildList(rc,'a','var(--blue)')}</div></div></div>`:'<div class="rank-section"><div class="empty">Nenhuma competição ainda</div></div>'}`;
}

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
          <input type="text" id="tTemp_${c.id}" placeholder="Temporada (ex: 2016/17)" value="${editT?editT.temporada:''}" style="background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:.83rem;flex:1;min-width:130px;outline:none">
          <input type="number" id="tValor_${c.id}" placeholder="Valor (€)" value="${editT?editT.valor:''}" style="background:var(--surface2);border:1px solid var(--border);color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:.83rem;flex:1;min-width:110px;outline:none">
          <button class="btn" style="white-space:nowrap" onclick="saveTemp('${c.id}')">${editT?'Atualizar':'+ Temporada'}</button>
        </div>
        <div class="sec-header" style="margin-bottom:8px;margin-top:10px"><span class="sec-title" style="color:var(--blue)">${eb?'✎ Editando bônus':'⭐ Adicionar bônus'}</span>${eb?`<button class="btn ghost" style="font-size:.72rem" onclick="cancelBonusEdit()">Cancelar</button>`:''}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input type="text" id="bTemp_${c.id}" placeholder="Temporada" value="${eb?eb.temporada:''}" style="background:var(--surface2);border:1px solid rgba(88,166,255,.3);color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:.83rem;flex:1;min-width:120px;outline:none">
          <input type="text" id="bDesc_${c.id}" placeholder="Descrição" value="${eb?eb.descricao:''}" style="background:var(--surface2);border:1px solid rgba(88,166,255,.3);color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:.83rem;flex:2;min-width:140px;outline:none">
          <input type="number" id="bValor_${c.id}" placeholder="Valor (€)" value="${eb?eb.valor:''}" style="background:var(--surface2);border:1px solid rgba(88,166,255,.3);color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:.83rem;flex:1;min-width:100px;outline:none">
          <button class="btn" style="background:rgba(88,166,255,.2);color:var(--blue);border:1px solid rgba(88,166,255,.4);white-space:nowrap" onclick="saveBonus('${c.id}')">${eb?'Atualizar':'+ Bônus'}</button>
        </div>
      </div>`;
    }
    cardsHtml+=`<div class="contract-card" style="${editingContractId===c.id?'border-color:var(--gold)':''}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
        <div><div style="font-size:1rem;font-weight:700">${c.time||'—'}</div><div style="font-size:.72rem;color:var(--dim);margin-top:2px">${c.forma||''}${c.obs?' · '+c.obs:''}</div></div>
        <div style="text-align:right"><div style="font-size:.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px">Total</div><div style="font-size:1.15rem;font-weight:700;color:var(--gold)">${fmtEuro(total)}</div><div style="font-size:.7rem;color:var(--dim);margin-top:2px">Sal. ${fmtEuro(tTotal)} · Bônus ${fmtEuro(bTotal)}</div></div>
      </div>
      ${tempRows.length>0?`<div style="font-size:.62rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Temporadas</div>${tempRows}`:''}
      ${bonusRows.length>0?`<div style="font-size:.62rem;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin-top:10px;margin-bottom:4px">Bônus</div>${bonusRows}`:''}
      ${addTempForm}
      <div style="display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(48,54,61,.5)">
        <button class="btn" style="background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.3);font-size:.78rem;padding:6px 12px" onclick="toggleContractOpen('${c.id}')">${isOpen?'✕ Fechar':'＋ Temporada / Bônus'}</button>
        <button class="btn edit-btn" style="font-size:.78rem;padding:6px 12px;border:1px solid rgba(240,136,62,.3)" onclick="editContract('${c.id}')">✎</button>
        <button class="btn danger" style="font-size:.78rem;padding:6px 12px" onclick="deleteContract('${c.id}')">✖ Excluir</button>
      </div>
    </div>`;
  });
  document.getElementById('personalContent').innerHTML=`
    <div class="contracts-total-bar"><div><div class="sub">Total da carreira</div><div class="big-num">${fmtEuro(grandTotal)}</div></div>
      <div style="display:flex;gap:24px;align-items:center"><div style="text-align:right"><div class="sub">Salários</div><div style="font-size:1.1rem;font-weight:700;color:var(--gold)">${fmtEuro(totalSalarios)}</div></div><div style="text-align:right"><div class="sub">Bônus</div><div style="font-size:1.1rem;font-weight:700;color:var(--blue)">${fmtEuro(totalBonus)}</div></div></div>
    </div>
    ${formContrato}
    <div class="sec-header"><span class="sec-title">Contratos</span><span style="font-size:.75rem;color:var(--dim)">${contracts.length}</span></div>
    ${contracts.length===0?'<div class="empty">Nenhum contrato ainda.</div>':cardsHtml}`;
}

function toggleContractOpen(cid){
  if(activeContractId===cid){activeContractId=null;editingTempId=null;editingBonusId=null;}
  else{activeContractId=cid;editingTempId=null;editingBonusId=null;}
  renderPersonal();
  if(activeContractId)setTimeout(()=>document.getElementById('tTemp_'+cid)?.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}
function saveContract(){
  const contracts=getContracts();
  const time=document.getElementById('cTime').value.trim();
  const forma=document.getElementById('cForma').value;
  const obs=document.getElementById('cObs').value.trim();
  if(!time){toast('Preencha o time/clube','err');return;}
  if(editingContractId){const idx=contracts.findIndex(c=>c.id===editingContractId);if(idx!==-1){contracts[idx].time=time;contracts[idx].forma=forma;contracts[idx].obs=obs;}editingContractId=null;}
  else{const nc={id:'c_'+Date.now(),time,forma,obs,temporadas:[],bonuses:[]};contracts.push(nc);activeContractId=nc.id;}
  save();renderPersonal();toast('Contrato salvo!');
}
function editContract(id){editingContractId=id;activeContractId=null;renderPersonal();setTimeout(()=>document.getElementById('cTime')?.scrollIntoView({behavior:'smooth',block:'nearest'}),50);}
function cancelContractEdit(){editingContractId=null;renderPersonal();}
function deleteContract(id){
  confirmDialog('Excluir contrato','Excluir este contrato?',()=>{
    state.players[state.activePlayerIdx].contracts=state.players[state.activePlayerIdx].contracts.filter(c=>c.id!==id);
    if(editingContractId===id)editingContractId=null;if(activeContractId===id)activeContractId=null;
    save();renderPersonal();toast('Contrato removido');
  });
}
function saveTemp(cid){
  const c=getContracts().find(x=>x.id===cid);if(!c)return;if(!c.temporadas)c.temporadas=[];
  const temp=document.getElementById('tTemp_'+cid)?.value.trim();
  const valor=parseFloat(document.getElementById('tValor_'+cid)?.value)||0;
  if(!temp){toast('Preencha a temporada','err');return;}if(!valor){toast('Preencha o valor','err');return;}
  if(editingTempId){const idx=c.temporadas.findIndex(t=>t.id===editingTempId);if(idx!==-1)c.temporadas[idx]={id:editingTempId,temporada:temp,valor};editingTempId=null;}
  else c.temporadas.push({id:'t_'+Date.now(),temporada:temp,valor});
  save();renderPersonal();toast('Temporada salva!');
}
function editTemp(cid,tid){activeContractId=cid;editingTempId=tid;editingBonusId=null;renderPersonal();setTimeout(()=>document.getElementById('tTemp_'+cid)?.scrollIntoView({behavior:'smooth',block:'nearest'}),50);}
function cancelTempEdit(){editingTempId=null;renderPersonal();}
function deleteTemp(cid,tid){
  const c=getContracts().find(x=>x.id===cid);
  confirmDialog('Excluir temporada','Remover?',()=>{c.temporadas=c.temporadas.filter(t=>t.id!==tid);if(editingTempId===tid)editingTempId=null;save();renderPersonal();toast('Removido');});
}
function saveBonus(cid){
  const c=getContracts().find(x=>x.id===cid);if(!c)return;if(!c.bonuses)c.bonuses=[];
  const temp=document.getElementById('bTemp_'+cid)?.value.trim();
  const desc=document.getElementById('bDesc_'+cid)?.value.trim();
  const valor=parseFloat(document.getElementById('bValor_'+cid)?.value)||0;
  if(!temp){toast('Preencha a temporada','err');return;}if(!desc){toast('Preencha a descrição','err');return;}if(!valor){toast('Preencha o valor','err');return;}
  if(editingBonusId){const idx=c.bonuses.findIndex(b=>b.id===editingBonusId);if(idx!==-1)c.bonuses[idx]={id:editingBonusId,temporada:temp,descricao:desc,valor};editingBonusId=null;}
  else c.bonuses.push({id:'b_'+Date.now(),temporada:temp,descricao:desc,valor});
  save();renderPersonal();toast('Bônus salvo!');
}
function editBonus(cid,bid){activeContractId=cid;editingBonusId=bid;editingTempId=null;renderPersonal();setTimeout(()=>document.getElementById('bTemp_'+cid)?.scrollIntoView({behavior:'smooth',block:'nearest'}),50);}
function cancelBonusEdit(){editingBonusId=null;renderPersonal();}
function deleteBonus(cid,bid){
  const c=getContracts().find(x=>x.id===cid);
  confirmDialog('Excluir bônus','Remover?',()=>{c.bonuses=c.bonuses.filter(b=>b.id!==bid);if(editingBonusId===bid)editingBonusId=null;save();renderPersonal();toast('Bônus removido');});
}
</script>
</body>
</html>
