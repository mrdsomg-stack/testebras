<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Manager Hub - Pro</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --accent: #00ff88;
            --text: #ffffff;
            --header-bg: #000000;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--header-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            width: 95%;
            max-width: 1300px;
            margin-top: 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select, input, button {
            background: #1a1a1a;
            color: white;
            border: 1px solid var(--accent);
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            border-bottom: 2px solid var(--accent);
            padding: 12px;
            font-size: 0.9rem;
            color: var(--accent);
        }

        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-mini {
            width: 45px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text);
            padding: 10px 20px;
            cursor: pointer;
            opacity: 0.6;
        }

        .tab-btn.active {
            opacity: 1;
            border-bottom: 2px solid var(--accent);
            color: var(--accent);
        }

        .points-cell { font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<header>Football Manager Hub</header>

<div class="container">
    <div class="controls">
        <div id="yearArea">
            <select id="yearSelect" onchange="changeContext()">
                <option value="2026">2026</option>
                <option value="2027">2027</option>
            </select>
            <button onclick="addYear()">+ Ano</button>
        </div>
        
        <select id="leagueSelect" onchange="changeContext()">
            <option value="la-liga">La Liga</option>
            <option value="premier-league">Premier League</option>
            <option value="bundesliga">Bundesliga</option>
            <option value="ligue-1">Ligue 1</option>
        </select>
    </div>

    <div class="card">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="showTab('tabela')">Tabela</button>
            <button class="tab-btn" onclick="showTab('artilharia')">Artilheiros</button>
        </div>

        <div id="tab-tabela" class="tab-content">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Clube</th>
                        <th>Jogos</th>
                        <th>Vitoria</th>
                        <th>Empate</th>
                        <th>Derrota</th>
                        <th>Pontos</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div id="tab-artilharia" class="tab-content" style="display:none;">
            <h3>Top Artilheiros</h3>
            <div class="controls">
                <input type="text" id="pName" placeholder="Nome do Jogador">
                <input type="number" id="pGoals" placeholder="Gols">
                <button onclick="saveScorer()" style="background: var(--accent); color: black; font-weight: bold;">Salvar</button>
            </div>
            <table>
                <thead><tr><th>Jogador</th><th>Gols</th><th>Ação</th></tr></thead>
                <tbody id="scorersBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const CLUBS_MASTER = {
        "la-liga": ["Barcelona", "Real Madrid", "Atletico de Madrid", "Girona", "Getafe", "Espanhol", "Valencia", "Celta Vigo", "Atletico Bilbao", "Villarreal", "Raio Vallecano", "Osasuna", "Real Betis", "Real Sociedad"],
        "premier-league": ["Manchester City", "Manchester United", "Liverpool", "Aston Villa", "Bournemouth", "Chelsea", "Everton", "Tottenham", "Newcastle", "Wolverhampton", "Nottigham Forest", "Fulham", "Sunderland"],
        "bundesliga": ["Bayern Munich", "Borussia Dortmund", "RB Leipzig", "Bayer Leverkusen", "Stuttgart", "Freiburb", "Augsburg", "Mainz 05", "Hamburgo", "Werder Bremen", "Wolfsburg", "Eitracht Frankfurk", "Koln", "Heidenheim"],
        "ligue-1": ["Lens", "Lyon", "Lile", "Rennes", "Monaco", "Marseille", "Lorient", "Toulouse", "Le Havre", "Nice", "Auxerre", "Nantes", "Strasbourg"]
    };

    let db = JSON.parse(localStorage.getItem('fb_manager_db')) || { seasons: {} };

    function changeContext() {
        const year = document.getElementById('yearSelect').value;
        const league = document.getElementById('leagueSelect').value;
        
        if (!db.seasons[year]) db.seasons[year] = {};
        if (!db.seasons[year][league]) {
            db.seasons[year][league] = {
                stats: CLUBS_MASTER[league].map(name => ({ name, v: 0, e: 0, d: 0 })),
                scorers: []
            };
        }
        renderAll();
    }

    function renderAll() {
        const year = document.getElementById('yearSelect').value;
        const league = document.getElementById('leagueSelect').value;
        const data = db.seasons[year][league];

        // Render Tabela
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        // Ordenar por pontos
        const sorted = [...data.stats].sort((a, b) => ((b.v*3)+b.e) - ((a.v*3)+a.e));

        sorted.forEach((club, i) => {
            const pontos = (club.v * 3) + (club.e * 1);
            const jogos = club.v + club.e + club.d;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i+1}º</td>
                <td>${club.name}</td>
                <td>${jogos}</td>
                <td><input type="number" class="input-mini" value="${club.v}" onchange="updateVal('${club.name}','v',this.value)"></td>
                <td><input type="number" class="input-mini" value="${club.e}" onchange="updateVal('${club.name}','e',this.value)"></td>
                <td><input type="number" class="input-mini" value="${club.d}" onchange="updateVal('${club.name}','d',this.value)"></td>
                <td class="points-cell">${pontos}</td>
            `;
            tbody.appendChild(tr);
        });

        // Render Artilheiros
        const sBody = document.getElementById('scorersBody');
        sBody.innerHTML = '';
        data.scorers.sort((a,b) => b.goals - a.goals).forEach((s, i) => {
            sBody.innerHTML += `<tr><td>${s.name}</td><td>${s.goals}</td><td><button onclick="delScorer(${i})">X</button></td></tr>`;
        });
        
        localStorage.setItem('fb_manager_db', JSON.stringify(db));
    }

    function updateVal(clubName, field, val) {
        const year = document.getElementById('yearSelect').value;
        const league = document.getElementById('leagueSelect').value;
        const club = db.seasons[year][league].stats.find(c => c.name === clubName);
        club[field] = parseInt(val) || 0;
        renderAll();
    }

    function addYear() {
        const newYear = prompt("Digite o ano da nova temporada:");
        if (newYear) {
            const sel = document.getElementById('yearSelect');
            const opt = document.createElement('option');
            opt.value = newYear; opt.text = newYear;
            sel.add(opt);
            sel.value = newYear;
            changeContext();
        }
    }

    function saveScorer() {
        const year = document.getElementById('yearSelect').value;
        const league = document.getElementById('leagueSelect').value;
        const name = document.getElementById('pName').value;
        const goals = parseInt(document.getElementById('pGoals').value);
        if(name && goals) {
            db.seasons[year][league].scorers.push({name, goals});
            renderAll();
        }
    }

    function delScorer(i) {
        const year = document.getElementById('yearSelect').value;
        const league = document.getElementById('leagueSelect').value;
        db.seasons[year][league].scorers.splice(i, 1);
        renderAll();
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-'+id).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    changeContext();
</script>
</body>
</html>
