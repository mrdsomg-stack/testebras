<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Manager Hub</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --accent: #00ff88;
            --text: #ffffff;
            --header-bg: #000000;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--header-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
            font-size: 1.5rem;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin-top: 20px;
        }

        /* Glassmorphism Cards */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        select, input {
            background: #1a1a1a;
            color: white;
            border: 1px solid var(--accent);
            padding: 10px;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            border-bottom: 1px solid var(--accent);
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-mini {
            width: 50px;
            text-align: center;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text);
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            border-bottom: 2px solid var(--accent);
            color: var(--accent);
        }
    </style>
</head>
<body>

<header>FOOTBALL MANAGER HUB</header>

<div class="container">
    <!-- Seleção de Contexto -->
    <div class="controls">
        <select id="yearSelect">
            <option value="2026">Temporada 2026</option>
            <option value="2027">Temporada 2027</option>
        </select>
        <select id="leagueSelect" onchange="loadLeague()">
            <option value="la-liga">La Liga</option>
            <option value="premier-league">Premier League</option>
            <option value="bundesliga">Bundesliga</option>
            <option value="ligue-1">Ligue 1</option>
        </select>
    </div>

    <!-- Abas -->
    <div class="card">
        <div>
            <button class="tab-btn active" onclick="showTab('tabela')">Tabela</button>
            <button class="tab-btn" onclick="showTab('artilharia')">Artilheiros</button>
            <button class="tab-btn" onclick="showTab('copa')">Copa Nacional</button>
        </div>

        <hr style="opacity: 0.1; margin: 15px 0;">

        <!-- Conteúdo Tabela -->
        <div id="tab-tabela" class="tab-content">
            <table id="leagueTable">
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Clube</th>
                        <th>V</th>
                        <th>E</th>
                        <th>D</th>
                        <th>Pontos</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- Conteúdo Artilharia -->
        <div id="tab-artilharia" class="tab-content" style="display:none;">
            <h3>Artilharia da Temporada</h3>
            <div id="scorersList">
                <input type="text" id="scorerName" placeholder="Nome do Jogador">
                <input type="number" id="scorerGoals" placeholder="Gols">
                <button onclick="addScorer()" style="background: var(--accent); border:none; padding: 10px; cursor:pointer;">Adicionar</button>
            </div>
            <table style="margin-top:20px;">
                <thead><tr><th>Jogador</th><th>Gols</th></tr></thead>
                <tbody id="scorersBody"></tbody>
            </table>
        </div>

        <!-- Conteúdo Copa (Simplificado) -->
        <div id="tab-copa" class="tab-content" style="display:none;">
            <h3>Mata-Mata (Copa Nacional)</h3>
            <div id="bracket">
                <p>Configure os confrontos abaixo clicando no vencedor para avançar.</p>
                <div id="matchesContainer"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const leaguesData = {
        "la-liga": ["Barcelona", "Real Madrid", "Atletico de Madrid", "Girona", "Getafe", "Espanhol", "Valencia", "Celta Vigo", "Atletico Bilbao", "Villarreal", "Raio Vallecano", "Osasuna", "Real Betis", "Real Sociedad"],
        "premier-league": ["Man City", "Man United", "Liverpool", "Aston Villa", "Chelsea", "Tottenham", "Newcastle"],
        "bundesliga": ["Bayern", "Dortmund", "Leverkusen", "Stuttgart", "Leipzig"],
        "ligue-1": ["PSG", "Lyon", "Marseille", "Monaco", "Lille"]
    };

    let currentStats = {};

    function loadLeague() {
        const league = document.getElementById('leagueSelect').value;
        const clubs = leaguesData[league];
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        clubs.forEach((club, index) => {
            if(!currentStats[club]) currentStats[club] = {v:0, e:0, d:0, p:0};
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}º</td>
                <td>${club}</td>
                <td><input type="number" class="input-mini" value="${currentStats[club].v}" onchange="updateScore('${club}', 'v', this.value)"></td>
                <td><input type="number" class="input-mini" value="${currentStats[club].e}" onchange="updateScore('${club}', 'e', this.value)"></td>
                <td><input type="number" class="input-mini" value="${currentStats[club].d}" onchange="updateScore('${club}', 'd', this.value)"></td>
                <td id="pts-${club}">${currentStats[club].p}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateScore(club, type, val) {
        currentStats[club][type] = parseInt(val) || 0;
        currentStats[club].p = (currentStats[club].v * 3) + (currentStats[club].e * 1);
        document.getElementById(`pts-${club}`).innerText = currentStats[club].p;
        // Aqui você poderia adicionar uma função de sort para reordenar a tabela
    }

    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tabName).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    function addScorer() {
        const name = document.getElementById('scorerName').value;
        const goals = document.getElementById('scorerGoals').value;
        if(name && goals) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${name}</td><td>${goals}</td>`;
            document.getElementById('scorersBody').appendChild(tr);
        }
    }

    // Inicialização
    loadLeague();
</script>

</body>
</html>
