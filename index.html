<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Career Hub - Pro Analytics</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: #1c2126;
            --bg-item: #2c3136;
            --accent: #2fb996;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --gold: #f2ba49;
            --danger: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: #000;
            border-bottom: 1px solid #333;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Navegação */
        .nav-main { display: flex; gap: 15px; margin: 20px 0; }
        .btn-nav {
            background: var(--bg-card); color: var(--text); border: 2px solid transparent;
            padding: 10px 25px; border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        .btn-nav.active { border-color: var(--accent); color: var(--accent); }

        .container { width: 95%; max-width: 900px; }

        /* Cards */
        .card-main { background: var(--bg-card); padding: 25px; border-radius: 15px; margin-bottom: 20px; }
        input, select {
            background: #121212; color: white; border: 1px solid #444;
            padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px;
        }

        .btn-green {
            background: var(--accent); color: white; border: none; padding: 14px;
            border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase;
        }

        .player-row {
            background: var(--bg-card); padding: 15px 25px; border-radius: 12px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }

        /* MODAIS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto; }
        .modal-content { background: var(--bg-card); margin: 2% auto; padding: 30px; width: 90%; max-width: 850px; border-radius: 20px; }
        
        .resumo-total-box {
            background: var(--bg-item); padding: 20px; border-radius: 12px;
            display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; margin-bottom: 20px;
        }
        .resumo-total-box div span { display: block; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }
        .resumo-total-box div b { font-size: 1.6rem; color: var(--gold); }

        .section-box { background: var(--bg-item); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .section-title { font-size: 0.8rem; font-weight: bold; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; display: block; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 0.75rem; color: var(--text-dim); padding: 10px; }
        td { padding: 12px 10px; font-size: 0.9rem; border-bottom: 1px solid #3d4247; }
        tr:nth-child(even) { background: rgba(255,255,255,0.02); }

        .trophy-item { display: inline-block; background: rgba(242, 186, 73, 0.1); color: var(--gold); padding: 5px 12px; border-radius: 15px; margin: 3px; font-size: 0.8rem; border: 1px solid var(--gold); }
        .hidden { display: none; }
    </style>
</head>
<body>

<header>Analytics de Atletas Profissionais</header>

<div class="nav-main">
    <button class="btn-nav active" onclick="switchTab('jogadores')">Jogadores</button>
    <button class="btn-nav" onclick="switchTab('rankings')">Rankings</button>
</div>

<!-- TAB JOGADORES -->
<div class="container" id="tab-jogadores">
    <div class="card-main">
        <label>Nome do Atleta</label>
        <input type="text" id="pName" placeholder="Ex: Caio">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div><label>Ano Início</label><input type="number" id="pYear" value="1906"></div>
            <div><label>Idade Início</label><input type="number" id="pAge" value="19"></div>
        </div>
        <button class="btn-green" onclick="addPlayer()">Cadastrar Jogador</button>
    </div>
    <div id="listContainer"></div>
</div>

<!-- TAB RANKINGS -->
<div class="container hidden" id="tab-rankings">
    <div class="card-main">
        <label>Selecionar Competição</label>
        <select id="rankLeagueSelect" onchange="renderLeagueRanking()"></select>
        <div class="section-box" style="margin-top:20px;">
            <span class="section-title">Maiores Artilheiros</span>
            <table id="leagueRankTable">
                <thead><tr><th>Pos</th><th>Jogador</th><th>Gols</th></tr></thead>
                <tbody id="leagueRankBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL VISUALIZAÇÃO (DESIGN PREMIUM) -->
<div id="viewModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:start;">
            <div><h1 id="vName" style="margin:0;"></h1><p id="vCareer" style="color:var(--text-dim); font-size:0.85rem;"></p></div>
            <button class="btn-nav" style="background:var(--accent); color:white;" onclick="closeModal('viewModal')">SAIR</button>
        </div>

        <div class="resumo-total-box" style="margin-top:20px;">
            <div><span>Jogos</span><b id="tJ">0</b></div>
            <div><span>Gols</span><b id="tG">0</b></div>
            <div><span>Assistências</span><b id="tA">0</b></div>
            <div><span>Títulos</span><b id="tT">0</b></div>
        </div>

        <div class="section-box"><span class="section-title">Galeria de Títulos</span><div id="trophyShelf"></div></div>
        <div class="section-box"><span class="section-title">Estatísticas por Ano</span><table id="tableYear"></table></div>
        <div class="section-box"><span class="section-title">Estatísticas por Liga</span><table id="tableLeague"></table></div>
        <div class="section-box"><span class="section-title">Estatísticas por Clube</span><table id="tableClub"></table></div>

        <button class="btn-green" onclick="openEdit()">GERENCIAR TEMPORADAS</button>
    </div>
</div>

<!-- MODAL EDIÇÃO -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="color:var(--accent); margin:0;">Editar Carreira</h2>
            <button onclick="deletePlayer()" style="background:var(--danger); border:none; color:white; padding:10px; border-radius:10px; cursor:pointer;">EXCLUIR</button>
        </div>
        <div class="section-box" style="margin-top:20px;">
            <span class="section-title">Temporadas</span>
            <button class="btn-nav" style="padding:5px 15px; margin-bottom:10px;" onclick="addStatRow()">+ Nova</button>
            <div style="overflow-x:auto;">
                <table><thead><tr><th>Ano</th><th>Clube</th><th>Liga</th><th>J</th><th>G</th><th>A</th><th></th></tr></thead>
                <tbody id="editBody"></tbody></table>
            </div>
        </div>
        <div class="section-box">
            <span class="section-title">Adicionar Título</span>
            <div style="display:flex; gap:10px;">
                <input type="text" id="tYear" placeholder="Ano" style="width:80px;">
                <input type="text" id="tName" placeholder="Nome do Título">
                <button onclick="addTrophy()" class="btn-nav">OK</button>
            </div>
            <div id="editTrophies" style="margin-top:10px;"></div>
        </div>
        <button class="btn-green" onclick="closeModal('editModal'); render();">SALVAR TUDO</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('fb_hall_v2')) || [];
    let curIdx = null;

    function switchTab(tab) {
        document.getElementById('tab-jogadores').classList.toggle('hidden', tab !== 'jogadores');
        document.getElementById('tab-rankings').classList.toggle('hidden', tab !== 'rankings');
        document.querySelectorAll('.btn-nav').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(tab.substring(0,3))));
        if(tab === 'rankings') updateRankSelect();
    }

    function addPlayer() {
        const name = document.getElementById('pName').value;
        if(!name) return;
        db.push({ name, year: document.getElementById('pYear').value, age: document.getElementById('pAge').value, stats: [], trophies: [] });
        save(); render(); document.getElementById('pName').value = '';
    }

    function render() {
        const cont = document.getElementById('listContainer');
        cont.innerHTML = '';
        db.forEach((p, i) => {
            let tg = p.stats.reduce((a, s) => a + (parseInt(s.g)||0), 0);
            cont.innerHTML += `<div class="player-row" onclick="view(${i})">
                <span><b>${p.name}</b></span>
                <span style="color:var(--accent)">${tg} GOLS | ${p.trophies.length} 🏆</span>
            </div>`;
        });
    }

    function view(i) {
        curIdx = i; const p = db[i];
        document.getElementById('vName').innerText = p.name;
        document.getElementById('vCareer').innerText = `Início em ${p.year} com ${p.age} anos.`;
        
        let totals = {j:0, g:0, a:0}, yMap = {}, lMap = {}, cMap = {};
        p.stats.forEach(s => {
            let j = parseInt(s.j)||0, g = parseInt(s.g)||0, a = parseInt(s.a)||0;
            totals.j += j; totals.g += g; totals.a += a;
            const up = (m, k) => { if(!m[k]) m[k] = {j:0, g:0, a:0}; m[k].j += j; m[k].g += g; m[k].a += a; };
            up(yMap, s.year); up(lMap, s.league); up(cMap, s.club);
        });

        document.getElementById('tJ').innerText = totals.j;
        document.getElementById('tG').innerText = totals.g;
        document.getElementById('tA').innerText = totals.a;
        document.getElementById('tT').innerText = p.trophies.length;
        document.getElementById('trophyShelf').innerHTML = p.trophies.map(t => `<span class="trophy-item">🏆 ${t.year} - ${t.name}</span>`).join('');

        const mkT = (m, h) => `<thead><tr><th>${h}</th><th>J</th><th>G</th><th>A</th></tr></thead><tbody>` + 
            Object.entries(m).map(([k,v]) => `<tr><td>${k}</td><td>${v.j}</td><td>${v.g}</td><td>${v.a}</td></tr>`).join('') + `</tbody>`;

        document.getElementById('tableYear').innerHTML = mkT(yMap, "Ano");
        document.getElementById('tableLeague').innerHTML = mkT(lMap, "Competição");
        document.getElementById('tableClub').innerHTML = mkT(cMap, "Clube");
        document.getElementById('viewModal').style.display = 'block';
    }

    function updateRankSelect() {
        const leagues = new Set();
        db.forEach(p => p.stats.forEach(s => { if(s.league) leagues.add(s.league); }));
        const sel = document.getElementById('rankLeagueSelect');
        sel.innerHTML = Array.from(leagues).sort().map(l => `<option value="${l}">${l}</option>`).join('');
        renderLeagueRanking();
    }

    function renderLeagueRanking() {
        const league = document.getElementById('rankLeagueSelect').value;
        const r = [];
        db.forEach(p => {
            let gols = p.stats.filter(s => s.league === league).reduce((a, b) => a + (parseInt(b.g)||0), 0);
            if(gols > 0) r.push({ name: p.name, gols });
        });
        r.sort((a,b) => b.gols - a.gols);
        document.getElementById('leagueRankBody').innerHTML = r.map((it, idx) => `<tr><td>${idx+1}</td><td>${it.name}</td><td>${it.gols}</td></tr>`).join('');
    }

    function openEdit() { document.getElementById('viewModal').style.display = 'none'; document.getElementById('editModal').style.display = 'block'; renderEditStats(); renderEditTrophies(); }
    
    function renderEditStats() {
        document.getElementById('editBody').innerHTML = db[curIdx].stats.map((s, i) => `<tr>
            <td><input type="text" value="${s.year}" onchange="upS(${i},'year',this.value)"></td>
            <td><input type="text" value="${s.club}" onchange="upS(${i},'club',this.value)"></td>
            <td><input type="text" value="${s.league}" onchange="upS(${i},'league',this.value)"></td>
            <td><input type="number" value="${s.j}" onchange="upS(${i},'j',this.value)"></td>
            <td><input type="number" value="${s.g}" onchange="upS(${i},'g',this.value)"></td>
            <td><input type="number" value="${s.a}" onchange="upS(${i},'a',this.value)"></td>
            <td><button onclick="remS(${i})" style="color:red; background:none; border:none;">X</button></td></tr>`).join('');
    }

    function renderEditTrophies() {
        document.getElementById('editTrophies').innerHTML = db[curIdx].trophies.map((t, i) => 
            `<span class="trophy-item">${t.year} - ${t.name} <b onclick="remT(${i})" style="cursor:pointer; color:red;">X</b></span>`).join('');
    }

    function addStatRow() { db[curIdx].stats.push({year:'', club:'', league:'', j:0, g:0, a:0}); renderEditStats(); }
    function addTrophy() { const y = document.getElementById('tYear').value, n = document.getElementById('tName').value; if(y && n) { db[curIdx].trophies.push({year:y, name:n}); save(); renderEditTrophies(); } }
    function upS(i, f, v) { db[curIdx].stats[i][f] = v; save(); }
    function remS(i) { db[curIdx].stats.splice(i, 1); save(); renderEditStats(); }
    function remT(i) { db[curIdx].trophies.splice(i, 1); save(); renderEditTrophies(); }
    function deletePlayer() { if(confirm("Excluir?")) { db.splice(curIdx, 1); save(); closeModal('editModal'); render(); } }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function save() { localStorage.setItem('fb_hall_v2', JSON.stringify(db)); }
    render();
</script>
</body>
</html>
