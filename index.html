<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Career Hub - Hall of Fame</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: #1c2126;
            --bg-item: #2c3136;
            --accent: #2fb996;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --gold: #f2ba49;
            --danger: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: #000;
            border-bottom: 1px solid #333;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .container { width: 95%; max-width: 900px; margin-top: 20px; }

        .card-main { background: var(--bg-card); padding: 25px; border-radius: 15px; margin-bottom: 20px; }

        input, select {
            background: #121212; color: white; border: 1px solid #444;
            padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box;
            margin-bottom: 10px;
        }

        .btn-green {
            background: var(--accent); color: white; border: none; padding: 14px;
            border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%;
            text-transform: uppercase;
        }

        .player-row {
            background: var(--bg-card); padding: 15px 25px; border-radius: 12px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; border: 1px solid transparent;
        }
        .player-row:hover { border-color: var(--accent); }

        /* MODAL */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto;
        }

        .modal-content {
            background: var(--bg-card); margin: 2% auto; padding: 30px;
            width: 90%; max-width: 850px; border-radius: 20px;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .btn-sair { background: var(--accent); color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        .resumo-total-box {
            background: var(--bg-item); padding: 20px; border-radius: 12px;
            display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; margin-bottom: 20px;
        }
        .resumo-total-box div span { display: block; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }
        .resumo-total-box div b { font-size: 1.6rem; color: var(--gold); }

        .section-box { background: var(--bg-item); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .section-title { font-size: 0.8rem; font-weight: bold; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; display: block; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 0.7rem; color: var(--text-dim); padding: 10px; }
        td { padding: 12px 10px; font-size: 0.85rem; border-bottom: 1px solid #3d4247; }
        tr:nth-child(even) { background: rgba(255,255,255,0.02); }

        .trophy-item { display: inline-block; background: rgba(242, 186, 73, 0.1); color: var(--gold); padding: 5px 12px; border-radius: 15px; margin: 3px; font-size: 0.8rem; border: 1px solid var(--gold); }

        .btn-gerenciar { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>

<header>Hall da Fama do Futebol</header>

<div class="container">
    <div class="card-main">
        <label>Nome do Atleta</label>
        <input type="text" id="pName" placeholder="Ex: Caio">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div><label>Ano Início</label><input type="number" id="pYear" value="1906"></div>
            <div><label>Idade Início</label><input type="number" id="pAge" value="19"></div>
        </div>
        <button class="btn-green" onclick="addPlayer()">Cadastrar Jogador</button>
    </div>
    <div id="listContainer"></div>
</div>

<div id="viewModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div><h1 id="vName" style="margin:0;"></h1><p id="vCareer" style="color:var(--text-dim); font-size:0.85rem;"></p></div>
            <button class="btn-sair" onclick="closeModal('viewModal')">SAIR</button>
        </div>

        <div class="resumo-total-box">
            <div><span>Jogos</span><b id="tJ">0</b></div>
            <div><span>Gols</span><b id="tG">0</b></div>
            <div><span>Assists</span><b id="tA">0</b></div>
            <div><span>Títulos</span><b id="tT">0</b></div>
        </div>

        <div class="section-box">
            <span class="section-title">Galeria de Títulos</span>
            <div id="trophyShelf"></div>
        </div>

        <div class="section-box">
            <span class="section-title">Estatísticas por Ano</span>
            <table id="tableYear"></table>
        </div>

        <button class="btn-gerenciar" onclick="openEdit()">GERENCIAR CARREIRA</button>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="color:var(--accent); margin:0;">Gerenciar Carreira</h2>
            <button class="btn-danger" onclick="deletePlayer()">EXCLUIR JOGADOR</button>
        </div>
        
        <div class="section-box">
            <span class="section-title">Adicionar Título</span>
            <div style="display:flex; gap:10px;">
                <input type="text" id="tYear" placeholder="Ano" style="width:80px;">
                <input type="text" id="tName" placeholder="Nome do Título">
                <button class="btn-sair" onclick="addTrophy()">Adicionar</button>
            </div>
            <div id="editTrophies" style="margin-top:10px;"></div>
        </div>

        <div class="section-box">
            <span class="section-title">Temporadas (Estatísticas)</span>
            <button class="btn-sair" style="margin-bottom:10px;" onclick="addStatRow()">+ Nova Temporada</button>
            <div style="overflow-x:auto;">
                <table>
                    <thead><tr><th>Ano</th><th>Clube</th><th>Liga</th><th>J</th><th>G</th><th>A</th><th></th></tr></thead>
                    <tbody id="editBody"></tbody>
                </table>
            </div>
        </div>
        <button class="btn-green" onclick="closeModal('editModal'); render();">SALVAR E VOLTAR</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('fb_hall_v1')) || [];
    let curIdx = null;

    function addPlayer() {
        const name = document.getElementById('pName').value;
        const year = document.getElementById('pYear').value;
        const age = document.getElementById('pAge').value;
        if(!name) return;
        db.push({ name, year, age, stats: [], trophies: [] });
        save(); render();
        document.getElementById('pName').value = '';
    }

    function render() {
        const cont = document.getElementById('listContainer');
        cont.innerHTML = '';
        db.forEach((p, i) => {
            let tg = p.stats.reduce((a, s) => a + (parseInt(s.g)||0), 0);
            cont.innerHTML += `<div class="player-row" onclick="view(${i})">
                <span><b>${p.name}</b></span>
                <span style="color:var(--accent)">${tg} GOLS | ${p.trophies.length} 🏆</span>
            </div>`;
        });
    }

    function view(i) {
        curIdx = i; const p = db[i];
        document.getElementById('vName').innerText = p.name;
        document.getElementById('vCareer').innerText = `Início em ${p.year} com ${p.age} anos.`;
        
        let totals = {j:0, g:0, a:0}, yMap = {};
        p.stats.forEach(s => {
            let j = parseInt(s.j)||0, g = parseInt(s.g)||0, a = parseInt(s.a)||0;
            totals.j += j; totals.g += g; totals.a += a;
            if(!yMap[s.year]) yMap[s.year] = {j:0, g:0, a:0}; yMap[s.year].j += j; yMap[s.year].g += g; yMap[s.year].a += a;
        });

        document.getElementById('tJ').innerText = totals.j; document.getElementById('tG').innerText = totals.g;
        document.getElementById('tA').innerText = totals.a; document.getElementById('tT').innerText = p.trophies.length;
        document.getElementById('trophyShelf').innerHTML = p.trophies.map(t => `<span class="trophy-item">🏆 ${t.year} - ${t.name}</span>`).join('');

        const mkT = (m, h) => `<thead><tr><th>${h}</th><th>J</th><th>G</th><th>A</th></tr></thead><tbody>` + 
            Object.entries(m).map(([k,v])=>`<tr><td>${k}</td><td>${v.j}</td><td>${v.g}</td><td>${v.a}</td></tr>`).join('') + `</tbody>`;
        document.getElementById('tableYear').innerHTML = mkT(yMap, "Ano");
        document.getElementById('viewModal').style.display = 'block';
    }

    function openEdit() {
        document.getElementById('viewModal').style.display = 'none';
        document.getElementById('editModal').style.display = 'block';
        renderEditTrophies(); renderEditStats();
    }

    function deletePlayer() {
        if(confirm(`Tem certeza que deseja excluir o jogador ${db[curIdx].name}? Essa ação não pode ser desfeita.`)) {
            db.splice(curIdx, 1);
            save();
            closeModal('editModal');
            render();
        }
    }

    function renderEditTrophies() {
        document.getElementById('editTrophies').innerHTML = db[curIdx].trophies.map((t, i) => 
            `<span class="trophy-item">${t.year} - ${t.name} <b onclick="remT(${i})" style="cursor:pointer; color:red;">X</b></span>`).join('');
    }

    function addTrophy() {
        const year = document.getElementById('tYear').value; const name = document.getElementById('tName').value;
        if(year && name) { db[curIdx].trophies.push({year, name}); save(); renderEditTrophies(); document.getElementById('tYear').value = ''; document.getElementById('tName').value = ''; }
    }

    function renderEditStats() {
        document.getElementById('editBody').innerHTML = db[curIdx].stats.map((s, i) => `<tr>
            <td><input type="text" value="${s.year}" onchange="upS(${i},'year',this.value)"></td>
            <td><input type="text" value="${s.club}" onchange="upS(${i},'club',this.value)"></td>
            <td><input type="text" value="${s.league}" onchange="upS(${i},'league',this.value)"></td>
            <td><input type="number" value="${s.j}" onchange="upS(${i},'j',this.value)"></td>
            <td><input type="number" value="${s.g}" onchange="upS(${i},'g',this.value)"></td>
            <td><input type="number" value="${s.a}" onchange="upS(${i},'a',this.value)"></td>
            <td><button onclick="remS(${i})" style="color:red; background:none; border:none;">X</button></td>
        </tr>`).join('');
    }

    function addStatRow() { db[curIdx].stats.push({year:'', club:'', league:'', j:0, g:0, a:0}); renderEditStats(); }
    function upS(i, f, v) { db[curIdx].stats[i][f] = v; save(); }
    function remS(i) { db[curIdx].stats.splice(i, 1); save(); renderEditStats(); }
    function remT(i) { db[curIdx].trophies.splice(i, 1); save(); renderEditTrophies(); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function save() { localStorage.setItem('fb_hall_v1', JSON.stringify(db)); }
    render();
</script>
</body>
</html>
