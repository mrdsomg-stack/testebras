<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football History Manager</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --accent: #00ff88;
            --text: #ffffff;
            --header-bg: #000000;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--header-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
            text-transform: uppercase;
        }

        .container { width: 95%; max-width: 1200px; margin-top: 20px; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }

        select, input, button {
            background: #1a1a1a;
            color: white;
            border: 1px solid var(--accent);
            padding: 10px;
            border-radius: 5px;
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; border-bottom: 2px solid var(--accent); padding: 12px; color: var(--accent); }
        td { padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

        .pos-input { width: 60px; text-align: center; background: transparent; border: 1px solid #333; color: white; }
        
        .tab-btn { background: none; border: none; color: var(--text); padding: 10px; cursor: pointer; opacity: 0.5; }
        .tab-btn.active { opacity: 1; border-bottom: 2px solid var(--accent); }
        
        .trophy-card {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 215, 0, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid gold;
        }
    </style>
</head>
<body>

<header>Football History Hub</header>

<div class="container">
    <div class="controls">
        <select id="yearSelect" onchange="changeContext()">
            <option value="2026">2026</option>
            <option value="1900">1900</option>
        </select>
        <button onclick="addNewYear()">+ Novo Ano</button>
        
        <select id="leagueSelect" onchange="changeContext()">
            <option value="la-liga">La Liga</option>
            <option value="premier-league">Premier League</option>
            <option value="bundesliga">Bundesliga</option>
            <option value="ligue-1">Ligue 1</option>
        </select>
    </div>

    <div class="card">
        <div class="nav">
            <button class="tab-btn active" onclick="showTab('classificacao')">Classificação Final</button>
            <button class="tab-btn" onclick="showTab('titulos')">Galeria de Títulos</button>
        </div>

        <hr style="opacity:0.1; margin: 20px 0;">

        <!-- Aba Classificação -->
        <div id="tab-classificacao" class="tab-content">
            <table>
                <thead>
                    <tr>
                        <th>Posição Final</th>
                        <th>Clube</th>
                    </tr>
                </thead>
                <tbody id="rankingBody"></tbody>
            </table>
        </div>

        <!-- Aba Títulos -->
        <div id="tab-titulos" class="tab-content" style="display:none;">
            <h3>Campeões Históricos</h3>
            <div id="titulosList"></div>
        </div>
    </div>
</div>

<script>
    const CLUBS = {
        "la-liga": ["Barcelona", "Real Madrid", "Atletico de Madrid", "Girona", "Getafe", "Espanhol", "Valencia", "Celta Vigo", "Atletico Bilbao", "Villarreal", "Raio Vallecano", "Osasuna", "Real Betis", "Real Sociedad"],
        "premier-league": ["Manchester City", "Manchester United", "Liverpool", "Aston Villa", "Bournemouth", "Chelsea", "Everton", "Tottenham", "Newcastle", "Wolverhampton", "Nottigham Forest", "Fulham", "Sunderland"],
        "bundesliga": ["Bayern Munich", "Borussia Dortmund", "RB Leipzig", "Bayer Leverkusen", "Stuttgart", "Freiburb", "Augsburg", "Mainz 05", "Hamburgo", "Werder Bremen", "Wolfsburg", "Eitracht Frankfurk", "Koln", "Heidenheim"],
        "ligue-1": ["Lens", "Lyon", "Lile", "Rennes", "Monaco", "Marseille", "Lorient", "Toulouse", "Le Havre", "Nice", "Auxerre", "Nantes", "Strasbourg"]
    };

    // Banco de dados inicializado do LocalStorage
    let historyDB = JSON.parse(localStorage.getItem('fb_history_db')) || { years: {} };

    function changeContext() {
        const year = document.getElementById('yearSelect').value;
        const league = document.getElementById('leagueSelect').value;

        if (!historyDB.years[year]) historyDB.years[year] = {};
        if (!historyDB.years[year][league]) {
            historyDB.years[year][league] = {
                ranking: CLUBS[league].map(name => ({ name, pos: "" })),
                champion: ""
            };
        }
        renderData();
    }

    function renderData() {
        const year = document.getElementById('yearSelect').value;
        const league = document.getElementById('leagueSelect').value;
        const data = historyDB.years[year][league];

        // Renderizar Classificação
        const rBody = document.getElementById('rankingBody');
        rBody.innerHTML = '';
        data.ranking.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="number" class="pos-input" value="${item.pos}" placeholder="--" onchange="updatePos('${item.name}', this.value)">º</td>
                <td>${item.name}</td>
            `;
            rBody.appendChild(tr);
        });

        // Renderizar Títulos (Histórico Global da Liga Selecionada)
        const tList = document.getElementById('titulosList');
        tList.innerHTML = '';
        Object.keys(historyDB.years).forEach(y => {
            const champ = historyDB.years[y][league]?.champion;
            if(champ) {
                tList.innerHTML += `
                    <div class="trophy-card">
                        <span><strong>${y}</strong> - ${league.replace('-',' ').toUpperCase()}</span>
                        <span>🏆 ${champ}</span>
                    </div>
                `;
            }
        });

        localStorage.setItem('fb_history_db', JSON.stringify(historyDB));
    }

    function updatePos(clubName, val) {
        const year = document.getElementById('yearSelect').value;
        const league = document.getElementById('leagueSelect').value;
        const club = historyDB.years[year][league].ranking.find(c => c.name === clubName);
        club.pos = val;

        // Se a posição for 1, define como campeão automaticamente
        if(val == "1") {
            historyDB.years[year][league].champion = clubName;
        } else if (historyDB.years[year][league].champion === clubName) {
            historyDB.years[year][league].champion = "";
        }
        renderData();
    }

    function addNewYear() {
        const y = prompt("Digite o ano:");
        if(y) {
            const sel = document.getElementById('yearSelect');
            const opt = document.createElement('option');
            opt.value = y; opt.text = y;
            sel.add(opt);
            sel.value = y;
            changeContext();
        }
    }

    function showTab(tab) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-'+tab).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    changeContext();
</script>
</body>
</html>
