<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Career Hub - Brenda Edition</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: #151515;
            --accent: #00ff88;
            --text: #ffffff;
            --header-bg: #000000;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--header-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            text-transform: uppercase;
            font-weight: bold;
        }

        .container { width: 95%; max-width: 900px; margin-top: 20px; }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h3 { color: var(--accent); margin-top: 0; }

        input, select {
            background: #202020;
            color: white;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .btn {
            background: var(--accent);
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* Modal Style */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--bg-card);
            margin: 5% auto;
            padding: 25px;
            width: 90%;
            max-width: 800px;
            border-radius: 15px;
            border: 1px solid var(--accent);
        }

        .table-edit { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .table-edit th { text-align: left; color: var(--accent); padding: 10px; border-bottom: 1px solid #333; }
        .table-edit td { padding: 5px; }

        .btn-edit { background: #333; color: white; border: 1px solid #555; padding: 5px 15px; border-radius: 4px; cursor: pointer; }
        .btn-save-modal { background: var(--accent); color: black; margin-top: 20px; }
        .btn-add-line { background: transparent; color: var(--accent); border: 1px dotted var(--accent); margin-bottom: 10px; }
    </style>
</head>
<body>

<header>Gestão de Atletas Profissionais</header>

<div class="container">
    <!-- CADASTRO MESTRE -->
    <div class="card">
        <h3>👤 Cadastro de Novo Jogador</h3>
        <input type="text" id="newPlayerName" placeholder="Digite o nome do craque...">
        <button class="btn" onclick="addPlayer()">Cadastrar Jogador</button>
    </div>

    <!-- LISTA DE JOGADORES -->
    <div class="card">
        <h3>Lista de Atletas</h3>
        <div id="playersContainer"></div>
    </div>
</div>

<!-- MODAL DE EDIÇÃO DE ESTATÍSTICAS -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h2 id="modalPlayerName" style="color: var(--accent);"></h2>
        <p>Edite as estatísticas de cada temporada abaixo:</p>
        
        <button class="btn btn-add-line" onclick="addNewStatLine()">+ Adicionar Nova Temporada</button>
        
        <table class="table-edit">
            <thead>
                <tr>
                    <th>Ano</th>
                    <th>Clube</th>
                    <th>Competição</th>
                    <th>Jogos</th>
                    <th>Gols</th>
                    <th>Assists</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="modalTableBody"></tbody>
        </table>

        <button class="btn btn-save-modal" onclick="closeModal()">Salvar e Fechar</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('fb_players_v3')) || [];
    let currentPlayerIndex = null;

    function addPlayer() {
        const name = document.getElementById('newPlayerName').value;
        if(!name) return;
        db.push({ name: name, stats: [] });
        save();
        document.getElementById('newPlayerName').value = '';
        renderPlayers();
    }

    function renderPlayers() {
        const container = document.getElementById('playersContainer');
        container.innerHTML = '';
        
        db.forEach((player, index) => {
            let totalG = player.stats.reduce((acc, s) => acc + (parseInt(s.g) || 0), 0);
            container.innerHTML += `
                <div class="player-row">
                    <div>
                        <strong>${player.name}</strong><br>
                        <small style="color: #888;">Total na Carreira: ${totalG} Gols</small>
                    </div>
                    <button class="btn-edit" onclick="openModal(${index})">Editar Estatísticas</button>
                </div>
            `;
        });
    }

    function openModal(index) {
        currentPlayerIndex = index;
        const player = db[index];
        document.getElementById('modalPlayerName').innerText = player.name;
        document.getElementById('editModal').style.display = 'block';
        renderModalTable();
    }

    function renderModalTable() {
        const tbody = document.getElementById('modalTableBody');
        tbody.innerHTML = '';
        
        db[currentPlayerIndex].stats.forEach((s, sIdx) => {
            tbody.innerHTML += `
                <tr>
                    <td><input type="text" value="${s.year}" onchange="updateStat(${sIdx}, 'year', this.value)"></td>
                    <td><input type="text" value="${s.club}" onchange="updateStat(${sIdx}, 'club', this.value)"></td>
                    <td><input type="text" value="${s.comp}" onchange="updateStat(${sIdx}, 'comp', this.value)"></td>
                    <td><input type="number" value="${s.j}" onchange="updateStat(${sIdx}, 'j', this.value)"></td>
                    <td><input type="number" value="${s.g}" onchange="updateStat(${sIdx}, 'g', this.value)"></td>
                    <td><input type="number" value="${s.a}" onchange="updateStat(${sIdx}, 'a', this.value)"></td>
                    <td><button onclick="removeStat(${sIdx})" style="color:red; background:none; border:none;">X</button></td>
                </tr>
            `;
        });
    }

    function addNewStatLine() {
        db[currentPlayerIndex].stats.push({ year: '2026', club: '', comp: '', j: 0, g: 0, a: 0 });
        renderModalTable();
    }

    function updateStat(sIdx, field, val) {
        db[currentPlayerIndex].stats[sIdx][field] = val;
        save();
    }

    function removeStat(sIdx) {
        db[currentPlayerIndex].stats.splice(sIdx, 1);
        save();
        renderModalTable();
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
        renderPlayers();
    }

    function save() {
        localStorage.setItem('fb_players_v3', JSON.stringify(db));
    }

    // Inicialização
    renderPlayers();
</script>
</body>
</html>
