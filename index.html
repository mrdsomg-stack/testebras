<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Awards Manager</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --accent: #00ff88;
            --text: #ffffff;
            --header-bg: #000000;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--header-bg);
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .container { width: 95%; max-width: 900px; margin-top: 30px; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            margin-bottom: 20px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        label { display: block; margin-bottom: 8px; color: var(--accent); font-size: 0.8rem; text-transform: uppercase; }

        select, input, textarea {
            width: 100%;
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--accent); outline: none; }

        button {
            width: 100%;
            background: var(--accent);
            color: black;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        button:hover { opacity: 0.8; transform: translateY(-2px); }

        .history-item {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            border-left: 4px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-info b { color: var(--accent); }
        .scorers-text { font-size: 0.9rem; color: #aaa; margin-top: 5px; }
        
        .empty-msg { text-align: center; opacity: 0.5; margin-top: 20px; }
    </style>
</head>
<body>

<header>Hall da Fama do Futebol</header>

<div class="container">
    <!-- Formulário de Registro -->
    <div class="card">
        <h3>🏆 Registrar Temporada</h3>
        <div class="form-group">
            <div>
                <label>Ano / Temporada</label>
                <input type="text" id="yearInput" placeholder="Ex: 2026 ou 1900">
            </div>
            <div>
                <label>Liga</label>
                <select id="leagueSelect" onchange="loadHistory()">
                    <option value="La Liga">La Liga</option>
                    <option value="Premier League">Premier League</option>
                    <option value="Bundesliga">Bundesliga</option>
                    <option value="Ligue 1">Ligue 1</option>
                </select>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <label>Clube Campeão</label>
            <input type="text" id="championInput" placeholder="Nome do time vencedor">
        </div>

        <div style="margin-bottom: 20px;">
            <label>Artilheiros (Nome - Gols)</label>
            <textarea id="scorersInput" rows="3" placeholder="Ex: Benzema - 25 gols&#10;Vinicius Jr - 20 gols"></textarea>
        </div>

        <button onclick="saveSeason()">Salvar Registro</button>
    </div>

    <!-- Histórico -->
    <div class="card">
        <h3>📜 Histórico de Conquistas</h3>
        <div id="historyContainer">
            <!-- Os registros aparecerão aqui -->
        </div>
    </div>
</div>

<script>
    // Banco de dados: { "La Liga": [{year: 2026, champion: "Real", scorers: "..."}, ...] }
    let awardsDB = JSON.parse(localStorage.getItem('fb_awards_db')) || {};

    function saveSeason() {
        const year = document.getElementById('yearInput').value;
        const league = document.getElementById('leagueSelect').value;
        const champion = document.getElementById('championInput').value;
        const scorers = document.getElementById('scorersInput').value;

        if(!year || !champion) {
            alert("Por favor, preencha o ano e o campeão!");
            return;
        }

        if(!awardsDB[league]) awardsDB[league] = [];

        // Atualiza se já existir o ano, senão adiciona novo
        const existingIdx = awardsDB[league].findIndex(item => item.year === year);
        const entry = { year, champion, scorers };

        if(existingIdx > -1) {
            awardsDB[league][existingIdx] = entry;
        } else {
            awardsDB[league].push(entry);
        }

        // Ordenar por ano (do mais recente para o mais antigo)
        awardsDB[league].sort((a, b) => b.year - a.year);

        localStorage.setItem('fb_awards_db', JSON.stringify(awardsDB));
        
        // Limpar campos
        document.getElementById('yearInput').value = '';
        document.getElementById('championInput').value = '';
        document.getElementById('scorersInput').value = '';
        
        loadHistory();
    }

    function loadHistory() {
        const league = document.getElementById('leagueSelect').value;
        const container = document.getElementById('historyContainer');
        container.innerHTML = '';

        const history = awardsDB[league] || [];

        if(history.length === 0) {
            container.innerHTML = '<p class="empty-msg">Nenhum título registrado para esta liga ainda.</p>';
            return;
        }

        history.forEach((data, index) => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="history-info">
                    <b>Ano ${data.year}:</b> ${data.champion} 🏆
                    <div class="scorers-text">🎯 ${data.scorers.replace(/\n/g, ' | ')}</div>
                </div>
                <button onclick="deleteEntry('${league}', ${index})" style="width: 40px; padding: 5px; background: #ff4444; color: white;">X</button>
            `;
            container.appendChild(item);
        });
    }

    function deleteEntry(league, index) {
        if(confirm("Deseja excluir este registro?")) {
            awardsDB[league].splice(index, 1);
            localStorage.setItem('fb_awards_db', JSON.stringify(awardsDB));
            loadHistory();
        }
    }

    // Inicializar
    loadHistory();
</script>

</body>
</html>
