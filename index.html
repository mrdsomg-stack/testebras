<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Awards Hub - Ranking</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --accent: #00ff88;
            --text: #ffffff;
            --header-bg: #000000;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--header-bg);
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .container { width: 95%; max-width: 900px; margin-top: 30px; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            margin-bottom: 20px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        label { display: block; margin-bottom: 8px; color: var(--accent); font-size: 0.8rem; text-transform: uppercase; }

        select, input, textarea {
            width: 100%;
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: var(--accent);
            color: black;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .tab-btn { background: none; border: none; color: var(--text); padding: 10px 20px; cursor: pointer; opacity: 0.5; }
        .tab-btn.active { opacity: 1; border-bottom: 2px solid var(--accent); color: var(--accent); }

        .history-item, .rank-item {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            border-left: 4px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rank-number {
            background: var(--accent);
            color: black;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 10px;
        }

        .delete-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<header>Hall da Fama do Futebol</header>

<div class="container">
    <!-- Formulário -->
    <div class="card">
        <h3>🏆 Registrar Temporada</h3>
        <div class="form-group">
            <div>
                <label>Ano</label>
                <input type="text" id="yearInput" placeholder="Ex: 2026">
            </div>
            <div>
                <label>Liga</label>
                <select id="leagueSelect" onchange="updateClubs(); loadContent();">
                    <option value="La Liga">La Liga</option>
                    <option value="Premier League">Premier League</option>
                    <option value="Bundesliga">Bundesliga</option>
                    <option value="Ligue 1">Ligue 1</option>
                </select>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <label>Clube Campeão</label>
            <select id="clubSelect"></select>
        </div>

        <div style="margin-bottom: 20px;">
            <label>Artilheiros</label>
            <textarea id="scorersInput" rows="2" placeholder="Nome - Gols"></textarea>
        </div>

        <button onclick="saveSeason()">Salvar Registro</button>
    </div>

    <!-- Abas de Exibição -->
    <div class="card">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="tab-btn active" id="btnHist" onclick="showTab('hist')">Histórico</button>
            <button class="tab-btn" id="btnRank" onclick="showTab('rank')">Ranking de Títulos</button>
        </div>

        <div id="contentArea"></div>
    </div>
</div>

<script>
    const CLUBS_DATA = {
        "La Liga": ["Barcelona", "Real Madrid", "Atletico de Madrid", "Girona", "Getafe", "Espanhol", "Valencia", "Celta Vigo", "Atletico Bilbao", "Villarreal", "Raio Vallecano", "Osasuna", "Real Betis", "Real Sociedad"],
        "Premier League": ["Manchester City", "Manchester United", "Liverpool", "Aston Villa", "Bournemouth", "Chelsea", "Everton", "Tottenham", "Newcastle", "Wolverhampton", "Nottigham Forest", "Fulham", "Sunderland"],
        "Bundesliga": ["Bayern Munich", "Borussia Dortmund", "RB Leipzig", "Bayer Leverkusen", "Stuttgart", "Freiburb", "Augsburg", "Mainz 05", "Hamburgo", "Werder Bremen", "Wolfsburg", "Eitracht Frankfurk", "Koln", "Heidenheim"],
        "Ligue 1": ["Lens", "Lyon", "Lile", "Rennes", "Monaco", "Marseille", "Lorient", "Toulouse", "Le Havre", "Nice", "Auxerre", "Nantes", "Strasbourg"]
    };

    let awardsDB = JSON.parse(localStorage.getItem('fb_awards_db_v2')) || {};
    let currentTab = 'hist';

    function updateClubs() {
        const league = document.getElementById('leagueSelect').value;
        const clubSel = document.getElementById('clubSelect');
        clubSel.innerHTML = CLUBS_DATA[league].map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function saveSeason() {
        const year = document.getElementById('yearInput').value;
        const league = document.getElementById('leagueSelect').value;
        const champion = document.getElementById('clubSelect').value;
        const scorers = document.getElementById('scorersInput').value;

        if(!year) return alert("Digite o ano!");
        if(!awardsDB[league]) awardsDB[league] = [];
        
        awardsDB[league].push({ year, champion, scorers });
        awardsDB[league].sort((a,b) => b.year - a.year);
        
        localStorage.setItem('fb_awards_db_v2', JSON.stringify(awardsDB));
        loadContent();
    }

    function loadContent() {
        const league = document.getElementById('leagueSelect').value;
        const container = document.getElementById('contentArea');
        container.innerHTML = '';
        const data = awardsDB[league] || [];

        if(currentTab === 'hist') {
            data.forEach((item, index) => {
                container.innerHTML += `
                    <div class="history-item">
                        <div><b>Ano ${item.year}:</b> ${item.champion} 🏆<br><small>🎯 ${item.scorers}</small></div>
                        <button class="delete-btn" onclick="deleteEntry('${league}', ${index})">X</button>
                    </div>`;
            });
        } else {
            const counts = {};
            data.forEach(item => counts[item.champion] = (counts[item.champion] || 0) + 1);
            const sortedRank = Object.entries(counts).sort((a,b) => b[1] - a[1]);
            
            sortedRank.forEach(([club, count]) => {
                container.innerHTML += `
                    <div class="rank-item">
                        <span>${club}</span>
                        <span><span class="rank-number">${count}</span> Títulos</span>
                    </div>`;
            });
        }
    }

    function showTab(tab) {
        currentTab = tab;
        document.getElementById('btnHist').classList.toggle('active', tab === 'hist');
        document.getElementById('btnRank').classList.toggle('active', tab === 'rank');
        loadContent();
    }

    function deleteEntry(league, index) {
        awardsDB[league].splice(index, 1);
        localStorage.setItem('fb_awards_db_v2', JSON.stringify(awardsDB));
        loadContent();
    }

    updateClubs();
    loadContent();
</script>
</body>
</html>
