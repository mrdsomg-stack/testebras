<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Awards Hub - Ultra</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --accent: #00ff88;
            --text: #ffffff;
            --header-bg: #000000;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--header-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
            text-transform: uppercase;
        }

        .container { width: 95%; max-width: 800px; margin-top: 20px; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        label { display: block; margin-bottom: 8px; color: var(--accent); font-size: 0.75rem; text-transform: uppercase; font-weight: bold; }

        select, input {
            width: 100%;
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .row { display: flex; gap: 10px; }
        .flex-2 { flex: 2; }
        .flex-1 { flex: 1; }

        .btn-add { background: #333; color: var(--accent); border: 1px solid var(--accent); padding: 10px; cursor: pointer; border-radius: 8px; margin-bottom: 15px; }
        .btn-main { width: 100%; background: var(--accent); color: black; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        .nav-tabs { display: flex; border-bottom: 1px solid #333; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { background: none; border: none; color: var(--text); padding: 10px 15px; cursor: pointer; opacity: 0.5; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { opacity: 1; border-bottom: 2px solid var(--accent); color: var(--accent); }

        .history-item { background: #141414; border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 5px solid var(--accent); position: relative; }
        .scorer-line { font-size: 0.9rem; color: #ccc; margin-top: 4px; display: flex; align-items: center; }
        .scorer-line::before { content: '🎯'; margin-right: 8px; }

        .list-item { display: flex; justify-content: space-between; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 8px; }
        .badge { background: var(--accent); color: black; padding: 2px 10px; border-radius: 20px; font-weight: bold; }
        
        .del-btn { position: absolute; top: 15px; right: 15px; background: #ff4d4d; color: white; border: none; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
    </style>
</head>
<body>

<header>Hall da Fama do Futebol</header>

<div class="container">
    <div class="card">
        <h3>🏆 Registrar Temporada</h3>
        <div class="row">
            <div class="flex-1">
                <label>Ano</label>
                <input type="text" id="yearInput" placeholder="Ex: 2026">
            </div>
            <div class="flex-1">
                <label>Liga</label>
                <select id="leagueSelect" onchange="updateClubs(); loadContent();">
                    <option value="La Liga">La Liga</option>
                    <option value="Premier League">Premier League</option>
                    <option value="Bundesliga">Bundesliga</option>
                    <option value="Ligue 1">Ligue 1</option>
                </select>
            </div>
        </div>

        <label>Clube Campeão</label>
        <select id="clubSelect"></select>

        <label>Artilheiros</label>
        <div id="scorersInputs">
            <div class="row">
                <input type="text" class="flex-2 s-name" placeholder="Jogador">
                <input type="number" class="flex-1 s-goals" placeholder="Gols">
            </div>
        </div>
        <button class="btn-add" onclick="addField()">+ Outro Artilheiro</button>
        <button class="btn-main" onclick="save()">Salvar Registro</button>
    </div>

    <div class="card">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="showTab('hist', this)">Histórico</button>
            <button class="tab-btn" onclick="showTab('rankClub', this)">Ranking de Títulos</button>
            <button class="tab-btn" onclick="showTab('rankGoal', this)">Ranking de Gols</button>
        </div>
        <div id="contentArea"></div>
    </div>
</div>

<script>
    const CLUBS = {
        "La Liga": ["Barcelona", "Real Madrid", "Atletico de Madrid", "Girona", "Getafe", "Espanhol", "Valencia", "Celta Vigo", "Atletico Bilbao", "Villarreal", "Raio Vallecano", "Osasuna", "Real Betis", "Real Sociedad"],
        "Premier League": ["Manchester City", "Manchester United", "Liverpool", "Aston Villa", "Bournemouth", "Chelsea", "Everton", "Tottenham", "Newcastle", "Wolverhampton", "Nottigham Forest", "Fulham", "Sunderland"],
        "Bundesliga": ["Bayern Munich", "Borussia Dortmund", "RB Leipzig", "Bayer Leverkusen", "Stuttgart", "Freiburb", "Augsburg", "Mainz 05", "Hamburgo", "Werder Bremen", "Wolfsburg", "Eitracht Frankfurk", "Koln", "Heidenheim"],
        "Ligue 1": ["Lens", "Lyon", "Lile", "Rennes", "Monaco", "Marseille", "Lorient", "Toulouse", "Le Havre", "Nice", "Auxerre", "Nantes", "Strasbourg"]
    };

    let db = JSON.parse(localStorage.getItem('fb_ultra_db')) || {};
    let currentTab = 'hist';

    function updateClubs() {
        const l = document.getElementById('leagueSelect').value;
        document.getElementById('clubSelect').innerHTML = CLUBS[l].map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function addField() {
        const d = document.createElement('div'); d.className = 'row';
        d.innerHTML = `<input type="text" class="flex-2 s-name" placeholder="Jogador"><input type="number" class="flex-1 s-goals" placeholder="Gols">`;
        document.getElementById('scorersInputs').appendChild(d);
    }

    function save() {
        const y = document.getElementById('yearInput').value;
        const l = document.getElementById('leagueSelect').value;
        const c = document.getElementById('clubSelect').value;
        const ns = document.querySelectorAll('.s-name'), gs = document.querySelectorAll('.s-goals');
        let scs = []; ns.forEach((n, i) => { if(n.value) scs.push({n: n.value, g: parseInt(gs[i].value) || 0}); });

        if(!y) return alert("Ano?");
        if(!db[l]) db[l] = [];
        db[l].push({ y, c, scs });
        db[l].sort((a,b) => b.y - a.y);
        localStorage.setItem('fb_ultra_db', JSON.stringify(db));
        location.reload(); 
    }

    function loadContent() {
        const l = document.getElementById('leagueSelect').value;
        const cont = document.getElementById('contentArea');
        cont.innerHTML = '';
        const data = db[l] || [];

        if(currentTab === 'hist') {
            data.forEach((it, idx) => {
                let sHtml = it.scs.map(s => `<div class="scorer-line">${s.n} - ${s.g}</div>`).join('');
                cont.innerHTML += `<div class="history-item"><b>Ano ${it.y}:</b> ${it.c} 🏆<br>${sHtml}<button class="del-btn" onclick="del('${l}',${idx})">X</button></div>`;
            });
        } else if(currentTab === 'rankClub') {
            let r = {}; data.forEach(i => r[i.c] = (r[i.c] || 0) + 1);
            Object.entries(r).sort((a,b)=>b[1]-a[1]).forEach(([cl, v]) => {
                cont.innerHTML += `<div class="list-item"><span>${cl}</span><span class="badge">${v} Títulos</span></div>`;
            });
        } else {
            let r = {}; data.forEach(i => i.scs.forEach(s => r[s.n] = (r[s.n] || 0) + s.g));
            Object.entries(r).sort((a,b)=>b[1]-a[1]).forEach(([n, g]) => {
                cont.innerHTML += `<div class="list-item"><span>${n}</span><span class="badge">${g} Gols Totais</span></div>`;
            });
        }
    }

    function showTab(t, b) {
        currentTab = t;
        document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        loadContent();
    }

    function del(l, i) { db[l].splice(i, 1); localStorage.setItem('fb_ultra_db', JSON.stringify(db)); loadContent(); }

    updateClubs(); loadContent();
</script>
</body>
</html>
